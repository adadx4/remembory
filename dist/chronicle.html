// ── Licence key validation ─────────────────────────────────────
// Keys are issued by Remembory (Stripe or PayPal subscription, or manual).
// Validated against the social worker. Cached in localStorage for offline use.
const LS_CACHE_KEY = "chronicle-licence-cache";

function loadLicenceCache() {
  try { return JSON.parse(localStorage.getItem(LS_CACHE_KEY)||"null"); } catch(e) { return null; }
}
function saveLicenceCache(data) {
  try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(data)); } catch(e) {}
}
function clearLicenceCache() {
  try { localStorage.removeItem(LS_CACHE_KEY); } catch(e) {}
}

async function validateLicenceKey(key) {
  if (!key) return null;
  const clean = key.trim();
  if (!clean) return null;
  const cached = loadLicenceCache();
  // If we have a valid cached result for this key, use it immediately —
  // then recheck in the background so the cache stays fresh for next time.
  if (cached && cached.key === clean && cached.status === "active") {
    // Background refresh — don't await, never blocks the user
    fetch("https://social.remembory.net/license/check?key=" + encodeURIComponent(clean))
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d) saveLicenceCache({key: clean, checked: Date.now(), status: d.status, renewedAt: d.renewedAt}); })
      .catch(() => {});
    return {valid: true, tier: "subscriber", status: cached.status, renewedAt: cached.renewedAt};
  }
  // No valid cache — must go online to activate
  try {
    const r = await fetch("https://social.remembory.net/license/check?key=" + encodeURIComponent(clean));
    if (!r.ok) throw new Error("server");
    const d = await r.json();
    saveLicenceCache({key: clean, checked: Date.now(), status: d.status, renewedAt: d.renewedAt});
    if (d.valid) return {valid: true, tier: "subscriber", status: d.status, renewedAt: d.renewedAt};
    return {valid: false, reason: d.status === "cancelled" || d.status === "suspended" ? "expired" : "invalid"};
  } catch(e) {
    return {valid: false, reason: "unavailable"};
  }
}

function fuzzyDateLabel(m) {
  const { year, month, day, fuzzy, season } = m;
  function startLabel() {
    if (fuzzy==="uncertain") return year ? `${year}?` : "Date unknown";
    if (fuzzy==="decade") return `${Math.floor(year/10)*10}s`;
    if (fuzzy==="year") return `${year}`;
    if (fuzzy==="season") return `${season} ${year}`;
    if (fuzzy==="month") return `${MONTHS[month-1]} ${year}`;
    return `${MONTHS[month-1]} ${day}, ${year}`;
  }
  if (!m.endFuzzy) return startLabel();
  if (m.endOngoing) return `${startLabel()} – present`;
  function endLabel() {
    const { endYear:ey, endMonth:em, endDay:ed, endFuzzy:ef, endSeason:es } = m;
    if (ef==="decade") return `${Math.floor(ey/10)*10}s`;
    if (ef==="year") return `${ey}`;
    if (ef==="season") return `${es||"Early"} ${ey}`;
    if (ef==="month") return `${MONTHS[(em||1)-1]} ${ey}`;
    return `${MONTHS[(em||1)-1]} ${ed||1}, ${ey}`;
  }
  return `${startLabel()} – ${endLabel()}`;
}

function sortKey(m) {
  const mv = m.fuzzy==="month"||m.fuzzy==="day" ? (m.month||1) :
             m.fuzzy==="season" ? (m.season==="Early"?2:m.season==="Mid"?6:m.season==="Late"?10:6) : 1;
  return m.year*10000 + mv*100 + (m.fuzzy==="day"?m.day||1:1);
}

// ── Location helpers ───────────────────────────────────────────
// knownLocations is now an array of objects: { label, street, town, state, country }
// m.location and m.locations remain plain label strings

function migrateKnownLocation(loc) {
  // Already an object with label? Return as-is
  if (loc && typeof loc === 'object' && loc.label) return loc;
  // String → parse into object
  if (typeof loc !== 'string' || !loc.trim()) return null;
  const s = loc.trim();
  const parts = s.split(",").map(p => p.trim());
  if (parts.length >= 4) return { label: s, street: parts[0], town: parts[1], state: parts[2], country: parts[parts.length-1] };
  if (parts.length === 3) return { label: s, town: parts[0], state: parts[1], country: parts[2] };
  if (parts.length === 2) return { label: s, town: parts[0], country: parts[1] };
  return { label: s, street: "", town: "", state: "", country: "" };
}

function migrateKnownLocations(arr) {
  if (!arr || !arr.length) return [];
  // If first item is already an object, assume migrated
  if (typeof arr[0] === 'object' && arr[0].label) return arr;
  return arr.map(migrateKnownLocation).filter(Boolean);
}

function knownLocationLabels(knownLocations) {
  return (knownLocations || []).map(l => typeof l === 'string' ? l : l.label).filter(Boolean);
}

function findKnownLocation(knownLocations, label) {
  if (!label) return null;
  return (knownLocations || []).find(l =>
    (typeof l === 'string' ? l : l.label) === label
  ) || null;
}

function knownLocationValues(knownLocations, field) {
  // Get unique values for a specific field (town, state, country) across all known locations
  return [...new Set(
    (knownLocations || [])
      .map(l => typeof l === 'object' ? l[field] : "")
      .filter(Boolean)
  )].sort();
}

// ── Storage ────────────────────────────────────────────────────

// ── IndexedDB for media blobs ──────────────────────────────────
const IDB_NAME = "chronicle-media";
const IDB_STORE = "blobs";
let _idb = null;

function openIDB() {
  if (_idb) return Promise.resolve(_idb);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess = e => { _idb = e.target.result; resolve(_idb); };
    req.onerror = () => reject(req.error);
  });
}

async function idbPut(id, blob) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(blob, id);
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
}

async function idbGet(id) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(id);
    req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error);
  });
}

async function idbDelete(id) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
}

async function idbGetAll() {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const items = {};
    const tx = db.transaction(IDB_STORE);
    const req = tx.objectStore(IDB_STORE).openCursor();
    req.onsuccess = e => {
      const cursor = e.target.result;
      if (cursor) { items[cursor.key] = cursor.value; cursor.continue(); }
      else resolve(items);
    };
    req.onerror = () => reject(req.error);
  });
}

// Save a data-url string as a blob in IDB, return the mediaId
async function storeMedia(dataUrl, name) {
  const mediaId = "media_" + Date.now() + "_" + Math.random().toString(36).slice(2);
  // Convert data-url to Blob
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  await idbPut(mediaId, blob);
  return { mediaId, name };
}

// Resize a blob image to max dimension, return data URL
async function resizeImageBlob(blob, maxDim) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const w = img.width, h = img.height;
      if (w <= maxDim && h <= maxDim) {
        const reader = new FileReader();
        reader.onload = () => { URL.revokeObjectURL(url); resolve(reader.result); };
        reader.onerror = () => { URL.revokeObjectURL(url); reject(new Error("read failed")); };
        reader.readAsDataURL(blob);
        return;
      }
      const scale = maxDim / Math.max(w, h);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load failed")); };
    img.src = url;
  });
}

// Resolve a mediaId (or legacy base64 url) to an object URL for display
const _objUrlCache = {};
async function resolveMediaUrl(med) {
  // Legacy: inline base64 data-url stored directly
  if (med.url && med.url.startsWith("data:")) {
    // Migrate inline to IDB on first access
    if (!med.mediaId) {
      const { mediaId } = await storeMedia(med.url, med.name || "photo");
      med.mediaId = mediaId;
      med.url = null; // strip inline data after migration
    }
  }
  if (!med.mediaId) return null;
  if (_objUrlCache[med.mediaId]) return _objUrlCache[med.mediaId];
  const blob = await idbGet(med.mediaId);
  if (!blob) return null;
  const objUrl = URL.createObjectURL(blob);
  _objUrlCache[med.mediaId] = objUrl;
  return objUrl;
}

const CRYPTO_KEY = "chronicle-crypto";  // stores {salt, iv, ciphertext, check} — all base64

function b64(buf) {
  const bytes = new Uint8Array(buf);
  let str = "";
  for (let i = 0; i < bytes.length; i += 8192) {
    str += String.fromCharCode(...bytes.subarray(i, i + 8192));
  }

async function deriveKey(password, salt) {

async function encryptData(password, plaintext) {

async function decryptData(password, stored) {

  const allLocs = [...existingLocs, ...newLocs.map(label => migrateKnownLocation(label))].filter(Boolean);

// ── EXIF ───────────────────────────────────────────────────────
function extractExif(buffer) {
  try {
    const view = new DataView(buffer);
    if (view.getUint16(0) !== 0xFFD8) return {};
    let offset = 2;
    while (offset < view.byteLength - 4) {
      const marker = view.getUint16(offset);
      const segLen = view.getUint16(offset + 2);
      if (marker === 0xFFE1) {
        const hdr = String.fromCharCode(...new Uint8Array(buffer, offset + 4, 6));
        if (hdr.startsWith("Exif")) {
          return parseExifSegment(view, offset + 10);
        }
      }
      if (marker === 0xFFDA) break;
      offset += 2 + segLen;
    }
  } catch(e) {}
  return {};
}

function parseExifSegment(view, tiff) {
  try {
    const le  = view.getUint16(tiff) === 0x4949;
    const g16 = o => view.getUint16(tiff + o, le);
    const g32 = o => view.getUint32(tiff + o, le);
    function readASCII(offset, len) {
      return String.fromCharCode(...new Uint8Array(view.buffer, tiff + offset, len)).replace(/\0/g, "");
    }
    function scanIFD(ifdOffset) {
      const tags = {}; const n = g16(ifdOffset);
      for (let i = 0; i < n; i++) {
        const e = ifdOffset + 2 + i * 12;
        const tag = g16(e); const typ = g16(e+2); const cnt = g32(e+4); const val = g32(e+8);
        tags[tag] = { typ, cnt, val };
      }
      return tags;
    }
    const ifd0 = g32(4);
    const ifd0Tags = scanIFD(ifd0);
    let dateResult = null;
    const exifIFDPtr = ifd0Tags[0x8769];
    if (exifIFDPtr) {
      const exifTags = scanIFD(exifIFDPtr.val);
      for (const dtTag of [0x9003, 0x9004, 0x0132]) {
        const t = exifTags[dtTag] || ifd0Tags[dtTag];
        if (t) {
          const ds = readASCII(t.val, 19);
          const mx = ds.match(/^(\d{4}):(\d{2}):(\d{2})/);
          if (mx) { dateResult = { year:+mx[1], month:+mx[2], day:+mx[3] }; break; }
        }
      }
    }
    if (!dateResult && ifd0Tags[0x0132]) {
      const ds = readASCII(ifd0Tags[0x0132].val, 19);
      const mx = ds.match(/^(\d{4}):(\d{2}):(\d{2})/);
      if (mx) dateResult = { year:+mx[1], month:+mx[2], day:+mx[3] };
    }
    return { ...dateResult };
  } catch(e) {}
  return {};
}

// Decode quoted-printable encoding (=XX hex escapes, soft line breaks)
function decodeQP(str) {
  return str
    .replace(/=\r?\n/g, "")                          // soft line breaks
    .replace(/=([0-9A-Fa-f]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
}

// Decode encoded-word headers: =?UTF-8?Q?...?= or =?UTF-8?B?...?=
function decodeHeader(str) {
  return str.replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g, (_, charset, enc, data) => {
    try {
      if (enc.toUpperCase() === "B") {
        const bin = atob(data);
        return new TextDecoder(charset).decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
      } else {
        return decodeQP(data.replace(/_/g, " "));
      }
    } catch(e) { return data; }
  });
}

// Parse raw MIME headers from a block of text, returning {headers, bodyStart}
function parseMimeHeaders(text) {
  const headers = {};
  let i = 0;
  const lines = text.split(/\r?\n/);
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === "") { i++; break; }           // blank line = end of headers
    // fold continuation lines (start with whitespace)
    let full = line;
    while (i + 1 < lines.length && /^[ \t]/.test(lines[i + 1])) {
      i++;
      full += " " + lines[i].trim();
    }
    const colon = full.indexOf(":");
    if (colon > 0) {
      const key = full.slice(0, colon).trim().toLowerCase();
      const val = full.slice(colon + 1).trim();
      headers[key] = val;
    }
    i++;
  }
  return { headers, bodyLines: lines.slice(i) };
}

// Extract the best plain-text part from a MIME message (recursive)
function extractPlainText(headers, bodyLines) {
  const ct = headers["content-type"] || "text/plain";
  const cte = (headers["content-transfer-encoding"] || "").toLowerCase();

  // Multipart: find boundary and recurse into parts
  const boundaryMatch = ct.match(/boundary="?([^";\s]+)"?/i);
  if (boundaryMatch) {
    const boundary = boundaryMatch[1];
    const body = bodyLines.join("\n");
    const parts = body.split(new RegExp("--" + boundary.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?:--)?\\r?\\n?"));
    let plain = "";
    let html = "";
    for (const part of parts) {
      if (!part.trim() || part.trim() === "--") continue;
      const { headers: ph, bodyLines: pb } = parseMimeHeaders(part);
      const pct = ph["content-type"] || "";
      if (/text\/plain/i.test(pct)) plain = extractPlainText(ph, pb);
      else if (/text\/html/i.test(pct) && !plain) html = extractPlainText(ph, pb);
      else if (/multipart\//i.test(pct)) {
        const nested = extractPlainText(ph, pb);
        if (nested) plain = nested;
      }
    }
    return plain || html;
  }

  // Leaf part: decode the body
  let body = bodyLines.join("\n");
  if (cte === "quoted-printable") body = decodeQP(body);
  else if (cte === "base64") {
    try { body = atob(body.replace(/\s+/g, "")); } catch(e) { return ""; }
  }

  // Strip HTML tags if this is an HTML part
  if (/text\/html/i.test(ct)) {
    body = body
      .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, "")
      .replace(/[<]script[^>]*>[\s\S]*?<\/script>/gi, "")
      .replace(/<br\s*\/?>/gi, "\n")
      .replace(/<\/p>/gi, "\n\n")
      .replace(/<\/div>/gi, "\n")
      .replace(/<[^>]+>/g, "")
      .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&nbsp;/g, " ");
  }

  // Clean up: collapse quoted reply chains (lines starting with >)
  body = body
    .split("\n")
    .filter(l => !l.trimStart().startsWith(">"))   // strip quoted lines
    .join("\n")
    .replace(/On .{10,80}wrote:\s*$/m, "")          // strip "On [date] X wrote:"
    .replace(/\n{3,}/g, "\n\n")                     // collapse excess blank lines
    .trim();

  return body;
}

function parseEmail(text) {
  const { headers, bodyLines } = parseMimeHeaders(text);

  const from    = decodeHeader(headers["from"]    || "");
  const subject = decodeHeader(headers["subject"] || "");
  const dateStr = headers["date"] || "";

  let year=null, month=null, day=null, fuzzy="day";
  if (dateStr) {
    const d = new Date(dateStr);
    if (!isNaN(d)) { year=d.getFullYear(); month=d.getMonth()+1; day=d.getDate(); }
  }
  if (!year) fuzzy = "year";

  const body = extractPlainText(headers, bodyLines).slice(0, 3000);

  return {
    from, subject, dateStr,
    body,
    year: year || new Date().getFullYear(),
    month: month || 1,
    day: day || 1,
    fuzzy
  };
}

function buildPrompt(memories, knownPeople, knownOrgs, knownLocations, seen=new Set(), extras={}) {
  // extras: { peopleRelationships, orgLocations, personOrgs }
  const { peopleRelationships={}, orgLocations={}, personOrgs={} } = extras;

  // Score people, places, orgs by memory count (fewer = more interesting to fill in)
  const memCount = arr => arr.map(x => ({
    x, n: memories.filter(m =>
      (m.people||[]).includes(x) || (m.orgs||[]).includes(x) ||
      [m.location,...(m.locations||[])].includes(x)
    ).length
  })).sort((a,b) => a.n - b.n);

  const locLabels = knownLocations.map(l=>typeof l==='string'?l:l.label);
  const people = memCount(knownPeople).filter(({n})=>n<10).sort((a,b)=>a.n-b.n);
  const orgs   = memCount(knownOrgs).filter(({n})=>n<8).sort((a,b)=>a.n-b.n);
  const locs   = memCount(locLabels).filter(({n})=>n<8).sort((a,b)=>a.n-b.n);

  // ── Completion prompts: incomplete index data ──────────────────
  const completionPool = [];

  // People without a relationship set
  knownPeople.filter(p=>!peopleRelationships[p]).forEach(p=>{
    completionPool.push({ type:"person", subtype:"set-relationship", entity:p, count:memories.filter(m=>(m.people||[]).includes(p)).length,
      text:`What is ${p} to you? Adding a relationship helps you find and filter memories.`,
      action:`Add a memory with ${p}` });
  });

  // Locations without geocodes
  knownLocations.filter(l=>{const loc=typeof l==='object'?l:null; return !loc||!loc.coords;}).forEach(l=>{
    const label=typeof l==='string'?l:l.label;
    completionPool.push({ type:"place", subtype:"set-coords", entity:label, count:memories.filter(m=>m.location===label||(m.locations||[]).includes(label)).length,
      text:`${label} has no map coordinates yet — it won\u2019t appear on your map. Do you know roughly where it is?`,
      action:`Add a memory at ${label}` });
  });

  // Orgs without any linked people
  knownOrgs.filter(o=>!Object.values(personOrgs).some(os=>(os||[]).includes(o))).forEach(o=>{
    completionPool.push({ type:"org", subtype:"set-org-people", entity:o, count:memories.filter(m=>(m.orgs||[]).includes(o)).length,
      text:`${o} has no people linked to it. Who were the key people in your time there?`,
      action:`Add a memory about ${o}` });
  });

  // Orgs without any linked locations
  knownOrgs.filter(o=>!(orgLocations[o]||[]).length).forEach(o=>{
    completionPool.push({ type:"org", subtype:"set-org-location", entity:o, count:memories.filter(m=>(m.orgs||[]).includes(o)).length,
      text:`Where was ${o} based? Linking a location helps connect it to your map and other memories.`,
      action:`Add a memory about ${o}` });
  });

  // Zero-memory entities get top slots in pool
  const zeroPool = [
    ...people.filter(({n})=>n===0).map(({x})=>({ type:"person",entity:x,count:0,text:`You\u2019ve recorded ${x} but haven\u2019t linked any memories yet. What\u2019s the first thing that comes to mind?`,action:`Add a memory with ${x}` })),
    ...orgs.filter(({n})=>n===0).map(({x})=>({ type:"org",entity:x,count:0,text:`${x} is in your index but has no memories attached. What period of your life does it belong to?`,action:`Add a memory about ${x}` })),
    ...locs.filter(({n})=>n===0).map(({x})=>({ type:"place",entity:x,count:0,text:`You\u2019ve noted ${x} but haven\u2019t added any memories there yet. What happened at ${x}?`,action:`Add a memory at ${x}` })),
  ];

  // Find decade gaps
  const decades = [...new Set(memories.map(m=>Math.floor(m.year/10)*10))];
  const allDecades = [];
  const minDec = memories.length ? Math.floor(Math.min(...memories.map(m=>m.year))/10)*10 : null;
  const maxDec = memories.length ? Math.floor(new Date().getFullYear()/10)*10 : null;
  if (minDec && maxDec) {
    for (let d=minDec; d<=maxDec; d+=10) if (!decades.includes(d)) allDecades.push(d);
  }

  // Tags present
  const tagCounts = {};
  memories.forEach(m=>(m.tags||[]).forEach(t=>{ tagCounts[t]=(tagCounts[t]||0)+1; }));

  // Build pool of possible prompts
  const pool = [];

  // Completion prompts (incomplete data) go first if not seen
  completionPool.forEach(p=>{ if(!seen.has(p.entity+"||"+p.text)) pool.push(p); });
  // Zero-memory entities go next if not seen
  zeroPool.forEach(p=>{ if(!seen.has(p.entity+"||"+p.text)) pool.push(p); });
  people.filter(({n})=>n>0).slice(0,8).forEach(({x,n})=>{
    const fns = PERSON_PROMPTS;
    const fn = fns[Math.floor(Math.random()*fns.length)];
    pool.push({ type:"person", entity:x, count:n, text:fn(x), action:`Add a memory with ${x}` });
  });
  locs.slice(0,6).forEach(({x,n})=>{
    const fn = PLACE_PROMPTS[Math.floor(Math.random()*PLACE_PROMPTS.length)];
    pool.push({ type:"place", entity:x, count:n, text:fn(x), action:`Add a memory at ${x}` });
  });
  orgs.slice(0,4).forEach(({x,n})=>{
    const fn = ORG_PROMPTS[Math.floor(Math.random()*ORG_PROMPTS.length)];
    pool.push({ type:"org", entity:x, count:n, text:fn(x), action:`Add a memory about ${x}` });
  });
  Object.entries(tagCounts).forEach(([tag,n])=>{
    const fn = TAG_PROMPTS[tag];
    if (!fn) return;
    const dec = allDecades.length ? allDecades[Math.floor(Math.random()*allDecades.length)] : null;
    pool.push({ type:"tag", entity:tag, count:n, text:fn(n,dec), action:`Add a ${tag} memory` });
  });
  allDecades.slice(0,3).forEach(dec=>{
    const fn = DECADE_PROMPTS[Math.floor(Math.random()*DECADE_PROMPTS.length)];
    pool.push({ type:"decade", entity:String(dec), count:0, text:fn(dec), action:`Add a memory from the ${dec}s` });
  });

  const fresh = pool.filter(p => !seen.has(p.entity + "||" + p.text));
  const candidates = fresh.length ? fresh : pool; // fall back to full pool if all seen
  return candidates[Math.floor(Math.random()*candidates.length)];
}

function LifeTimeline({memories, setView, setIndexFilter, onMissingEnd, isMobile}) {
  const now = new Date();

    if (!m.year) return 0;
    if ((m.fuzzy==="day"||m.fuzzy==="month") && m.month) {
      const dayFrac = (m.fuzzy==="day" && m.day) ? (m.day-1)/365 : 0;
      return m.year + (m.month-1)/12 + dayFrac;
    }
    if (m.fuzzy==="season" && m.season) return m.year + ({Early:1,Mid:6,Late:10}[m.season]||0)/12;
    return m.year;

  }

    const tm=Math.round(dy*12);
    if (tm<2) return "<1 mo";
    if (tm<12) return tm+" mo";

    else residences.push({label:m.location,startFrac:sf,endFrac:ef,isCurrent,fType:"locations",startYear:m.year,startMonth:m.month||0,startHasMo:hasMo,endYear:nextM?nextM.year:new Date().getFullYear(),endMonth:nextM?(nextM.month||0):(new Date().getMonth()+1),endHasMo:nextM?nextHasMo:true,noEnd:false});
  });

  // Work / Education
  function memEndFrac(m) {

    if (!m.endYear) return 0;
    if ((m.endFuzzy==="day"||m.endFuzzy==="month") && m.endMonth) {
      const dayFrac = (m.endFuzzy==="day" && m.endDay) ? (m.endDay-1)/365 : 0;
      return m.endYear + (m.endMonth-1)/12 + dayFrac;
    }
    if (m.endFuzzy==="season" && m.endSeason) return m.endYear + ({Early:1,Mid:6,Late:10}[m.endSeason]||0)/12;
    return m.endYear;

      .map(m=>{const org=(m.orgs||[])[0];const hasMo=!!m.month&&m.month>0;const hasEndMo=!!m.endMonth&&m.endMonth>0;return{frac:memFrac(m),eFrac:memEndFrac(m),ongoing:!!m.endOngoing,hasMo,hasEndMo,startMonth:m.month||0,startYear:m.year,endMonth:m.endMonth||0,endYear:m.endYear||0,label:org||m.location,fType:org?"orgs":"locations"};})

                isHov&&React.createElement("div",{style:{position:"fixed",left:"50%",bottom:"80px",transform:"translateX(-50%)",

        )

        React.createElement("p",{style:{fontSize:"0.82rem",color:"#6a5c48",marginBottom:"7px",fontWeight:600}},"Link a location"),

        React.createElement("div",{style:{display:"flex",gap:"6px"}}),
        React.createElement("input",{value:orgLocSearch,onChange:e=>setOrgLocSearch(e.target.value),

// ── Linkify — turn URLs in text into clickable anchors ──────────
function linkify(text) {
  if (!text) return null;
  const urlRe = /https?:\/\/[^\s<>"()]+[^\s<>"().,:;!?]/g;
  const parts = []; let last = 0; let m;
  while ((m = urlRe.exec(text)) !== null) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    parts.push(React.createElement("a", {
      key: m.index, href: m[0], target: "_blank", rel: "noopener noreferrer",
      style: { color: "#5a6a8a", textDecoration: "underline", textDecorationColor: "#c8b89a", wordBreak: "break-all" },
      onClick: e => e.stopPropagation()
    }, m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push(text.slice(last));
  return parts.length === 1 && typeof parts[0] === "string" ? text : parts;
}

}

// ── Geocode cache (persisted in localStorage) ─────────────────
const GEOCODE_CACHE_KEY = "chronicle-geocode-cache";
;
function loadGeocodeCache() { try { return JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY)||"{}"); } catch(e) { return {}; } }
function saveGeocodeCache(cache) { try { localStorage.setItem(GEOCODE_CACHE_KEY, JSON.stringify(cache)); } catch(e) {} }

async function geocode(name, cache) {
  if (cache[name]) return cache[name];
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(name)}&format=json&limit=1`, {
      headers: { "Accept-Language": "en", "User-Agent": "Chronicle-Journal-App" }
    });
    const data = await res.json();
    if (data[0]) {
      const result = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), display: data[0].display_name };
      cache[name] = result;
      saveGeocodeCache(cache);
      return result;
    }
    cache[name] = null; saveGeocodeCache(cache); return null;
  } catch(e) { return null; }
}

// ── MapView component ──────────────────────────────────────────
function MapView({ memories, onSelectLocation, onEditLocation, onSelectMemory, locationCoords, onSaveCoords, knownLocations, filter, onFilterChange }) {
  // Build a map from label → structured address for better geocoding
  const knownLocMap = React.useMemo(() => {
    const m = {};
    (knownLocations||[]).forEach(l => { if (l && l.label) m[l.label] = l; });
    return m;
  }, [knownLocations]);
  const mapRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const [status, setStatus] = useState(""); // loading message
  const [geocodeCache, setGeocodeCache] = useState(loadGeocodeCache);
  const [selectedLoc, setSelectedLoc] = useState(null);
  const [useEnglish, setUseEnglish] = useState(true);
  const tileLayers = React.useRef({});

  // Apply filters
  const filtered = React.useMemo(() => {
    if (!filter || (!filter.tag && !filter.person && !filter.decade)) return memories;
    return memories.filter(m => {
      if (filter.tag && !(m.tags||[]).includes(filter.tag)) return false;
      if (filter.person && !(m.people||[]).includes(filter.person)) return false;
      if (filter.decade && (Math.floor(m.year/10)*10) !== filter.decade) return false;
      return true;
    });
  }, [memories, filter]);

  // Collect all unique locations, tracking primary vs secondary
  const locationMemories = {};
  const locationIsPrimary = {};
  const locationIsContext = {}; // true if ALL memories at this location are gedcomContext
  filtered.forEach(m => {
    if (m.location) {
      if (!locationMemories[m.location]) { locationMemories[m.location] = []; locationIsPrimary[m.location] = false; locationIsContext[m.location] = true; }
      locationMemories[m.location].push(m);
      locationIsPrimary[m.location] = true;
      if (!m.gedcomContext) locationIsContext[m.location] = false;
    }
    (m.locations||[]).forEach(loc => {
      if (!loc) return;
      if (!locationMemories[loc]) { locationMemories[loc] = []; locationIsPrimary[loc] = false; locationIsContext[loc] = true; }
      if (!locationMemories[loc].includes(m)) locationMemories[loc].push(m);
      if (!m.gedcomContext) locationIsContext[loc] = false;
    });
  });
  const uniqueLocations = Object.keys(locationMemories);

  useEffect(() => {
    if (!mapRef.current || mapInstanceRef.current) return;

    // Init map
    const map = L.map(mapRef.current, { zoomControl: true }).setView([20, 0], 2);
    const osmLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19
    });
    const engLayer = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
      subdomains: "abcd", maxZoom: 19
    });
    engLayer.addTo(map);
    tileLayers.current = { osm: osmLayer, eng: engLayer };
    mapInstanceRef.current = map;

    // Seed cache with stored coords before geocoding
    const cache = loadGeocodeCache();
    // Prefer manually set or structured coords from location objects
    (knownLocations||[]).forEach(l => {
      if (l && l.label && l.coords && l.coords.lat != null) {
        cache[l.label] = { lat: l.coords.lat, lng: l.coords.lng, display: l.label, fromCoords: true };
      }
    });
    if (locationCoords) {
      Object.entries(locationCoords).forEach(([name, c]) => {
        if (c && c.lat != null && !cache[name]?.fromCoords) cache[name] = { lat: c.lat, lng: c.lng, display: name };
      });
    }
    const pending = uniqueLocations.filter(l => !cache[l]);
    if (pending.length > 0) setStatus(`Locating ${pending.length} place${pending.length===1?"":"s"}...`);

    const markers = [];

    async function placePins() {
      for (const loc of uniqueLocations) {
        // Rate limit: 1 req/sec for Nominatim
        if (!cache[loc]) await new Promise(r => setTimeout(r, 1100));
        // Build geocode query from structured address fields; use town+state+country for accuracy
        const kl = knownLocMap[loc];
        let geocodeQuery = loc;
        if (kl) {
          // Prefer town/state/country over label for geocoding — label can be a nickname
          const fullParts = [kl.street, kl.town, kl.state, kl.country].filter(Boolean);
          const townParts = [kl.town, kl.state, kl.country].filter(Boolean);
          if (townParts.length >= 2) geocodeQuery = townParts.join(", ");
          else if (fullParts.length > 0) geocodeQuery = fullParts.join(", ");
        }
        let coords = cache[loc];
        if (!coords) {
          coords = await geocode(geocodeQuery, cache);
          if (coords) cache[loc] = coords; // store under label key
        }
        if (!coords || !mapInstanceRef.current) continue;

        const mems = locationMemories[loc];
        const count = mems.length;
        const size = Math.min(36, 20 + count * 3);
        const isPrimary = locationIsPrimary[loc];
        const isCtx = locationIsContext[loc];
        const pinColor = isCtx ? "#7a9e8a" : isPrimary ? "#c8a87a" : "#8b9dc3";
        const borderColor = isCtx ? "#2c5a3a" : isPrimary ? "#2c2416" : "#3a4a7a";

        const icon = L.divIcon({
          className: "",
          html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${pinColor};border:2.5px solid ${borderColor};display:flex;align-items:center;justify-content:center;font-family:'Crimson Text',serif;font-size:${size>26?'0.8rem':'0.7rem'};color:${borderColor};font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.25);cursor:pointer;">${count}</div>`,
          iconSize: [size, size],
          iconAnchor: [size/2, size/2]
        });

        const marker = L.marker([coords.lat, coords.lng], { icon }).addTo(map);
        marker.on("click", () => window._chronicleSetSelectedLoc(loc));
        markers.push(marker);
      }

      setStatus("");
      // Fit map to pins if any found
      if (markers.length > 0) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.2));
      }
      setGeocodeCache({...cache});
      // Persist auto-discovered coords in one batch — individual calls would stomp each other
      if (onSaveCoords) {

// ── ShareViaLink ───────────────────────────────────────────────
function ShareViaLink({memories, senderName, senderEmail, personalMsg, deliverToEmails, deliveredToNames, allDelivered, onDone}) {
  const [status, setStatus] = useState("idle");
  const [shareUrl, setShareUrl] = useState("");
  const [shareCode, setShareCode] = useState("");
  const [shareErr, setShareErr] = useState("");
  const [copied, setCopied] = useState(false);
  const [copiedMsg, setCopiedMsg] = useState(false);

  const someDelivered = !allDelivered && deliveredToNames && deliveredToNames.length > 0;

  // Default message mode: "full" intro for unknown recipients, "code" if they likely have Chronicle
  const defaultMode = someDelivered ? "code" : "full";
  const [msgMode, setMsgMode] = useState(defaultMode);

  const CHRONICLE_INTRO = "I\u2019ve shared some memories with you using Chronicle \u2014 a free, private memory journal at remembory.net.\n\nChronicle lets you collect the story of a life: memories, photos, places, and the people in them. Everything is stored privately on your own device \u2014 nothing is uploaded to a server unless you choose to share it.\n\nWhen you open the link below, you\u2019ll be able to review the memories I\u2019ve shared, choose which ones to save, and add them to your own Chronicle \u2014 where you can add your own perspective, fill in your side of the story, and start building your own timeline.\n\nIt\u2019s free to use. No account or sign-up needed to get started.\n\n\u26a0 Please open the link in a browser (Safari, Chrome, Firefox) \u2014 opening from inside a messaging app may not work correctly:\n";
  const CODE_INSTRUCTIONS = "To add these memories to your Chronicle, open remembory.net/chronicle.html in your browser, go to the Sharing page, and enter this code:";
  function buildMessage() {
    if (msgMode === "full") return CHRONICLE_INTRO + shareUrl + (shareCode ? "\n\nAlready have Chronicle? Use the share code instead: " + shareCode : "");
    if (msgMode === "code") return CODE_INSTRUCTIONS + "\n\n" + shareCode;
    return shareUrl;
  }
  function copyMessage() {
    navigator.clipboard.writeText(buildMessage()).then(()=>{ setCopiedMsg(true); setTimeout(()=>setCopiedMsg(false),2500); });
  }

  useEffect(()=>{ generate(); }, []);

  async function generate() {
    setStatus("loading");
    try {
      // Strip the sender's own subject name from people arrays before sharing
      // so the recipient doesn't see "My Chronicle" or similar as a tagged person.
      // Also resolve any mediaId blob references to embedded data: URLs so the
      // recipient receives the actual photo data, not just a local IDB key.
      const photoQueue = [];
      const sanitisedMemories = await Promise.all(memories.map(async (m, mi) => {
        const mediaUrls = await Promise.all((m.mediaUrls||[]).map(async (med, mdi) => {
          if (med.mediaId) {
            try {
              const blob = await idbGet(med.mediaId);
              if (blob) { photoQueue.push({blob, ref: mi+"_"+mdi}); return {name:med.name, _r2ref: mi+"_"+mdi}; }
            } catch(e) {}
          }
          return med;
        }));
        return { ...m, people: (m.people||[]).filter(p => p !== senderName.trim()), mediaUrls };
      }));
      const payload = {
        sharedBy: senderName.trim(),
        sharedByEmail: senderEmail||"",
        message: personalMsg||"",
        requestConnect: true,
        memories: sanitisedMemories
      };
      const res = await fetch(WORKER_URL + "/share", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Server error " + res.status);
      const data = await res.json();
      // Upload photos to R2
      if (photoQueue.length > 0 && data.code) {
        for (const photo of photoQueue) {
          try {
            const resized = await resizeImageBlob(photo.blob, 1200);
            const resizedBlob = await fetch(resized).then(r=>r.blob());
            await fetch(WORKER_URL + "/share/media/" + data.code + "/" + encodeURIComponent(photo.ref), {
              method:"PUT", headers:{"Content-Type":"image/jpeg"}, body:resizedBlob
            });
          } catch(e) {}
        }
      }
      setShareUrl(data.url);
      setShareCode(data.code || "");
      setStatus("done");
      // Deliver directly to connected recipients who have an email on file
      if (data.code && deliverToEmails && deliverToEmails.length > 0) {
        deliverToEmails.forEach(email => {
          fetch(WORKER_URL + "/share/deliver", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({shareId:data.code,toEmail:email,fromName:senderName.trim(),fromEmail:senderEmail||""})
          }).catch(()=>{});
        });
      }
    } catch(e) {
      setStatus("error");
      setShareErr(e.message || String(e));
      console.error(e);
    }
  }

  function copy() {
    navigator.clipboard.writeText(shareUrl).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2500); });
  }

  if (status==="loading") return React.createElement("p",{style:{color:"#8a7460",fontStyle:"italic",padding:"16px 0",textAlign:"center"}},"Generating link…");

  if (status==="error") return React.createElement("div",null,
    React.createElement("p",{style:{color:"#c4858a",fontSize:"0.9rem",marginBottom:"10px"}},"Couldn’t reach the share server. Check your connection."),
    shareErr ? React.createElement("p",{style:{color:"#8a7460",fontSize:"0.78rem",fontStyle:"italic",marginBottom:"10px",wordBreak:"break-all"}},shareErr) : null,
    React.createElement("button",{onClick:generate,style:{...S.btnOutline,color:"#7a9e8a",borderColor:"#7a9e8a"}},"Retry"),
    React.createElement("button",{onClick:onDone,style:{...S.btnOutline,marginLeft:"8px",color:"#8a7460",borderColor:"#c8b89a"}},"Cancel")
  );


  if (status==="done") {
    // ── All-delivered confirmation (no copy needed) ──────────────────────────
    if (allDelivered) return React.createElement("div",null,
      React.createElement("div",{style:{background:"rgba(74,122,90,0.08)",border:"1px solid rgba(74,122,90,0.3)",borderRadius:"4px",padding:"16px 18px",marginBottom:"12px"}},
        React.createElement("p",{style:{fontSize:"0.92rem",color:"#2a5a3a",fontWeight:600,margin:"0 0 6px"}},
          "✓ Delivered to "+(deliveredToNames.length===1?deliveredToNames[0]:deliveredToNames.join(", "))
        ),
        React.createElement("p",{style:{fontSize:"0.82rem",color:"#4a7a5a",margin:0,lineHeight:1.5}},
          (memories.length===1?"This memory has":"These "+memories.length+" memories have")+" arrived in their Chronicle inbox. No link needed."
        )
      ),
      React.createElement("p",{style:{fontSize:"0.78rem",color:"#8a7460",fontStyle:"italic",margin:"0 0 12px"}},
        "If they don\u2019t see it, they can also enter code: "+shareCode+" in Sharing \u2192 Receive a Share."
      ),
      React.createElement("button",{onClick:onDone,style:{...S.btn,width:"100%"}},"Done")
    );

    // ── Partial delivery: banner + copy UI for the rest ──────────────────────
    return React.createElement("div",null,
      someDelivered&&React.createElement("div",{style:{background:"rgba(74,122,90,0.08)",border:"1px solid rgba(74,122,90,0.3)",borderRadius:"4px",padding:"10px 14px",marginBottom:"14px",fontSize:"0.84rem",color:"#2a5a3a"}},
        "✓ Sent to "+(deliveredToNames.join(", "))+" \u2014 already in their inbox."
      ),
      React.createElement("p",{style:{fontSize:"0.82rem",color:"#4a7a5a",fontWeight:600,marginBottom:"10px"}},
        someDelivered ? "Also send to everyone else:" : "Choose what to send:"
      ),
      React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:"6px",marginBottom:"12px"}},
        [
          ["full","New to Chronicle","includes app intro + link — use for first-time recipients"],
          ["link","Has Chronicle","just the share link"],
          ["code","Has Chronicle (code)","short code they enter in the Sharing page"],
        ].map(([val,label,hint])=>
          React.createElement("label",{key:val,style:{display:"flex",alignItems:"flex-start",gap:"8px",cursor:"pointer",padding:"6px 10px",borderRadius:"3px",background:msgMode===val?"rgba(122,158,138,0.1)":"transparent",border:msgMode===val?"1px solid rgba(122,158,138,0.4)":"1px solid transparent"}},
            React.createElement("input",{type:"radio",name:"msgMode",value:val,checked:msgMode===val,onChange:()=>setMsgMode(val),style:{marginTop:"3px",flexShrink:0}}),
            React.createElement("div",null,
              React.createElement("div",{style:{fontSize:"0.88rem",color:"#2c2416",lineHeight:1.4}},label),
              React.createElement("div",{style:{fontSize:"0.78rem",color:"#8a7460"}},hint)
            )
          )
        )
      ),
      React.createElement("textarea",{
        readOnly:true,
        value:buildMessage(),
        onClick:e=>e.target.select(),
        rows: msgMode==="full" ? 8 : 3,
        style:{...S.input,width:"100%",fontSize:"0.82rem",color:"#2c2416",lineHeight:1.6,resize:"none",boxSizing:"border-box",fontFamily:"inherit",whiteSpace:"pre-wrap",marginBottom:"10px"}
      }),
      React.createElement("button",{onClick:copyMessage,style:{...S.btn,width:"100%",marginBottom:"8px",fontSize:"0.88rem"}},
        copiedMsg ? "✓ Copied!" : "Copy message"
      ),
      React.createElement("p",{style:{fontSize:"0.78rem",color:"#8a7460",fontStyle:"italic",margin:"0"}},
        "Link expires in 30 days and is deleted once the recipient saves it."
      ),
      React.createElement("button",{onClick:onDone,style:{...S.btnOutline,marginTop:"12px",color:"#8a7460",borderColor:"#c8b89a",width:"100%"}},"Done")
    );
  }

  return null;
}

// ── ShareButton component ──────────────────────────────────────
function ShareButton({memory, peopleEmails, memories, ownerName, ownerEmail, shareHistory, localConnections, onRecordShare}) {
  const [open, setOpen] = useState(false);
  const [step, setStep] = useState("compose");
  const [senderName, setSenderName] = useState(ownerName||"");
  const [selectedPeople, setSelectedPeople] = useState([]);
  const [selectedMemIds, setSelectedMemIds] = useState(new Set([memory.id]));
  const [personalMsg, setPersonalMsg] = useState("");
  const [msgError, setMsgError] = useState("");
  const [emailInputs, setEmailInputs] = useState({}); // {personName: emailString} for ad-hoc emails
  const [sendStatus, setSendStatus] = useState("idle"); // idle | sending | sent | error
  const [sendError, setSendError] = useState("");

  useEffect(()=>{ if(ownerName && !senderName) setSenderName(ownerName); }, [ownerName]);

  const effectiveEmail = ownerEmail || "";
  const allMems = memories || [];

  // Resolve email for a person from either the per-subject email map or localConnections
  function emailFor(p) {
    return (peopleEmails||{})[p] || (localConnections||[]).find(c=>c.name===p)?.email || "";
  }
  // Classify a recipient: connected Chronicle user, or just a name
  function recipientType(p) {
    const isConn = (localConnections||[]).some(c=>c.name===p);
    const hasEmail = !!emailFor(p);
    if (isConn && hasEmail) return "connected_email";
    if (isConn) return "connected_no_email";
    if (hasEmail) return "has_email";
    return "name_only";
  }

  // Only people tagged in the current memory are offered as recipients
  const allPeople = [...new Set(memory.people||[])].sort();

  // Memories shown in checklist: only those that include ALL selected recipients
  // When nobody selected yet, show only the current memory
  const eligibleMems = selectedPeople.length === 0
    ? allMems.filter(m => m.id === memory.id)
    : allMems.filter(m => selectedPeople.every(p=>(m.people||[]).includes(p)));

  function togglePerson(person) {
    setSelectedPeople(prev => {
      const next = prev.includes(person) ? prev.filter(p=>p!==person) : [...prev, person];
      // Re-seed selected memories to those eligible for the new recipient set
      // Always keep current memory selected if it qualifies
      const eligible = next.length === 0
        ? allMems.filter(m => m.id === memory.id)
        : allMems.filter(m => next.every(p=>(m.people||[]).includes(p)));
      const eligibleIds = new Set(eligible.map(m=>m.id));
      setSelectedMemIds(eligibleIds.has(memory.id) ? new Set([memory.id]) : new Set(eligible.map(m=>m.id)));
      return next;
    });
  }

  function toggleMem(id) {
    setSelectedMemIds(prev => { const next = new Set(prev); next.has(id) ? next.delete(id) : next.add(id); return next; });
  }

  function effectiveEmailFor(p) {
    return emailFor(p) || (emailInputs[p]||"").trim();
  }

  function handleGetLink() {
    if (!senderName.trim()) { alert("Please enter your name first."); return; }
    setMsgError("");
    if (onRecordShare && selectedPeople.length) onRecordShare(selectedPeople, selectedMemIds);
    setStep("link");
  }

  async function handleSend() {
    if (!senderName.trim()) { alert("Please enter your name first."); return; }
    setSendStatus("sending");
    setSendError("");
    try {
      const toShare = allMems.filter(m => selectedMemIds.has(m.id));
      // Collect photos to upload separately via R2
      const photoQueue = []; // [{blob, memIdx, medIdx}]
      // Sanitise: strip photo data from payload, keep refs for R2 upload
      const sanitised = await Promise.all(toShare.map(async (m, mi) => {
        const mediaUrls = await Promise.all((m.mediaUrls||[]).map(async (med, mdi) => {
          if (med.mediaId) {
            try {
              const blob = await idbGet(med.mediaId);
              if (blob) {
                photoQueue.push({blob, ref: mi+"_"+mdi});
                return {name:med.name, _r2ref: mi+"_"+mdi};
              }
            } catch(e) {}
          }
          return med;
        }));
        return {...m, people:(m.people||[]).filter(p=>p!==senderName.trim()), mediaUrls};
      }));
      // Send metadata to each recipient
      const sendResults = await Promise.all(selectedPeople.filter(p=>effectiveEmailFor(p)).map(async p => {
        const r = await fetch(WORKER_URL + "/share/send", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({toEmail:effectiveEmailFor(p), fromName:senderName.trim(), fromEmail:effectiveEmail, message:personalMsg, memories:sanitised})
        });
        if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.error||"Server error "+r.status); }
        return r.json();
      }));
      // Upload photos to R2 for each share
      if (photoQueue.length > 0) {
        const shareIds = sendResults.map(r=>r.shareId).filter(Boolean);
        for (const sid of shareIds) {
          for (const photo of photoQueue) {
            try {
              const resized = await resizeImageBlob(photo.blob, 1200);
              const resizedBlob = await fetch(resized).then(r=>r.blob());
              await fetch(WORKER_URL + "/share/media/" + sid + "/" + encodeURIComponent(photo.ref), {
                method:"PUT", headers:{"Content-Type":"image/jpeg"}, body:resizedBlob
              });
            } catch(e) { /* skip failed photo */ }
          }
        }
      }
      if (onRecordShare && selectedPeople.length) onRecordShare(selectedPeople, selectedMemIds);
      setSendStatus("sent");
    } catch(e) {
      setSendError(e.message || String(e));
      setSendStatus("error");
    }
  }

  function handleClose() {
    setOpen(false);
    setStep("compose");
    setPersonalMsg("");
    setSelectedPeople([]);
    setSelectedMemIds(new Set([memory.id]));
    setEmailInputs({});
    setSendStatus("idle");
    setSendError("");
  }

  if (!open) return React.createElement("button",{
    onClick:()=>setOpen(true),
    style:{...S.btnOutline,color:"#7a9e8a",borderColor:"#7a9e8a"}
  },"Share");

  const toShare = allMems.filter(m=>selectedMemIds.has(m.id));
  const canShare = senderName.trim() && selectedMemIds.size > 0;

  return React.createElement("div",{style:{width:"100%",marginTop:"4px",border:"1px solid #7a9e8a",borderRadius:"4px",background:"rgba(122,158,138,0.05)",padding:"16px",animation:"fadeIn 0.2s ease"}},
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}},
      React.createElement("span",{style:{fontSize:"0.88rem",fontWeight:600,color:"#4a7a5a",letterSpacing:"0.05em",textTransform:"uppercase"}},
        step==="link" ? "✓ Ready to send" : "Share memories"
      ),
      React.createElement("button",{onClick:handleClose,style:{background:"transparent",border:"none",color:"#8a7460",cursor:"pointer",fontSize:"1.1rem"}},"×")
    ),

function PerspectivesPanel({memory, onSave, peopleEmails, senderName, ownerName=""}) {
  const perspectives = memory.perspectives || [];
  const [showAll, setShowAll] = useState(true);
  const [addingMine, setAddingMine] = useState(false);
  const [myDraft, setMyDraft] = useState("");
  const [myName, setMyName] = useState(ownerName||"");
  const [makeDominant, setMakeDominant] = useState(true);
  const myPerspective = perspectives.find(p=>p.isOwn);

  // Who is currently dominant? Stored as memory.dominantAuthor — null means OP (memory.content from before sharing)
  const dominantAuthor = memory.dominantAuthor || null;
  const otherPerspectives = perspectives.filter(p=>!p.isOwn);

  function setDominant(author) {
    // Swap: put chosen perspective's content into memory.content, demote current dominant back into perspectives
    const chosen = perspectives.find(p=>p.author===author);
    if (!chosen) return;
    onSave({...memory, content: chosen.content, dominantAuthor: author});
  }

  function clearDominant() {
    // Revert to no dominant (original content, if any)
    onSave({...memory, dominantAuthor: null});
  }

  function saveMine() {
    if (!myDraft.trim()) return;
    const newP = {author:myName.trim()||"Me", content:myDraft.trim(), addedAt:new Date().toISOString(), isOwn:true};
    const updatedPerspectives = [...perspectives.filter(p=>!p.isOwn), newP];
    // If making dominant: set content to this perspective's text
    const updatedMemory = makeDominant
      ? {...memory, perspectives:updatedPerspectives, content:newP.content, dominantAuthor:newP.author}
      : {...memory, perspectives:updatedPerspectives};
    onSave(updatedMemory);
    setAddingMine(false);

  }

  function removeMine() {
    if (!window.confirm("Remove your perspective from this memory?")) return;
    const updatedPerspectives = perspectives.filter(p=>!p.isOwn);
    // If mine was dominant, revert
    const wasDominant = dominantAuthor === myPerspective?.author;
    onSave({...memory, perspectives:updatedPerspectives, dominantAuthor: wasDominant ? null : dominantAuthor});
  }

  const others = showAll ? otherPerspectives.filter(p=>p.author!==dominantAuthor) : [];

  const [editingAuthor, setEditingAuthor] = useState(null);
  const [editDraft, setEditDraft] = useState("");
  const [keepOriginal, setKeepOriginal] = useState(true);

  function startEditOther(p) {
    setEditingAuthor(p.author);
    setEditDraft(p.content);
    setKeepOriginal(true);
  }

  function saveEditOther() {
    if (!editDraft.trim()) return;
    const updated = perspectives.map(p => {
      if (p.author !== editingAuthor) return p;
      const base = {...p, content: editDraft.trim(), editedAt: new Date().toISOString()};
      if (keepOriginal && p.content !== editDraft.trim()) {
        base.originalContent = p.originalContent || p.content;
      } else if (!keepOriginal) {
        delete base.originalContent;
      }
      return base;
    });
    const wasDominant = dominantAuthor === editingAuthor;
    const updatedMemory = wasDominant
      ? {...memory, perspectives: updated, content: editDraft.trim()}
      : {...memory, perspectives: updated};
    onSave(updatedMemory);
    setEditingAuthor(null);
  }

  function removeOther(author) {
    if (!window.confirm("Remove this perspective? This cannot be undone.")) return;
    const updated = perspectives.filter(p => p.author !== author);
    const wasDominant = dominantAuthor === author;
    onSave({...memory, perspectives: updated, dominantAuthor: wasDominant ? null : dominantAuthor});
  }

  function PerspectiveBlock({p, isMine}) {
    const isDominant = dominantAuthor === p.author;
    const borderColor = isMine ? "#7a9e8a" : "#8b9dc3";

    const isEditing = editingAuthor === p.author;

    return React.createElement("div", {style:{background:bgColor,borderLeft:`3px solid ${borderColor}`,borderRadius:"0 4px 4px 0",padding:"10px 14px"}},
      React.createElement("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px",flexWrap:"wrap",gap:"6px"}},
        React.createElement("div", {style:{display:"flex",alignItems:"center",gap:"8px"}},
          React.createElement("span", {style:{fontSize:"0.8rem",color:labelColor,fontWeight:600,letterSpacing:"0.05em",textTransform:"uppercase"}},
            p.author + (isMine ? "'s memory (you)" : "'s memory")
          ),
          isDominant && React.createElement("span", {style:{fontSize:"0.78rem",background:labelColor,color:"#fff",padding:"1px 7px",borderRadius:"10px",letterSpacing:"0.04em"}}, "shown in timeline"),
          p.editedAt && React.createElement("span", {style:{fontSize:"0.78rem",color:"#7a6a58",fontStyle:"italic"}}, "edited")
        ),
        React.createElement("div", {style:{display:"flex",gap:"8px",alignItems:"center"}},
          !isDominant && React.createElement("button", {
            onClick:()=>setDominant(p.author),
            style:{background:"transparent",border:`1px solid ${borderColor}`,color:labelColor,cursor:"pointer",fontSize:"0.78rem",padding:"2px 8px",borderRadius:"2px",fontFamily:"'Crimson Text',serif"}
          }, "make dominant"),
          isDominant && React.createElement("button", {
            onClick:clearDominant,
            style:{background:"transparent",border:"none",color:"#7a6a58",cursor:"pointer",fontSize:"0.78rem",fontFamily:"'Crimson Text',serif"}
          }, "remove from timeline"),
          isMine
            ? React.createElement("button", {onClick:()=>{setMyDraft(p.content);setMyName(p.author);setMakeDominant(dominantAuthor===p.author);setAddingMine(true);},style:{background:"transparent",border:"none",color:"#7a6a58",cursor:"pointer",fontSize:"0.78rem",fontFamily:"'Crimson Text',serif"}}, "edit")
            : React.createElement("button", {onClick:()=>startEditOther(p),style:{background:"transparent",border:"none",color:"#7a6a58",cursor:"pointer",fontSize:"0.78rem",fontFamily:"'Crimson Text',serif"}}, "edit"),
          isMine
            ? React.createElement("button", {onClick:removeMine,style:{background:"transparent",border:"none",color:"#c4858a",cursor:"pointer",fontSize:"0.78rem",fontFamily:"'Crimson Text',serif"}}, "remove")
            : React.createElement("button", {onClick:()=>removeOther(p.author),style:{background:"transparent",border:"none",color:"#c4858a",cursor:"pointer",fontSize:"0.78rem",fontFamily:"'Crimson Text',serif"}}, "remove")
        )
      ),
      isEditing
        ? React.createElement("div", null,
            React.createElement("textarea", {
              value: editDraft,
              onChange: e=>setEditDraft(e.target.value),
              rows: 5,
              style:{...S.input, resize:"vertical", lineHeight:"1.7", marginBottom:"10px"}
            }),
            React.createElement("label", {style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"12px",cursor:"pointer",fontSize:"0.84rem",color:"#6a5840"}},
              React.createElement("input", {type:"checkbox", checked:keepOriginal, onChange:e=>setKeepOriginal(e.target.checked)}),
              "Keep a copy of the original version"
            ),
            React.createElement("div", {style:{display:"flex",gap:"8px"}},
              React.createElement("button", {onClick:saveEditOther, style:{...S.btn,fontSize:"0.86rem",padding:"7px 14px"}}, "Save"),
              React.createElement("button", {onClick:()=>setEditingAuthor(null), style:{...S.btnOutline,fontSize:"0.86rem",padding:"7px 14px"}}, "Cancel")
            )
          )
        : React.createElement("div", null,
            React.createElement("div", {style:{fontSize:"1rem",lineHeight:"1.8",color:"#2c2416",whiteSpace:"pre-wrap"}}, linkify(p.content)),
            p.originalContent && React.createElement("details", {style:{marginTop:"10px"}},
              React.createElement("summary", {style:{fontSize:"0.78rem",color:"#7a6a58",cursor:"pointer",fontStyle:"italic"}}, "Original version"),
              React.createElement("div", {style:{fontSize:"0.9rem",lineHeight:"1.75",color:"#6a5840",whiteSpace:"pre-wrap",marginTop:"6px",paddingLeft:"10px",borderLeft:"2px solid #d4c4a8",fontStyle:"italic"}}, p.originalContent)
            )
          )
    );
  }

  return React.createElement("div", {style:{border:"1px solid #c8b89a",borderRadius:"4px",overflow:"hidden",marginBottom:"20px"}},
    React.createElement("div", {style:{background:"rgba(200,184,154,0.15)",padding:"10px 16px",borderBottom:"1px solid #c8b89a",display:"flex",justifyContent:"space-between",alignItems:"center"}},
      React.createElement("span", {style:{fontSize:"0.82rem",fontWeight:600,color:"#6a5840",letterSpacing:"0.06em",textTransform:"uppercase"}},

        "Show all"
      )
    ),
    React.createElement("div", {style:{padding:"14px 16px",display:"flex",flexDirection:"column",gap:"16px"}},
      !showAll && React.createElement("p", {style:{color:"#7a6a58",fontStyle:"italic",fontSize:"0.88rem",margin:0}}, "Showing your perspective only"),
      ...others.map((p,i)=> React.createElement(PerspectiveBlock, {key:i,p,isMine:false})),
      myPerspective && myPerspective.author!==dominantAuthor && React.createElement(PerspectiveBlock, {p:myPerspective,isMine:true}),
      !myPerspective && !addingMine && React.createElement("button", {

        style:{alignSelf:"flex-start",...S.btnOutline,color:"#7a9e8a",borderColor:"#7a9e8a",fontSize:"0.88rem"}
      }, "+ Add my perspective"),

function PasswordCard({activePassword, data, setActivePassword, setLocked, setData}) {
  const [pw1, setPw1] = React.useState("");
  const [pw2, setPw2] = React.useState("");
  const [pwErr, setPwErr] = React.useState("");
  const [pwOk, setPwOk] = React.useState("");

  async function applyPassword() {
    setPwErr(""); setPwOk("");
    if (pw1.length < 6) { setPwErr("Password must be at least 6 characters."); return; }
    if (pw1 !== pw2) { setPwErr("Passwords don’t match."); return; }
    await saveEncrypted(pw1, data);
    setActivePassword(pw1);
    setPw1(""); setPw2("");
    setPwOk("Password set. Chronicle is now encrypted.");
  }

  async function removePassword() {
    if (!window.confirm("Remove password protection? Your data will be stored unencrypted.")) return;
    saveData(data);
    localStorage.removeItem(CRYPTO_KEY);
    setActivePassword(null);
    setPwOk("Password removed.");
  }

  return React.createElement("div",{style:{background:"rgba(255,252,245,0.7)",border:"1px solid #d4c4a8",borderRadius:"3px",padding:"20px",marginBottom:"20px"}},
    React.createElement("h3",{style:{fontFamily:"'Playfair Display',serif",fontSize:"1.1rem",color:"#1a1208",margin:"0 0 4px"}},"Lock Chronicle"),
    React.createElement("p",{style:{fontSize:"0.82rem",color:activePassword?"#89b08a":"#7a6a58",fontStyle:"italic",margin:"0 0 12px"}},
      activePassword ? "🔒 Password protected — Chronicle will ask for your password on each visit." : "🔓 No password set — Chronicle opens freely on this device."
    ),
    !activePassword && React.createElement(React.Fragment, null,
      React.createElement("p",{style:{fontSize:"0.78rem",color:"#8a7460",margin:"0 0 8px"}},"Set a password to encrypt your data. You’ll need to enter it each time you open Chronicle."),
      React.createElement("input",{
        type:"password", value:pw1, onChange:e=>{setPw1(e.target.value);setPwErr("");setPwOk("");},
        placeholder:"New password (min. 6 characters)",
        style:{...S.input,marginBottom:"8px"}
      }),
      React.createElement("input",{
        type:"password", value:pw2, onChange:e=>{setPw2(e.target.value);setPwErr("");setPwOk("");},
        placeholder:"Confirm password",
        onKeyDown:e=>{if(e.key==="Enter")applyPassword();},
        style:{...S.input,marginBottom:"10px"}
      }),
      pwErr && React.createElement("p",{style:{fontSize:"0.82rem",color:"#c4858a",fontStyle:"italic",margin:"0 0 8px"}},pwErr),
      pwOk  && React.createElement("p",{style:{fontSize:"0.82rem",color:"#4a7a5a",fontStyle:"italic",margin:"0 0 8px"}},pwOk),
      React.createElement("button",{onClick:applyPassword,disabled:!pw1||!pw2,style:{...S.btn,padding:"8px 16px",fontSize:"0.86rem",opacity:(!pw1||!pw2)?0.5:1}},"Set password")
    ),
    activePassword && React.createElement(React.Fragment, null,
      pwOk && React.createElement("p",{style:{fontSize:"0.82rem",color:"#4a7a5a",fontStyle:"italic",margin:"0 0 8px"}},pwOk),
      React.createElement("div",{style:{display:"flex",gap:"10px",flexWrap:"wrap"}},
        React.createElement("button",{
          onClick:async ()=>{
            setPwErr(""); setPwOk("");
            const np1 = window.prompt("Enter new password:");
            if (!np1) return;
            if (np1.length < 6) { setPwErr("Password must be at least 6 characters."); return; }
            const np2 = window.prompt("Confirm new password:");
            if (np1 !== np2) { setPwErr("Passwords don’t match."); return; }
            await saveEncrypted(np1, data);
            setActivePassword(np1);
            setPwOk("Password changed.");
          },
          style:{...S.btnOutline,padding:"8px 16px",fontSize:"0.86rem"}
        },"Change password"),
        React.createElement("button",{onClick:removePassword,style:{...S.btnOutline,padding:"8px 16px",fontSize:"0.86rem",color:"#c4858a",borderColor:"#e0c8c8"}},"Remove password"),

function isInAppBrowser() {
  const ua = navigator.userAgent || "";
  if (/FBAN|FBAV|FB_IAB/i.test(ua)) return "facebook";
  if (/Instagram/i.test(ua)) return "instagram";
  if (/WhatsApp/i.test(ua)) return "whatsapp";
  if (/LinkedInApp/i.test(ua)) return "linkedin";
  if (/Snapchat/i.test(ua)) return "snapchat";
  if (/TikTok|musical_ly|Bytedance/i.test(ua)) return "tiktok";
  if (/MicroMessenger/i.test(ua)) return "wechat";
  if (/Twitter/i.test(ua)) return "twitter";
  return null;
}
 
function CloudSyncPanel({buildBackupJson, importBackup, licenceKey}) {
  const [passphrase, setPassphrase] = React.useState("");
  const [showPass, setShowPass] = React.useState(false);
  const [status, setStatus] = React.useState(""); // "", "pushing", "pulling", "done", "error:..."
  const [lastPushedAt, setLastPushedAt] = React.useState(() => {
    try { return localStorage.getItem("chronicle-sync-pushedat") || ""; } catch(e) { return ""; }
  });

  function savePushedAt(ts) {
    setLastPushedAt(ts);
    try { localStorage.setItem("chronicle-sync-pushedat", ts); } catch(e) {}
  }

  async function keyHash(licKey) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(licKey.trim().toUpperCase()));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }

  // Encrypt/decrypt binary blobs for photo sync
  async function encryptBlob(password, blob) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt);
    const buf = await blob.arrayBuffer();
    const enc = await crypto.subtle.encrypt({name:"AES-GCM",iv}, key, buf);
    // Pack: salt(16) + iv(12) + ciphertext
    const out = new Uint8Array(16 + 12 + enc.byteLength);
    out.set(salt, 0); out.set(iv, 16); out.set(new Uint8Array(enc), 28);
    return out.buffer;
  }
  async function decryptBlob(password, packed) {
    const arr = new Uint8Array(packed);
    const salt = arr.slice(0, 16);
    const iv = arr.slice(16, 28);
    const ciphertext = arr.slice(28);
    const key = await deriveKey(password, salt);
    return await crypto.subtle.decrypt({name:"AES-GCM",iv}, key, ciphertext);
  }

  async function buildSyncJson() {
    // Like buildBackupJson but strips media blobs — returns {json, mediaIds}
    const full = await buildBackupJson();
    const parsed = JSON.parse(full);
    const mediaIds = new Set();
    if (parsed.memories) parsed.memories = parsed.memories.map(m => ({
      ...m, mediaUrls: (m.mediaUrls||[]).map(med => {
        if (med.mediaId) { mediaIds.add(med.mediaId); return {mediaId:med.mediaId,name:med.name}; }
        return med;
      })
    }));
    if (parsed.entityPhotos) Object.keys(parsed.entityPhotos).forEach(k => {
      const ep = parsed.entityPhotos[k];
      if (ep?.mediaId) { mediaIds.add(ep.mediaId); parsed.entityPhotos[k] = {mediaId:ep.mediaId,name:ep.name}; }
    });
    return { json: JSON.stringify(parsed), mediaIds: [...mediaIds] };
  }

  async function push() {
    if (!passphrase.trim()) { setStatus("error:Enter a sync passphrase first."); return; }
    if (!licenceKey) { setStatus("error:A licence key is required for cloud sync."); return; }
    setStatus("pushing");
    try {
      const { json, mediaIds } = await buildSyncJson();
      const encrypted = await encryptData(passphrase, json);
      const hash = await keyHash(licenceKey);
      // 1. Push metadata
      const res = await fetch(WORKER_URL + "/sync/push", {
        method: "POST",
        headers: {"Content-Type":"application/json","X-Chronicle-Client":"1"},
        body: JSON.stringify({keyHash: hash, ...encrypted, mediaIds, ...(lastPushedAt ? {knownPushedAt: lastPushedAt} : {})}),
      });
      if (res.status === 409) { setStatus("error:Another device pushed more recently — pull first to avoid overwriting it, then push again."); return; }
      if (!res.ok) { const e=await res.json().catch(()=>({})); setStatus("error:"+(e.error||res.status)); return; }
      const pushResult = await res.json().catch(()=>({}));
      if (pushResult.pushedAt) savePushedAt(pushResult.pushedAt);
      // 2. Upload photos to R2
      if (mediaIds.length > 0) {
        setStatus("pushing photos (0/"+mediaIds.length+")");
        let uploaded = 0;
        const allMedia = await idbGetAll();
        for (const mediaId of mediaIds) {
          const blob = allMedia[mediaId];
          if (!blob) { uploaded++; continue; }
          try {
            const encBuf = await encryptBlob(passphrase, blob);
            await fetch(WORKER_URL + "/sync/media/" + hash + "/" + encodeURIComponent(mediaId), {
              method: "PUT",
              headers: {"Content-Type":"application/octet-stream","X-Chronicle-Client":"1"},
              body: encBuf,
            });
          } catch(e) { /* skip failed photo, continue with rest */ }
          uploaded++;
          setStatus("pushing photos ("+uploaded+"/"+mediaIds.length+")");
        }
      }
      setStatus("done");
      setTimeout(()=>setStatus(""),3000);
    } catch(e) { setStatus("error:"+e.message); }
  }

  async function pull() {
    if (!passphrase.trim()) { setStatus("error:Enter your sync passphrase first."); return; }
    if (!licenceKey) { setStatus("error:A licence key is required for cloud sync."); return; }
    setStatus("pulling");
    try {
      const hash = await keyHash(licenceKey);
      const res = await fetch(WORKER_URL + "/sync/pull/" + hash, {headers:{"X-Chronicle-Client":"1"}});
      if (res.status === 404) { setStatus("error:No sync data found. Push from your other device first."); return; }
      if (!res.ok) { const e=await res.json().catch(()=>({})); setStatus("error:"+(e.error||res.status)); return; }
      const stored = await res.json();
      const plain = await decryptData(passphrase, stored);
      if (!plain) { setStatus("error:Wrong passphrase — could not decrypt."); return; }
      if (stored.pushedAt) savePushedAt(stored.pushedAt);
      // 1. Import metadata
      const fakeEvt = {target:{files:[new File([plain],"chronicle-sync.json",{type:"application/json"})]}};
      importBackup(fakeEvt);
      // 2. Download photos from R2
      const mediaIds = stored.mediaIds || [];
      if (mediaIds.length > 0) {
        setStatus("pulling photos (0/"+mediaIds.length+")");
        let downloaded = 0;
        for (const mediaId of mediaIds) {
          try {
            // Skip if already in IDB
            const existing = await idbGet(mediaId);
            if (existing) { downloaded++; setStatus("pulling photos ("+downloaded+"/"+mediaIds.length+")"); continue; }
            const mr = await fetch(WORKER_URL + "/sync/media/" + hash + "/" + encodeURIComponent(mediaId), {headers:{"X-Chronicle-Client":"1"}});
            if (mr.ok) {
              const encBuf = await mr.arrayBuffer();
              const decBuf = await decryptBlob(passphrase, encBuf);
              await idbPut(mediaId, new Blob([decBuf]));
            }
          } catch(e) { /* skip failed photo */ }
          downloaded++;
          setStatus("pulling photos ("+downloaded+"/"+mediaIds.length+")");
        }
      }
      setStatus("done");
      setTimeout(()=>setStatus(""),3000);
    } catch(e) { setStatus("error:"+e.message); }
  }

  const isErr = status.startsWith("error:");
  const errMsg = isErr ? status.slice(6) : "";

  return React.createElement("div",null,
    React.createElement("p",{style:{fontSize:"0.82rem",color:"#8a7460",margin:"0 0 4px",lineHeight:1.6}},
      "Your memories are encrypted with your passphrase before leaving your device. We never see them in readable form."),
    React.createElement("p",{style:{fontSize:"0.78rem",color:"#a8885a",fontStyle:"italic",margin:"0 0 12px"}},
      "Use the same passphrase on all your devices."),
    React.createElement("div",{style:{position:"relative",marginBottom:"12px"}},
      React.createElement("input",{
        type:showPass?"text":"password",
        value:passphrase,
        onChange:e=>setPassphrase(e.target.value),
        placeholder:"Sync passphrase",
        style:{...S.input,paddingRight:"60px"}
      }),
      React.createElement("button",{
        onClick:()=>setShowPass(s=>!s),
        style:{position:"absolute",right:"8px",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#8a7460",cursor:"pointer",fontSize:"0.78rem"}
      },showPass?"Hide":"Show")
    ),
    React.createElement("div",{style:{display:"flex",gap:"8px",marginBottom:"8px"}},
      React.createElement("button",{
        onClick:push,
        disabled:status==="pushing"||status==="pulling",
        style:{...S.btn,flex:1,opacity:(status==="pushing"||status==="pulling")?0.6:1}
      },status==="pushing"?"Pushing\u2026":"Push to cloud"),
      React.createElement("button",{
        onClick:pull,
        disabled:status==="pushing"||status==="pulling",
        style:{...S.btnOutline,flex:1,opacity:(status==="pushing"||status==="pulling")?0.6:1}
      },status==="pulling"?"Pulling\u2026":"Pull from cloud")
    ),
    status==="done"&&React.createElement("p",{style:{fontSize:"0.82rem",color:"#4a7a5a",fontStyle:"italic"}},"✓ Done"),
    isErr&&React.createElement("p",{style:{fontSize:"0.82rem",color:"#c4858a",marginTop:"4px"}},errMsg)
  );
}

// ── SharingView ───────────────────────────────────────────────
function SharingView({memories, shareHistory, ownerName, shareCodeInput, setShareCodeInput,
  shareCodeStatus, importFromCode, setView, setSelected, ownerEmail,
  subject, isCarerMode, acceptShare, setPendingConnectRequest, onShareBadgeCount,
  contributionLinks, persistSubject}) {

  const isLegacyMode = subject && !subject.isSelf;
  const [tab, setTab] = React.useState(isLegacyMode ? "contributions" : "inbox");

  // Contribution link creation state
  const [linkNote, setLinkNote] = React.useState("");
  const [linkBusy, setLinkBusy] = React.useState(false);
  const [linkCopied, setLinkCopied] = React.useState(null); // code that was just copied
  const [pendingDeliveries, setPendingDeliveries] = React.useState([]);
  const [inboxItems, setInboxItems] = React.useState([]);
  const [serverDeclined, setServerDeclined] = React.useState([]);

  // Inline review state (replaces the App-level modal)
  const [reviewing, setReviewing] = React.useState(null); // {delivery, memIdx}
  const [editDraft, setEditDraft] = React.useState(null); // {title, content, addedByName}
  const [declined, setDeclined] = React.useState(new Set()); // set of "deliveryIdx:memIdx"

  React.useEffect(() => {
    if (!ownerEmail) return;
    if (isLegacyMode) {
      fetch(WORKER_URL + "/my/deliveries/fetch", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email:ownerEmail})
      }).then(r=>r.ok?r.json():{deliveries:[]})
        .then(d=>{
          if (d.deliveries && d.deliveries.length) {
            setPendingDeliveries(d.deliveries);
            if (onShareBadgeCount) onShareBadgeCount(d.deliveries.reduce((n,del)=>(n+(del.memories||[]).length),0));
          }
        })
        .catch(()=>{});
    } else {
      fetch(WORKER_URL + "/share/inbox/fetch", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email:ownerEmail})
      }).then(r=>r.ok?r.json():{inbox:[],declined:[]})
        .then(d=>{
          const items = d.inbox || [];
          const dec = d.declined || [];
          const activeCount = items.filter(item=>!dec.some(dc=>dc.shareId===item._shareId)).length;
          setInboxItems(items);
          setServerDeclined(dec);
          if (onShareBadgeCount) onShareBadgeCount(activeCount);
        })
        .catch(()=>{});
    }
  }, [ownerEmail]);

  const received = memories.filter(m => m.sharedBy);
  const sent = shareHistory || [];
  const sentMemoryCount = new Set(sent.flatMap(h => h.memIds || [])).size;
  const sentPeopleCount = new Set(sent.flatMap(h => h.people || [])).size;
  const pendingMemCount = pendingDeliveries.reduce((n,d)=>(n+(d.memories||[]).length),0);
  const activeInboxItems = inboxItems.filter(item => !serverDeclined.some(dc => dc.shareId === item._shareId));
  const activeInboxCount = activeInboxItems.length;

  // Keep badge count in sync whenever items change (accept/decline/review)
  React.useEffect(() => {
    if (onShareBadgeCount) onShareBadgeCount(isLegacyMode ? pendingMemCount : activeInboxCount);
  }, [pendingMemCount, activeInboxCount]);

  // Inbox helpers
  async function respondToShare(shareId, action) {
    try {
      await fetch(WORKER_URL + "/share/inbox/respond", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email:ownerEmail, shareId, action})
      });
    } catch(e) {}
  }
  function acceptInboxItem(item) {
    (item.memories||[]).forEach(mem => {
      acceptShare({sharedBy:item.fromName||"Someone", sharedAt:item.sentAt||new Date().toISOString(), memories:[mem]});
    });
    respondToShare(item._shareId, "accept");
    setInboxItems(prev => prev.filter(i => i._shareId !== item._shareId));
    if (onShareBadgeCount) onShareBadgeCount(Math.max(0, activeInboxCount - 1));
  }
  function declineInboxItem(item) {
    respondToShare(item._shareId, "decline");
    setServerDeclined(prev => [...prev, {shareId:item._shareId, declinedAt:new Date().toISOString(), memIds:(item.memories||[]).map(m=>m.id)}]);
    if (onShareBadgeCount) onShareBadgeCount(Math.max(0, activeInboxCount - 1));
  }
  function reconsiderItem(shareId) {
    setServerDeclined(prev => prev.filter(d => d.shareId !== shareId));
    if (onShareBadgeCount) onShareBadgeCount(activeInboxCount + 1);
  }

  // Group sent by recipient person
  const byPerson = {};
  sent.forEach(h => {
    (h.people || []).forEach(p => {
      if (!byPerson[p]) byPerson[p] = [];
      byPerson[p].push(h);
    });
  });

  // Duplicate detection: does a memory in the chronicle closely match this incoming one?
  function isDuplicate(m) {

      existing.year === m.year &&
      existing.title.toLowerCase().trim() === (m.title||"").toLowerCase().trim()
    );
  }

  // Accept a single memory from a delivery

    const finalMem = {...mem, ...overrides};
    acceptShare({...delivery, memories:[finalMem]});
  }

  async function createContributionLink() {
    if (!ownerEmail) return;
    setLinkBusy(true);
    try {
      const r = await fetch(WORKER_URL + "/contribute/create", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          ownerEmail, subjectName: subject?.name || ownerName,
          subjectId: subject?.id || "", note: linkNote.trim(),

        const newLink = { code: d.code, url: d.url, note: linkNote.trim(),
          subjectName: subject?.name || ownerName, createdAt: new Date().toISOString() };
        persistSubject({ contributionLinks: [...(contributionLinks||[]), newLink] });
        setLinkNote("");
        navigator.clipboard?.writeText(d.url).catch(()=>{});
        setLinkCopied(d.code);
        setTimeout(() => setLinkCopied(null), 3000);
      }
    } catch {}
    setLinkBusy(false);
  }

  function revokeContributionLink(code) {
    persistSubject({ contributionLinks: (contributionLinks||[]).filter(l=>l.code!==code) });
  }

  const cardStyle = {background:"rgba(255,252,245,0.7)",border:"1px solid #d4c4a8",borderRadius:"3px",padding:"16px 20px",marginBottom:"14px"};
  const tabActive  = {padding:"8px 18px",border:"none",background:"transparent",cursor:"pointer",fontFamily:"'Crimson Text',serif",fontSize:"0.95rem",marginBottom:"-2px",borderBottom:"2px solid #2c2416",color:"#1a1208",fontWeight:600,position:"relative"};

  // ── Inline edit/review panel ──

// ── Shared (intertwined) timeline ─────────────────────────────────────────
function SharedTimelineView({ memories, subjectName, setSelected, setView }) {
  const ownMems = memories.filter(m => !m.gedcomContext);
  const ctxMems = memories.filter(m =>  m.gedcomContext);

  // Build relative list: name → relationship (extracted from title "[Rel]")
  const relMap = {};  // name → rel label
  ctxMems.forEach(m => {
    const name = m.people?.[0];
    if (!name || relMap[name] !== undefined) return;
    relMap[name] = m.title.match(/\[([^\]]+)\]/)?.[1] || "";
  });
  const relatives = Object.entries(relMap); // [[name, rel], ...]

  // Colour palette — subject gets gold, relatives cycle through muted tones
  const PALETTE = ["#7a9e8a","#8a6a9a","#5a8a9a","#9a7a5a","#8a9a5a",
                   "#c4858a","#6a8a6a","#9a6a7a","#6a7a9a","#9a8a6a"];
  const personColor = { [subjectName]: "#c8a84a" };
  relatives.forEach(([name], i) => { personColor[name] = PALETTE[i % PALETTE.length]; });

  const [shown, setShown] = React.useState(() => {
    const s = new Set([subjectName]);
    relatives.forEach(([n]) => s.add(n));
    return s;
  });
  function toggle(name) {
    setShown(s => { const n = new Set(s); n.has(name) ? n.delete(name) : n.add(name); return n; });
  }

  // Merge and filter
  const allEvents = [
    ...ownMems.map(m => ({ ...m, _person: subjectName })),
    ...ctxMems.map(m => ({ ...m, _person: m.people?.[0] || "" })),
  ]
    .filter(m => m._person && shown.has(m._person))
    .sort((a,b) => (a.year||0)-(b.year||0) || (a.month||1)-(b.month||1) || (a.day||1)-(b.day||1));

  // Group by decade
  const byDec = {};
  allEvents.forEach(m => {
    const dec = Math.floor((m.year||0)/10)*10;
    (byDec[dec] = byDec[dec]||[]).push(m);
