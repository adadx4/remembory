name = "remembory-share"
main = "src/index.js"
compatibility_date = "2024-01-01"

# KV namespace for storing share payloads
# After running `wrangler kv namespace create SHARES`, paste the id below
[[kv_namespaces]]
binding = "SHARES"
id = "24f7cd3fa472486dbbf4283831d8790c"

# Keep share.remembory.net active for existing share links
[[routes]]
pattern = "share.remembory.net/*"
zone_name = "remembory.net"

# Social domain
[[routes]]
pattern = "social.remembory.net/*"
zone_name = "remembory.net"

# Mailing List
[[kv_namespaces]]
binding = "MAILING_LIST"
id = "e9a03844192b46828417a458140de7f6"

# R2 bucket for syncing photos
[[r2_buckets]]
bucket_name = "remembory-media"
binding = "MEDIA"

# Secrets (set via wrangler secret put):
# ADMIN_SECRET — protects GET /mailing/list

# ── Staging environment ───────────────────────────────────────────────────────
# Deploy with: npm run deploy:staging (or: wrangler deploy --env staging)
# Before first deploy, create KV namespaces:
#   wrangler kv namespace create SHARES --env staging
#   wrangler kv namespace create MAILING_LIST --env staging
# Then paste the returned IDs below.
[env.staging]
name = "remembory-staging"

[env.staging.assets]
directory = "./dist"

[[env.staging.kv_namespaces]]
binding = "SHARES"
id = "bb346bcd219742ffb25b089cf90e58f6"

[[env.staging.kv_namespaces]]
binding = "MAILING_LIST"
id = "8a3aef2b20cf4a13b76740237314b036"

[[env.staging.r2_buckets]]
bucket_name = "remembory-media"
binding = "MEDIA"

[[env.staging.routes]]
pattern = "staging.remembory.net/*"
zone_name = "remembory.net"