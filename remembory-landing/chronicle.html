const { useState, useEffect, useRef, useCallback } = React;

// ── Responsive hook ────────────────────────────────────────────
function useWindowSize() {
  const [w, setW] = useState(window.innerWidth);
  useEffect(()=>{ const h=()=>setW(window.innerWidth); window.addEventListener("resize",h); return ()=>window.removeEventListener("resize",h); },[]);
  return w;
}

// ── Constants ──────────────────────────────────────────────────
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const TAGS = ["childhood","family","travel","education","work","love","health","milestone","home","friendship","adventure","loss"];

  card: { background:"rgba(255,252,245,0.85)", border:"1px solid #e0d4be", borderRadius:"3px", padding:"14px 18px", marginBottom:"12px", cursor:"pointer", position:"relative", transition:"all 0.18s" },
};

// ── Helpers ────────────────────────────────────────────────────
function fuzzyDateLabel(m) {
  const { year, month, day, fuzzy, season } = m;
  function startLabel() {
    if (fuzzy==="decade") return `${Math.floor(year/10)*10}s`;
    if (fuzzy==="year") return `${year}`;
    if (fuzzy==="season") return `${season} ${year}`;
    if (fuzzy==="month") return `${MONTHS[month-1]} ${year}`;
    return `${MONTHS[month-1]} ${day}, ${year}`;
  }
  if (!m.endFuzzy) return startLabel();
  if (m.endOngoing) return `${startLabel()} – present`;
  function endLabel() {
    const { endYear:ey, endMonth:em, endDay:ed, endFuzzy:ef, endSeason:es } = m;
    if (ef==="decade") return `${Math.floor(ey/10)*10}s`;
    if (ef==="year") return `${ey}`;
    if (ef==="season") return `${es||"Early"} ${ey}`;
    if (ef==="month") return `${MONTHS[(em||1)-1]} ${ey}`;
    return `${MONTHS[(em||1)-1]} ${ed||1}, ${ey}`;
  }
  return `${startLabel()} – ${endLabel()}`;
}

function sortKey(m) {
  const mv = m.fuzzy==="month"||m.fuzzy==="day" ? (m.month||1) :
             m.fuzzy==="season" ? (m.season==="Early"?2:m.season==="Mid"?6:m.season==="Late"?10:6) : 1;
  return m.year*10000 + mv*100 + (m.fuzzy==="day"?m.day||1:1);
}

function newForm() {
  return { title:"", content:"", year:new Date().getFullYear(), month:1, day:1, fuzzy:"day", season:"Early", location:"", locations:[], tags:[], people:[], orgs:[], mediaUrls:[], endFuzzy:null, endYear:null, endMonth:1, endDay:1, endSeason:"Early", endOngoing:false };
}

// ── Storage ────────────────────────────────────────────────────

// ── IndexedDB for media blobs ──────────────────────────────────
const IDB_NAME = "chronicle-media";
const IDB_STORE = "blobs";
let _idb = null;

function openIDB() {
  if (_idb) return Promise.resolve(_idb);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess = e => { _idb = e.target.result; resolve(_idb); };
    req.onerror = () => reject(req.error);
  });
}

async function idbPut(id, blob) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(blob, id);
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
}

async function idbGet(id) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(id);
    req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error);
  });
}

async function idbDelete(id) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
}

async function idbGetAll() {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const items = {};
    const tx = db.transaction(IDB_STORE);
    const req = tx.objectStore(IDB_STORE).openCursor();
    req.onsuccess = e => {
      const cursor = e.target.result;
      if (cursor) { items[cursor.key] = cursor.value; cursor.continue(); }
      else resolve(items);
    };
    req.onerror = () => reject(req.error);
  });
}

// Save a data-url string as a blob in IDB, return the mediaId
async function storeMedia(dataUrl, name) {
  const mediaId = "media_" + Date.now() + "_" + Math.random().toString(36).slice(2);
  // Convert data-url to Blob
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  await idbPut(mediaId, blob);
  return { mediaId, name };
}

// Resolve a mediaId (or legacy base64 url) to an object URL for display
const _objUrlCache = {};
async function resolveMediaUrl(med) {
  // Legacy: inline base64 data-url stored directly
  if (med.url && med.url.startsWith("data:")) {
    // Migrate inline to IDB on first access
    if (!med.mediaId) {
      const { mediaId } = await storeMedia(med.url, med.name || "photo");
      med.mediaId = mediaId;
      med.url = null; // strip inline data after migration
    }
  }
  if (!med.mediaId) return null;
  if (_objUrlCache[med.mediaId]) return _objUrlCache[med.mediaId];
  const blob = await idbGet(med.mediaId);
  if (!blob) return null;
  const objUrl = URL.createObjectURL(blob);
  _objUrlCache[med.mediaId] = objUrl;
  return objUrl;
}

// ── Crypto helpers ────────────────────────────────────────────
const CRYPTO_KEY = "chronicle-crypto";  // stores {salt, iv, ciphertext, check} — all base64

function b64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function unb64(s) { return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }

async function deriveKey(password, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt, iterations:200000, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]
  );
}

async function encryptData(password, plaintext) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await deriveKey(password, salt);
  const enc  = await crypto.subtle.encrypt({name:"AES-GCM",iv}, key, new TextEncoder().encode(plaintext));
  // Store a small check token so we can verify the password before decrypting everything
  const checkIv  = crypto.getRandomValues(new Uint8Array(12));
  const checkEnc = await crypto.subtle.encrypt({name:"AES-GCM",iv:checkIv}, key, new TextEncoder().encode("chronicle-ok"));
  return { salt:b64(salt), iv:b64(iv), ciphertext:b64(enc), checkIv:b64(checkIv), check:b64(checkEnc) };
}

async function decryptData(password, stored) {
  try {
    const salt = unb64(stored.salt);
    const key  = await deriveKey(password, salt);
    // Verify password with the check token first
    const checkPlain = await crypto.subtle.decrypt(
      {name:"AES-GCM", iv:unb64(stored.checkIv)}, key, unb64(stored.check)
    );
    if (new TextDecoder().decode(checkPlain) !== "chronicle-ok") return null;
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(stored.iv)}, key, unb64(stored.ciphertext));
    return new TextDecoder().decode(plain);
  } catch(e) { return null; }
}

function isEncrypted() {
  try { const d = localStorage.getItem(CRYPTO_KEY); return !!d && !!JSON.parse(d).ciphertext; } catch(e) { return false; }
}

async function saveEncrypted(password, data) {
  const clean = {
    ...data,
    memories: data.memories.map(m => ({
      ...m,
      mediaUrls: (m.mediaUrls||[]).map(med => med.url?.startsWith("data:") ? {mediaId:med.mediaId, name:med.name} : med)
    }))
  };
  const stored = await encryptData(password, JSON.stringify(clean));
  localStorage.setItem(CRYPTO_KEY, JSON.stringify(stored));
  localStorage.removeItem(STORAGE_KEY); // remove unencrypted copy
  return true;
}

async function loadEncrypted(password) {
  try {
    const stored = JSON.parse(localStorage.getItem(CRYPTO_KEY));
    const plain  = await decryptData(password, stored);
    if (!plain) return null; // wrong password
    return JSON.parse(plain);
  } catch(e) { return null; }
}

// ── Unencrypted fallback ───────────────────────────────────────
function loadData() {
  try {
    const d = localStorage.getItem(STORAGE_KEY);
    const data = d ? JSON.parse(d) : { memories:[], customTags:[], knownPeople:[], knownOrgs:[], knownLocations:[], ownerName:"", ownerEmail:"" };
    const seededPeople=[...new Set([...(data.knownPeople||[]),...(data.memories||[]).flatMap(m=>m.people||[])])].sort();
    const seededOrgs=[...new Set([...(data.knownOrgs||[]),...(data.memories||[]).flatMap(m=>m.orgs||[])])].sort();
    const seededLocations=[...new Set([...(data.knownLocations||[]),...(data.memories||[]).flatMap(m=>[m.location,...(m.locations||[])].filter(Boolean))])].sort();
    return {...data, knownPeople:seededPeople, knownOrgs:seededOrgs, knownLocations:seededLocations};
  } catch(e) { return { memories:[], customTags:[], knownPeople:[], knownOrgs:[], knownLocations:[], ownerName:"", ownerEmail:"" }; }
}
function saveData(data) {
  const clean = {
    ...data,
    memories: data.memories.map(m => ({
      ...m,
      mediaUrls: (m.mediaUrls||[]).map(med => med.url?.startsWith("data:") ? {mediaId:med.mediaId, name:med.name} : med)
    }))
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(clean)); return true; } catch(e) { return false; }
}

function seedData(data) {
  const seededPeople=[...new Set([...(data.knownPeople||[]),...(data.memories||[]).flatMap(m=>m.people||[])])].sort();
  const seededOrgs=[...new Set([...(data.knownOrgs||[]),...(data.memories||[]).flatMap(m=>m.orgs||[])])].sort();
  const seededLocations=[...new Set([...(data.knownLocations||[]),...(data.memories||[]).flatMap(m=>[m.location,...(m.locations||[])].filter(Boolean))])].sort();
  return {...data, knownPeople:seededPeople, knownOrgs:seededOrgs, knownLocations:seededLocations};
}

const EMPTY_DATA = { memories:[], customTags:[], knownPeople:[], knownOrgs:[], knownLocations:[], ownerName:"", ownerEmail:"" };

// ── EXIF ───────────────────────────────────────────────────────
function extractExif(buffer) {
  try {
    const view = new DataView(buffer);
    if (view.getUint16(0) !== 0xFFD8) return {};
    let offset = 2;
    while (offset < view.byteLength - 4) {
      const marker = view.getUint16(offset);
      const segLen = view.getUint16(offset + 2);
      if (marker === 0xFFE1) {
        const hdr = String.fromCharCode(...new Uint8Array(buffer, offset + 4, 6));
        if (hdr.startsWith("Exif")) {
          return parseExifSegment(view, offset + 10);
        }
      }
      if (marker === 0xFFDA) break;
      offset += 2 + segLen;
    }
  } catch(e) {}
  return {};
}

function parseExifSegment(view, tiff) {
  try {
    const le  = view.getUint16(tiff) === 0x4949;
    const g16 = o => view.getUint16(tiff + o, le);
    const g32 = o => view.getUint32(tiff + o, le);
    function readASCII(offset, len) {
      return String.fromCharCode(...new Uint8Array(view.buffer, tiff + offset, len)).replace(/\0/g, "");
    }
    function scanIFD(ifdOffset) {
      const tags = {}; const n = g16(ifdOffset);
      for (let i = 0; i < n; i++) {
        const e = ifdOffset + 2 + i * 12;
        const tag = g16(e); const typ = g16(e+2); const cnt = g32(e+4); const val = g32(e+8);
        tags[tag] = { typ, cnt, val };
      }
      return tags;
    }
    const ifd0 = g32(4);
    const ifd0Tags = scanIFD(ifd0);
    let dateResult = null;
    const exifIFDPtr = ifd0Tags[0x8769];
    if (exifIFDPtr) {
      const exifTags = scanIFD(exifIFDPtr.val);
      for (const dtTag of [0x9003, 0x9004, 0x0132]) {
        const t = exifTags[dtTag] || ifd0Tags[dtTag];
        if (t) {
          const ds = readASCII(t.val, 19);
          const mx = ds.match(/^(\d{4}):(\d{2}):(\d{2})/);
          if (mx) { dateResult = { year:+mx[1], month:+mx[2], day:+mx[3] }; break; }
        }
      }
    }
    if (!dateResult && ifd0Tags[0x0132]) {
      const ds = readASCII(ifd0Tags[0x0132].val, 19);
      const mx = ds.match(/^(\d{4}):(\d{2}):(\d{2})/);
      if (mx) dateResult = { year:+mx[1], month:+mx[2], day:+mx[3] };
    }
    return { ...dateResult };
  } catch(e) {}
  return {};
}

// ── Email parser ───────────────────────────────────────────────

// Decode quoted-printable encoding (=XX hex escapes, soft line breaks)
function decodeQP(str) {
  return str
    .replace(/=\r?\n/g, "")                          // soft line breaks
    .replace(/=([0-9A-Fa-f]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
}

// Decode encoded-word headers: =?UTF-8?Q?...?= or =?UTF-8?B?...?=
function decodeHeader(str) {
  return str.replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g, (_, charset, enc, data) => {
    try {
      if (enc.toUpperCase() === "B") {
        const bin = atob(data);
        return new TextDecoder(charset).decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
      } else {
        return decodeQP(data.replace(/_/g, " "));
      }
    } catch(e) { return data; }
  });
}

// Parse raw MIME headers from a block of text, returning {headers, bodyStart}
function parseMimeHeaders(text) {
  const headers = {};
  let i = 0;
  const lines = text.split(/\r?\n/);
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === "") { i++; break; }           // blank line = end of headers
    // fold continuation lines (start with whitespace)
    let full = line;
    while (i + 1 < lines.length && /^[ \t]/.test(lines[i + 1])) {
      i++;
      full += " " + lines[i].trim();
    }
    const colon = full.indexOf(":");
    if (colon > 0) {
      const key = full.slice(0, colon).trim().toLowerCase();
      const val = full.slice(colon + 1).trim();
      headers[key] = val;
    }
    i++;
  }
  return { headers, bodyLines: lines.slice(i) };
}

// Extract the best plain-text part from a MIME message (recursive)
function extractPlainText(headers, bodyLines) {
  const ct = headers["content-type"] || "text/plain";
  const cte = (headers["content-transfer-encoding"] || "").toLowerCase();

  // Multipart: find boundary and recurse into parts
  const boundaryMatch = ct.match(/boundary="?([^";\s]+)"?/i);
  if (boundaryMatch) {
    const boundary = boundaryMatch[1];
    const body = bodyLines.join("\n");
    const parts = body.split(new RegExp("--" + boundary.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?:--)?\\r?\\n?"));
    let plain = "";
    let html = "";
    for (const part of parts) {
      if (!part.trim() || part.trim() === "--") continue;
      const { headers: ph, bodyLines: pb } = parseMimeHeaders(part);
      const pct = ph["content-type"] || "";
      if (/text\/plain/i.test(pct)) plain = extractPlainText(ph, pb);
      else if (/text\/html/i.test(pct) && !plain) html = extractPlainText(ph, pb);
      else if (/multipart\//i.test(pct)) {
        const nested = extractPlainText(ph, pb);
        if (nested) plain = nested;
      }
    }
    return plain || html;
  }

  // Leaf part: decode the body
  let body = bodyLines.join("\n");
  if (cte === "quoted-printable") body = decodeQP(body);
  else if (cte === "base64") {
    try { body = atob(body.replace(/\s+/g, "")); } catch(e) { return ""; }
  }

  // Strip HTML tags if this is an HTML part
  if (/text\/html/i.test(ct)) {
    body = body
      .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, "")
      .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, "")
      .replace(/<br\s*\/?>/gi, "\n")
      .replace(/<\/p>/gi, "\n\n")
      .replace(/<\/div>/gi, "\n")
      .replace(/<[^>]+>/g, "")
      .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&nbsp;/g, " ");
  }

  // Clean up: collapse quoted reply chains (lines starting with >)
  body = body
    .split("\n")
    .filter(l => !l.trimStart().startsWith(">"))   // strip quoted lines
    .join("\n")
    .replace(/On .{10,80}wrote:\s*$/m, "")          // strip "On [date] X wrote:"
    .replace(/\n{3,}/g, "\n\n")                     // collapse excess blank lines
    .trim();

  return body;
}

function parseEmail(text) {
  const { headers, bodyLines } = parseMimeHeaders(text);

  const from    = decodeHeader(headers["from"]    || "");
  const subject = decodeHeader(headers["subject"] || "");
  const dateStr = headers["date"] || "";

  let year=null, month=null, day=null, fuzzy="day";
  if (dateStr) {
    const d = new Date(dateStr);
    if (!isNaN(d)) { year=d.getFullYear(); month=d.getMonth()+1; day=d.getDate(); }
  }
  if (!year) fuzzy = "year";

  const body = extractPlainText(headers, bodyLines).slice(0, 3000);

  return {
    from, subject, dateStr,
    body,
    year: year || new Date().getFullYear(),
    month: month || 1,
    day: day || 1,
    fuzzy
  };
}

// ── Sub-components ─────────────────────────────────────────────
function TagPicker({tags, onToggle, customTags=[], onAddCustom, onRemoveCustom}) {
  const [input, setInput] = React.useState("");
  const allTags = [...TAGS, ...customTags];
  function handleAdd() {
    const t=input.trim().toLowerCase(); if(!t||allTags.includes(t)){setInput("");return;}
    onAddCustom&&onAddCustom(t); onToggle(t); setInput("");
  }
  return React.createElement("div",null,
    React.createElement("div",{style:{display:"flex",flexWrap:"wrap",gap:"5px",marginBottom:"8px"}},
      allTags.map(tag=>{

// ── Linkify — turn URLs in text into clickable anchors ──────────
function linkify(text) {
  if (!text) return null;
  const urlRe = /https?:\/\/[^\s<>"()]+[^\s<>"().,:;!?]/g;
  const parts = []; let last = 0; let m;
  while ((m = urlRe.exec(text)) !== null) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    parts.push(React.createElement("a", {
      key: m.index, href: m[0], target: "_blank", rel: "noopener noreferrer",
      style: { color: "#5a6a8a", textDecoration: "underline", textDecorationColor: "#c8b89a", wordBreak: "break-all" },
      onClick: e => e.stopPropagation()
    }, m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push(text.slice(last));
  return parts.length === 1 && typeof parts[0] === "string" ? text : parts;
}

// ── Geocode cache (persisted in localStorage) ─────────────────
const GEOCODE_CACHE_KEY = "chronicle-geocode-cache";
function loadGeocodeCache() { try { return JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY)||"{}"); } catch(e) { return {}; } }
function saveGeocodeCache(cache) { try { localStorage.setItem(GEOCODE_CACHE_KEY, JSON.stringify(cache)); } catch(e) {} }

async function geocode(name, cache) {
  if (cache[name]) return cache[name];
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(name)}&format=json&limit=1`, {
      headers: { "Accept-Language": "en", "User-Agent": "Chronicle-Journal-App" }
    });
    const data = await res.json();
    if (data[0]) {
      const result = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), display: data[0].display_name };
      cache[name] = result;
      saveGeocodeCache(cache);
      return result;
    }
    cache[name] = null; saveGeocodeCache(cache); return null;
  } catch(e) { return null; }
}

// ── MapView component ──────────────────────────────────────────
function MapView({ memories, onSelectLocation }) {
  const mapRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const [status, setStatus] = useState(""); // loading message
  const [geocodeCache, setGeocodeCache] = useState(loadGeocodeCache);

  // Collect all unique locations, tracking primary vs secondary
  const locationMemories = {};
  const locationIsPrimary = {};
  memories.forEach(m => {
    if (m.location) {
      if (!locationMemories[m.location]) { locationMemories[m.location] = []; locationIsPrimary[m.location] = false; }
      locationMemories[m.location].push(m);
      locationIsPrimary[m.location] = true; // at least one memory has it as primary
    }
    (m.locations||[]).forEach(loc => {
      if (!loc) return;
      if (!locationMemories[loc]) { locationMemories[loc] = []; locationIsPrimary[loc] = false; }
      if (!locationMemories[loc].includes(m)) locationMemories[loc].push(m);
    });
  });
  const uniqueLocations = Object.keys(locationMemories);

  useEffect(() => {
    if (!mapRef.current || mapInstanceRef.current) return;

    // Init map
    const map = L.map(mapRef.current, { zoomControl: true }).setView([20, 0], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 18
    }).addTo(map);
    mapInstanceRef.current = map;

    // Geocode and place pins
    const cache = loadGeocodeCache();
    const pending = uniqueLocations.filter(l => !cache[l]);
    if (pending.length > 0) setStatus(`Locating ${pending.length} place${pending.length===1?"":"s"}…`);

    const markers = [];

    async function placePins() {
      for (const loc of uniqueLocations) {
        // Rate limit: 1 req/sec for Nominatim
        if (!cache[loc]) await new Promise(r => setTimeout(r, 1100));
        const coords = await geocode(loc, cache);
        if (!coords || !mapInstanceRef.current) continue;

        const mems = locationMemories[loc];
        const count = mems.length;
        const size = Math.min(36, 20 + count * 3);
        const isPrimary = locationIsPrimary[loc];
        const pinColor = isPrimary ? "#c8a87a" : "#8b9dc3";
        const borderColor = isPrimary ? "#2c2416" : "#3a4a7a";

        const icon = L.divIcon({
          className: "",
          html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${pinColor};border:2.5px solid ${borderColor};display:flex;align-items:center;justify-content:center;font-family:'Crimson Text',serif;font-size:${size>26?'0.8rem':'0.7rem'};color:${borderColor};font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.25);cursor:pointer;">${count}</div>`,
          iconSize: [size, size],
          iconAnchor: [size/2, size/2]
        });

        const marker = L.marker([coords.lat, coords.lng], { icon }).addTo(map);
        const popupContent = `
          <h4>${loc}</h4>
          <p>${count} ${count===1?"memory":"memories"}</p>
          <button onclick="window._chronicleSelectLocation('${loc.replace(/'/g,"\\'")}')">View memories →</button>
        `;
        marker.bindPopup(popupContent);
        markers.push(marker);
      }

      setStatus("");
      // Fit map to pins if any found
      if (markers.length > 0) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.2));
      }
      setGeocodeCache({...cache});
    }

    // Expose callback for popup buttons
    window._chronicleSelectLocation = (loc) => {
      onSelectLocation(loc);
    };

    placePins();

    return () => {
      if (mapInstanceRef.current) { mapInstanceRef.current.remove(); mapInstanceRef.current = null; }
      delete window._chronicleSelectLocation;
    };
  }, []); // only run once on mount

  return React.createElement("div", null,
    status && React.createElement("p", {style:{color:"#8a7460",fontStyle:"italic",fontSize:"0.88rem",marginBottom:"10px"}}, `🌍 ${status}`),
    uniqueLocations.length === 0
      ? React.createElement("div", {style:{textAlign:"center",padding:"60px 20px",color:"#8a7460",border:"1px solid #c8b89a",borderRadius:"4px",background:"rgba(255,252,245,0.5)"}},
          React.createElement("div", {style:{fontSize:"2.5rem",marginBottom:"12px",opacity:0.4}}, "🗺"),
          React.createElement("p", {style:{fontFamily:"'Playfair Display',serif",fontStyle:"italic",fontSize:"1.1rem",margin:"0 0 6px"}}, "No locations yet."),
          React.createElement("p", {style:{fontSize:"0.88rem"}}, "Add locations to your memories and they'll appear here.")
        )
      : React.createElement("div",null,
          React.createElement("div", {ref:mapRef, className:"chronicle-map"}),
          React.createElement("div",{style:{display:"flex",gap:"16px",marginTop:"10px",fontSize:"0.8rem",color:"#8a7460"}},
            React.createElement("span",null,
              React.createElement("span",{style:{display:"inline-block",width:"12px",height:"12px",borderRadius:"50%",background:"#c8a87a",border:"2px solid #2c2416",verticalAlign:"middle",marginRight:"5px"}}),
              "Primary location"
            ),
            React.createElement("span",null,
              React.createElement("span",{style:{display:"inline-block",width:"12px",height:"12px",borderRadius:"50%",background:"#8b9dc3",border:"2px solid #3a4a7a",verticalAlign:"middle",marginRight:"5px"}}),
              "Additional location"

            React.createElement("span",{style:{fontStyle:"italic",marginLeft:"auto"}}, "Number = memories at that place")
          )

}

// ── ShareViaLink (internal helper, now primary path) ────────────
function ShareViaLink({memories, senderName, senderEmail, personalMsg, onDone}) {
  const [status, setStatus] = useState("idle"); // idle | loading | done | error
  const [shareUrl, setShareUrl] = useState("");
  const [copied, setCopied] = useState(false);

  useEffect(()=>{ if (status==="idle") generate(); }, []);

  async function generate() {
    setStatus("loading");
    try {
      const payload = {
        sharedBy: senderName.trim(),
        sharedByEmail: senderEmail||'',
        message: personalMsg||'',
        memories
      };
      const res = await fetch(`${WORKER_URL}/share`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      setShareUrl(data.url);
      setStatus("done");
    } catch(e) {
      setStatus("error");
      console.error(e);

  }

// ── Shared Chronicle generator ─────────────────────────────────
function buildShareableHtml(payload) {
  const html = document.documentElement.outerHTML;
  const injection = `<script>window.__CHRONICLE_SHARE__ = ${JSON.stringify(payload)};<\/script>`;
  return html.replace('</head>', injection + '</head>');
}

function downloadAndEmail(recipientName, recipientEmail, memories, senderName, isReply=false, senderEmail='', personalMsg='') {
  const filename = `chronicle-from-${(senderName||"friend").replace(/\s+/g,"-").toLowerCase()}.html`;
  const payload = { version:1, sharedBy:senderName||"a friend", sharedByEmail:senderEmail||'', sharedAt:new Date().toISOString(), memories, message:personalMsg||'' };
  const blob = new Blob([buildShareableHtml(payload)], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);

  const memTitles = memories.map(m=>`  • ${m.title} (${m.year})`).join("\n");
  const subject = encodeURIComponent(isReply ? `Re: A memory shared with you` : `A memory shared with you`);
  const msgLine = personalMsg ? `\n${personalMsg}\n` : "";
  const body = isReply
    ? encodeURIComponent(
`Hi ${recipientName},

I've added my own perspective to the ${memories.length===1?"memory":"memories"} you shared with me.
${msgLine}
${memTitles}

To view: just open the attached file (${filename}) in any web browser — no app needed.

The file is in your Downloads folder — please attach it before sending.`)
    : encodeURIComponent(
`Hi ${recipientName},
${msgLine}
I wanted to share ${memories.length===1?"a memory":"some memories"} with you.

${memTitles}

To view: just open the attached file (${filename}) in any web browser. Chronicle opens automatically and will ask if you'd like to save ${memories.length===1?"it":"them"} — no setup needed.

The file has been downloaded to your Downloads folder — please attach it before sending.`);
  window.open(`mailto:${recipientEmail}?subject=${subject}&body=${body}`);
}

  const dominantAuthor = memory.dominantAuthor || null;
  const otherPerspectives = perspectives.filter(p=>!p.isOwn);

  function setDominant(author) {
    // Swap: put chosen perspective's content into memory.content, demote current dominant back into perspectives
    const chosen = perspectives.find(p=>p.author===author);
    if (!chosen) return;
    onSave({...memory, content: chosen.content, dominantAuthor: author});

    // Revert to no dominant (original content, if any)
    onSave({...memory, dominantAuthor: null});

function App() {
  const winW = useWindowSize();
  const isMobile = winW < 768;
  // ── Password / lock state ─────────────────────────────────────
  const [locked, setLocked]           = useState(isEncrypted);   // true = show lock screen
  const [activePassword, setActivePassword] = useState(null);    // current session password
  const [data, setData]               = useState(()=> isEncrypted() ? EMPTY_DATA : loadData());
  const [pendingShare, setPendingShare] = useState(null);
  const [pendingEndMemory, setPendingEndMemory] = useState(null); // {primary, secondary} awaiting confirmation

  // Detect pre-loaded share payload on startup, or ?share=code from landing page
  useEffect(()=>{
    if (window.__CHRONICLE_SHARE__) {
      setPendingShare(window.__CHRONICLE_SHARE__);
      delete window.__CHRONICLE_SHARE__;
      return;
    }
    const params = new URLSearchParams(window.location.search);
    const code = params.get("share");
    if (code) {
      // Fetch the share payload from the server
      fetch(`${WORKER_URL}/fetch/${code}`, { headers: { "X-Chronicle-Client": "1" } })
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(d => { if (d.memories) setPendingShare(d); })
        .catch(err => console.warn("Could not load share:", err));
      // Clean the URL so refreshing doesn't re-trigger
      window.history.replaceState({}, "", window.location.pathname);
    }
  }, []);
  const customTags = data.customTags || [];
  const knownPeople = data.knownPeople || [];
  const knownOrgs = data.knownOrgs || [];
  const knownLocations = data.knownLocations || [];
  const ownerName = data.ownerName || "";
  const ownerEmail = data.ownerEmail || "";
  const peopleEmails = data.peopleEmails || {};
  const memories = data.memories;

  const [view, setView] = useState("life");
  const [selected, setSelected] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [zoomDecade, setZoomDecade] = useState(null);
  const [zoomYear, setZoomYear] = useState(null);
  const [form, setForm] = useState(newForm());
  const [filter, setFilter] = useState({tag:null,search:""});
  const [showSettings, setShowSettings] = useState(false);
  const [indexTab, setIndexTab] = useState("people");
  const [indexFilter, setIndexFilter] = useState(null); // {type, value}
  const [saveStatus, setSaveStatus] = useState(""); // "", "saved", "error"

  // Import state
  const [importTab, setImportTab] = useState("photos");
  const [photoQueue, setPhotoQueue] = useState([]);
  const [emailForm, setEmailForm] = useState({...newForm(),from:"",rawDate:""});
  const [photoDragOver, setPhotoDragOver] = useState(false);
  const [emailDragOver, setEmailDragOver] = useState(false);
  const [importSaved, setImportSaved] = useState(0);

  const fileInputRef = useRef();
  const photoImportRef = useRef();
  const emlImportRef = useRef();

  // ── Persist ──────────────────────────────────────────────────
  function persist(newData) {
    setData(newData);
    if (activePassword) {
      saveEncrypted(activePassword, newData).then(ok => {
        setSaveStatus(ok?"saved":"error");
        setTimeout(()=>setSaveStatus(""),2000);
      });
    } else {
      const ok = saveData(newData);
      setSaveStatus(ok?"saved":"error");
      setTimeout(()=>setSaveStatus(""),2000);
    }
  }

  function setMemories(mems) { persist({...data, memories: mems}); }
  function addCustomTag(tag) { if(!customTags.includes(tag)) persist({...data, customTags:[...customTags,tag]}); }
  function removeCustomTag(tag) { persist({...data, customTags:customTags.filter(t=>t!==tag)}); }

  function renamePerson(oldName, newName) {
    const n=newName.trim(); if(!n||n===oldName) return;
    const updMems=memories.map(m=>({...m,people:m.people?.map(p=>p===oldName?n:p)||[]}));
    const updKnown=[...new Set([...knownPeople.filter(p=>p!==oldName),n])].sort();
    persist({...data,memories:updMems,knownPeople:updKnown});
  }
  function deletePerson(name) {
    const updMems=memories.map(m=>({...m,people:m.people?.filter(p=>p!==name)||[]}));
    const updKnown=knownPeople.filter(p=>p!==name);
    persist({...data,memories:updMems,knownPeople:updKnown});
  }
  function renameOrg(oldName, newName) {
    const n=newName.trim(); if(!n||n===oldName) return;
    const updMems=memories.map(m=>({...m,orgs:m.orgs?.map(o=>o===oldName?n:o)||[]}));
    const updKnown=[...new Set([...knownOrgs.filter(o=>o!==oldName),n])].sort();
    persist({...data,memories:updMems,knownOrgs:updKnown});
  }
  function deleteOrg(name) {
    const updMems=memories.map(m=>({...m,orgs:m.orgs?.filter(o=>o!==name)||[]}));
    const updKnown=knownOrgs.filter(o=>o!==name);
    persist({...data,memories:updMems,knownOrgs:updKnown});
  }
  function registerPeople(names) { const merged=[...new Set([...knownPeople,...names])].sort(); persist({...data, knownPeople:merged}); }
  function setPersonEmail(name, email) { persist({...data, peopleEmails:{...peopleEmails, [name]: email}}); }
  function registerOrgs(names) { const merged=[...new Set([...knownOrgs,...names])].sort(); persist({...data, knownOrgs:merged}); }
  function registerLocations(names) { const merged=[...new Set([...knownLocations,...names])].sort(); persist({...data, knownLocations:merged}); }

  // ── Memory ops ───────────────────────────────────────────────
  function updateForm(updates) { setForm(f=>({...f,...updates})); }

  function handleSubmit() {
    if (!form.title.trim()) return;
    if(form.people?.length) registerPeople(form.people);
    if(form.orgs?.length) registerOrgs(form.orgs);
    const allFormLocs=[form.location,...(form.locations||[])].filter(Boolean);
    if(allFormLocs.length) registerLocations(allFormLocs);

    const primaryId = editingId || (Date.now().toString()+Math.random().toString(36).slice(2));
    const primary = {...form, id:primaryId};

    // If there's an end date, offer to create a second memory for it
    if ((form.endFuzzy || form.endOngoing) && !editingId) {
      const secondary = {
        ...form,
        id: Date.now().toString()+Math.random().toString(36).slice(2),
        title: form.title,         // user will edit this in the modal
        year:  form.endOngoing ? new Date().getFullYear() : (form.endYear || form.year),
        month: form.endOngoing ? new Date().getMonth()+1 : (form.endMonth || form.month),
        day:   form.endOngoing ? new Date().getDate()    : (form.endDay   || form.day),
        fuzzy: form.endOngoing ? "month" : (form.endFuzzy || form.fuzzy),
        season: form.endSeason || form.season,
        mediaUrls: [],   // don't duplicate photos
        endFuzzy: null, endYear: null, endMonth: 1, endDay: 1, endSeason: "Early", endOngoing: false,
      };
      setPendingEndMemory({primary, secondary});
      return;
    }

    commitMemory(primary, null);
  }

  function commitMemory(primary, secondary) {
    if (editingId) {
      const updated = memories.map(m=>m.id===editingId?primary:m).sort((a,b)=>sortKey(a)-sortKey(b));
      setMemories(updated); setEditingId(null); setSelected(editingId); setForm(newForm()); setView("detail");
    } else {
      const toAdd = secondary ? [primary, secondary] : [primary];
      setMemories([...memories,...toAdd].sort((a,b)=>sortKey(a)-sortKey(b)));
      setForm(newForm()); setView("life");
    }
    setPendingEndMemory(null);
  }

  function handleEdit(m) { setForm({...m}); setEditingId(m.id); setView("edit"); }

  function handleDelete(id) {
    if (!confirm("Delete this memory?")) return;
    // Clean up IDB blobs for this memory
    const mem = memories.find(m=>m.id===id);
    if (mem) (mem.mediaUrls||[]).forEach(med=>{ if(med.mediaId) idbDelete(med.mediaId); });
    setMemories(memories.filter(m=>m.id!==id)); setView("life"); setSelected(null);
  }

  function handleSavePerspectives(updatedMemory) {
    const updated = memories.map(mem => mem.id===updatedMemory.id ? updatedMemory : mem);
    persist({...data, memories:updated});
  }

  function handleMedia(e) {
    Array.from(e.target.files).forEach(async file=>{
      const dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=ev=>res(ev.target.result); r.readAsDataURL(file); });
      const med = await storeMedia(dataUrl, file.name);
      setForm(f=>({...f, mediaUrls:[...f.mediaUrls, med]}));
    });
  }

  // ── Export / Import backup ───────────────────────────────────
  const [shareCodeInput, setShareCodeInput] = useState("");
  const [shareCodeStatus, setShareCodeStatus] = useState("");

  async function importFromCode() {
    const code = shareCodeInput.trim().toLowerCase();
    if (!code) return;
    setShareCodeStatus("Fetching…");
    try {
      const res = await fetch(`${WORKER_URL}/fetch/${code}`, {
        headers: { "X-Chronicle-Client": "1" }
      });
      if (res.status === 404) { setShareCodeStatus("Code not found or expired (links last 30 days)."); return; }
      if (!res.ok) {
        const err = await res.json().catch(()=>({error:`Server error ${res.status}`}));
        setShareCodeStatus("Error: " + (err.error||res.status)); return;
      }
      const d = await res.json();
      if (!d.memories) { setShareCodeStatus("Server returned unexpected data — is the Worker deployed with KV bound?"); return; }
      // Restore any embedded media back into IDB
      const restoredMems = await Promise.all(d.memories.map(async m => {
        const mediaUrls = await Promise.all((m.mediaUrls||[]).map(async med => {
          if (med.url && med.url.startsWith("data:")) {

            const res = await fetch(med.url);
            const blob = await res.blob();
            await idbPut(id, blob);
            return { mediaId: id, name: med.name };
          }
          return med;
        }));
        return {...m, mediaUrls};
      }));
      d = {...d, memories: restoredMems};
      const isShared = !!d.sharedBy;
      const senderName = d.sharedBy || null;
      const senderEmail2 = d.sharedByEmail || '';
      const incomingMems = d.memories.map(m => {
        if (!isShared || !m.content) return m;
        const existingPerspectives = m.perspectives || [];

        const perspectives = alreadyHasSender ? existingPerspectives : [
          ...existingPerspectives,
          { author:senderName, content:m.content, addedAt:d.sharedAt||new Date().toISOString(), isOwn:false }
        ];
        const existingPeople = m.people || [];
        const people = senderName && !existingPeople.includes(senderName) ? [...existingPeople, senderName] : existingPeople;
        return {...m, content:"", perspectives, sharedBy:senderName, sharedByEmail:senderEmail2, sharedAt:d.sharedAt, people};
      });
      const existingIds = new Set(memories.map(m=>m.id));
      const toAdd = incomingMems.filter(m=>!existingIds.has(m.id));
      const merged = memories.map(m=>{
        const incoming = incomingMems.find(im=>im.id===m.id);
        if (!incoming) return m;

        return {...m, perspectives:[...existing,...newP], sharedBy:incoming.sharedBy||m.sharedBy};
      });
      const finalMems = [...merged,...toAdd].sort((a,b)=>sortKey(a)-sortKey(b));
      const backupPeople = d.knownPeople||[...new Set(d.memories.flatMap(m=>m.people||[]))];
      const backupOrgs = d.knownOrgs||[...new Set(d.memories.flatMap(m=>m.orgs||[]))];

  async function exportBackup() {
    // Re-embed media blobs as base64 so the backup is self-contained
    const allMedia = await idbGetAll();
    const memoriesWithMedia = await Promise.all(memories.map(async m => {
      const urls = await Promise.all((m.mediaUrls||[]).map(async med => {
        if (med.mediaId && allMedia[med.mediaId]) {
          const blob = allMedia[med.mediaId];
          const dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=ev=>res(ev.target.result); r.readAsDataURL(blob); });
          return { mediaId: med.mediaId, name: med.name, url: dataUrl };
        }
        return med;
      }));
      return {...m, mediaUrls: urls};
    }));
    const json = JSON.stringify({version:2, exported:new Date().toISOString(), memories:memoriesWithMedia, knownPeople, knownOrgs, knownLocations, customTags, peopleEmails}, null, 2);
    const blob = new Blob([json],{type:"application/json"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`chronicle-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  }

  function importBackup(e) {
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader(); r.onload=async ev=>{ try {
      let d=JSON.parse(ev.target.result);
      if(!d.memories) { alert("Invalid backup file."); return; }
      // Restore any embedded media back into IDB
      const restoredMems = await Promise.all(d.memories.map(async m => {
        const mediaUrls = await Promise.all((m.mediaUrls||[]).map(async med => {
          if (med.url && med.url.startsWith("data:")) {
            // Re-store into IDB (use existing mediaId or generate new)
            const id = med.mediaId || ("media_" + Date.now() + "_" + Math.random().toString(36).slice(2));
            const res = await fetch(med.url);
            const blob = await res.blob();
            await idbPut(id, blob);
            return { mediaId: id, name: med.name };
          }
          return med;
        }));
        return {...m, mediaUrls};
      }));
      d = {...d, memories: restoredMems};
      const isShared = !!d.sharedBy;
      const senderName = d.sharedBy || null;
      const senderEmail = d.sharedByEmail || null;

      // For shared memories
      const incomingMems = d.memories.map(m => {
        if (!isShared || !m.content) return m;
        // Move content into a named perspective, clear it from the main body
        const existingPerspectives = m.perspectives || [];
        const alreadyHasSender = existingPerspectives.some(p=>p.author===senderName);
        const perspectives = alreadyHasSender ? existingPerspectives : [
          ...existingPerspectives,
          { author: senderName, content: m.content, addedAt: d.sharedAt||new Date().toISOString(), isOwn: false }
        ];
        // Add sender to people on this memory
        const existingPeople = m.people || [];
        const people = senderName && !existingPeople.includes(senderName) ? [...existingPeople, senderName] : existingPeople;
        return { ...m, content: "", perspectives, sharedBy: senderName, sharedAt: d.sharedAt, people };
      });

      // Merge: if a memory with same id exists, merge perspectives into it; otherwise add new
      const existingIds = new Set(memories.map(m=>m.id));
      const toAdd = incomingMems.filter(m=>!existingIds.has(m.id));
      const merged = memories.map(m=>{
        const incoming = incomingMems.find(im=>im.id===m.id);
        if (!incoming) return m;
        // Merge perspectives
        const existing = m.perspectives||[];
        const newP = (incoming.perspectives||[]).filter(p=>!existing.some(e=>e.author===p.author));
        return {...m, perspectives:[...existing,...newP], sharedBy:incoming.sharedBy||m.sharedBy};
      });
      const finalMems = [...merged, ...toAdd].sort((a,b)=>sortKey(a)-sortKey(b));

      const backupPeople=d.knownPeople||[...new Set(d.memories.flatMap(m=>m.people||[]))];
      const backupOrgs=d.knownOrgs||[...new Set(d.memories.flatMap(m=>m.orgs||[]))];
      const mergedPeople=[...new Set([...knownPeople,...backupPeople])].sort();
      const mergedOrgs=[...new Set([...knownOrgs,...backupOrgs])].sort();
      const mergedTags=[...new Set([...customTags,...(d.customTags||[])])];
      const backupLocs=d.knownLocations||[...new Set(d.memories.flatMap(m=>[m.location,...(m.locations||[])].filter(Boolean)))];
      const mergedLocs=[...new Set([...knownLocations,...backupLocs])].sort();
      const updatedPeopleEmails = {...(data.peopleEmails||{})};
      if (senderName && senderEmail) updatedPeopleEmails[senderName] = senderEmail;
      persist({...data,memories:finalMems,knownPeople:mergedPeople,knownOrgs:mergedOrgs,customTags:mergedTags,knownLocations:mergedLocs,peopleEmails:updatedPeopleEmails});
      const msg = isShared
        ? `Imported ${d.memories.length} ${d.memories.length===1?"memory":"memories"} shared by ${senderName}. Open ${d.memories.length===1?"it":"them"} to add your own perspective.`
        : `Imported ${d.memories.length} ${d.memories.length===1?"memory":"memories"}.`;
      alert(msg);
    } catch(err) { alert("Import failed: " + err.message); } };
    r.readAsText(file);
  }

  // ── Photo import ─────────────────────────────────────────────
  async function processPhotos(files) {
    const items=[];
    for (const file of files) {
      if (!file.type.startsWith("image/")) continue;
      await new Promise(resolve=>{
        const br=new FileReader(); br.onload=async bev=>{
          const exif = extractExif(bev.target.result);
          const hasDate = exif.year != null;

          const dataUrl = await new Promise(res=>{ const ur=new FileReader(); ur.onload=ev=>res(ev.target.result); ur.readAsDataURL(file); });
          const med = await storeMedia(dataUrl, file.name);
          const nb=file.name.replace(/\.[^.]+$/,"").replace(/[-_]/g," ");
          items.push({
            id: Date.now().toString()+Math.random(),
            med,                                    // {mediaId, name} for IDB
            url: dataUrl,                           // temp preview only, not persisted
            name: file.name,
            exifDate: hasDate ? exif : null,
            year:  hasDate ? exif.year  : new Date().getFullYear(),
            month: hasDate ? exif.month : 1,
            day:   hasDate ? exif.day   : 1,
            fuzzy: hasDate ? "day" : "year",
            season: "Early",
            title: nb.length>2 ? nb : "Photo",
            tags: [], people: [], location: "", keep: true
          });
          resolve();
        }; br.readAsArrayBuffer(file);
      });
    }
    setPhotoQueue(q=>[...q,...items]);
  }

                React.createElement(MediaImg,{med,alt:"",style:{width:"68px",height:"68px",objectFit:"cover",borderRadius:"2px",border:"1px solid #c8b89a"}}),
                React.createElement("button",{onClick:()=>{ const med=form.mediaUrls[i]; if(med.mediaId) idbDelete(med.mediaId); updateForm({mediaUrls:form.mediaUrls.filter((_,j)=>j!==i)}); },style:{position:"absolute",top:"-5px",right:"-5px",background:"#2c2416",color:"#f5f0e8",border:"none",borderRadius:"50%",width:"16px",height:"16px",cursor:"pointer",fontSize:"10px",display:"flex",alignItems:"center",justifyContent:"center"}},"×")
              )),
              React.createElement("button",{onClick:()=>fileInputRef.current?.click(),style:{width:"68px",height:"68px",border:"1px dashed #c8b89a",borderRadius:"2px",background:"transparent",cursor:"pointer",color:"#8a7460",fontSize:"1.3rem"}},"+")
            ),
            React.createElement("input",{ref:fileInputRef,type:"file",accept:"image/*",multiple:true,style:{display:"none"},onChange:handleMedia})
          ),
          React.createElement("div",{style:{display:"flex",gap:"10px",paddingTop:"4px"}},
            React.createElement("button",{onClick:handleSubmit,style:S.btn},view==="edit"?"Save Changes":"Save to Chronicle"),
            React.createElement("button",{onClick:()=>{ setForm(newForm()); setEditingId(null); setView(view==="edit"?"detail":"life"); },style:S.btnOutline},"Cancel")
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
