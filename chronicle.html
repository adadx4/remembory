// ── Shared (intertwined) timeline ─────────────────────────────────────────
// Map a freeform relationship label onto a small set of categories so each
// category can take its own colour on the Shared Timeline. The order matters:
// e.g. "grandfather" must hit the grandparent rule before the parent rule.
function relationshipCategory(rel) {
  if (!rel) return "other";
  const r = String(rel).toLowerCase();
  if (r.includes("in-law") || r.includes("in law")) return "in-law";
  if (/grandfather|grandmother|grandparent|grandpa|grandma|granddad|nan\b|nana|gran\b/.test(r)) return "grandparent";
  if (/grandson|granddaughter|grandchild/.test(r))                                              return "grandchild";
  if (/father|mother|dad\b|mum|mom|papa|mama|parent/.test(r))                                   return "parent";
  if (/brother|sister|sibling/.test(r))                                                         return "sibling";
  if (/husband|wife|spouse|partner/.test(r))                                                    return "spouse";
  if (/son\b|daughter|child/.test(r))                                                           return "child";
  if (/uncle|aunt/.test(r))                                                                     return "aunt-uncle";
  if (/nephew|niece/.test(r))                                                                   return "niece-nephew";
  if (/cousin/.test(r))                                                                         return "cousin";
  return "other";
}

const RELATIONSHIP_COLORS = {
  parent:         "#7a9e8a",
  sibling:        "#8a6a9a",
  spouse:         "#c4858a",
  child:          "#5a8a9a",
  grandparent:    "#9a7a5a",
  grandchild:     "#8a9a5a",
  "aunt-uncle":   "#9a8a6a",
  "niece-nephew": "#6a8a6a",
  cousin:         "#6a7a9a",
  "in-law":       "#b09080",
  other:          "#8a7460",
};
const RELATIONSHIP_CATEGORY_LABEL = {
  parent: "parents", sibling: "siblings", spouse: "spouse", child: "children",
  grandparent: "grandparents", grandchild: "grandchildren",
  "aunt-uncle": "aunts & uncles", "niece-nephew": "nieces & nephews",
  cousin: "cousins", "in-law": "in-laws", other: "other relatives",
};

function SharedTimelineView({ memories, subjectName, dobYear, setSelected, setView }) {
  // Subject's age at a given event year. Returns null if dob unknown or age would be negative.
  const ageAt = (yr) => (dobYear && yr && yr >= dobYear) ? yr - dobYear : null;
  const ownMems = memories.filter(m => !m.gedcomContext);
  const ctxMems = memories.filter(m =>  m.gedcomContext);

  // Build relative list: name → relationship (extracted from title "[Rel]")
  const relMap = {};
  ctxMems.forEach(m => {
    const name = m.people?.[0];
    if (!name || relMap[name] !== undefined) return;
    relMap[name] = m.title.match(/\[([^\]]+)\]/)?.[1] || "";
  });
  const relatives = Object.entries(relMap); // [[name, rel], ...]

  // Each person gets the colour of their relationship CATEGORY (so all parents share
  // the same colour, all cousins share another, etc.). Subject keeps the gold accent.
  const SUBJECT_COLOR = "#c8a84a";
  const personColor = { [subjectName]: SUBJECT_COLOR };
  relatives.forEach(([name, rel]) => {
    personColor[name] = RELATIONSHIP_COLORS[relationshipCategory(rel)] || RELATIONSHIP_COLORS.other;
  });

  const [shown, setShown] = React.useState(() => {
    const s = new Set([subjectName]);
    relatives.forEach(([n]) => s.add(n));
    return s;
  });
  function toggle(name) {
    setShown(s => { const n = new Set(s); n.has(name) ? n.delete(name) : n.add(name); return n; });
  }

  const allEvents = [
    ...ownMems.map(m => ({ ...m, _person: subjectName })),
    ...ctxMems.map(m => ({ ...m, _person: m.people?.[0] || "" })),
  ]
    .filter(m => m._person && shown.has(m._person))
    .sort((a,b) => (a.year||0)-(b.year||0) || (a.month||1)-(b.month||1) || (a.day||1)-(b.day||1));

  const byDec = {};
  allEvents.forEach(m => {
    const dec = Math.floor((m.year||0)/10)*10;
    (byDec[dec] = byDec[dec]||[]).push(m);
  });

  const allPeople = [[subjectName,""], ...relatives];

  // Trim the year out of fuzzyDateLabel(m) so we can show date detail beside the
  // year column without repeating it. "Mar 15, 1985" → "Mar 15", "Spring 1985" → "Spring".
  function shortDate(m) {
    if (!m.fuzzy || m.fuzzy === "year" || m.fuzzy === "decade" || m.fuzzy === "uncertain") return "";
    const full = fuzzyDateLabel(m);
    if (!m.year) return full;
    return full.replace(new RegExp("[, ]?\\b" + m.year + "\\b"), "").replace(/^[\s,·]+|[\s,·]+$/g, "");
  }

  // Compose the displayed event title. For relatives' context events we surface
  // the format the user requested: "John Smith [father] Died" — name, lowercased
  // relation in brackets, capitalised verb. For the subject's own events we show
  // their stored title as-is.
  function displayTitleFor(m) {
    if (!m.gedcomContext || !m._person) return m.title;
    const esc = m._person.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    let stripped = m.title.replace(new RegExp("^" + esc + "\\s*(?:\\[[^\\]]*\\])?\\s*"), "");
    stripped = stripped ? stripped.charAt(0).toUpperCase() + stripped.slice(1) : m.title;
    const rel = (relMap[m._person] || "").toLowerCase();
    return m._person + (rel ? " [" + rel + "]" : "") + " " + stripped;
  }

  return React.createElement("div",{style:{animation:"fadeIn 0.3s ease",paddingBottom:"40px"}},
    React.createElement("h2",{style:{fontFamily:"'Playfair Display',serif",fontSize:"1.6rem",fontStyle:"italic",marginBottom:"4px",color:"#1a1208"}},"Shared Timeline"),
    React.createElement("p",{style:{fontSize:"0.82rem",color:"#8a7460",marginBottom:"16px",lineHeight:1.5}},
      "Memories of "+subjectName+" intertwined with events from close relatives. Colours indicate the type of relationship; toggle people on or off below."
    ),

    // Filter pills (per-person, coloured by relationship category)
    React.createElement("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"20px",alignItems:"center"}},
      React.createElement("span",{style:{fontSize:"0.74rem",color:"#8a7460",fontStyle:"italic",marginRight:"2px"}},"Show:"),
      allPeople.map(([name,rel])=>{
        const active = shown.has(name);
        const color  = personColor[name]||"#8a7460";
        return React.createElement("button",{
          key:name, onClick:()=>toggle(name),
          title: name===subjectName ? "" : (RELATIONSHIP_CATEGORY_LABEL[relationshipCategory(rel)] || ""),
          style:{padding:"3px 10px 3px 8px",borderRadius:"20px",border:"1px solid",cursor:"pointer",
            fontSize:"0.78rem",fontFamily:"'Crimson Text',serif",
            background:active?color+"22":"transparent",
            color:active?"#2c2416":"#8a7460",
            borderColor:active?color:"#d4c4a8",
            display:"flex",alignItems:"center",gap:"5px"}
        },
          React.createElement("span",{style:{width:"8px",height:"8px",borderRadius:"50%",background:active?color:"#c8b89a",display:"inline-block",flexShrink:0}}),
          name===subjectName ? name : name+(rel?" ("+rel.toLowerCase()+")":"")
        );

              ),

                return React.createElement("div",{key:m.id,

                    React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"flex-end",lineHeight:1.1,minWidth:"36px"}},
                      React.createElement("span",{style:{fontSize:"0.75rem",color:"#8a7460",fontFamily:"'Playfair Display',serif",fontWeight:700}},m.year||""),

                    ),

                  ),

                    isOwn

                          style:{background:"none",border:"none",cursor:"pointer",padding:0,textAlign:"left",
                            fontFamily:"'Crimson Text',Georgia,serif",fontSize:"0.92rem",color:"#2c2416",lineHeight:1.4,
                            textDecoration:"underline",textDecorationColor:"#c8b89a",textUnderlineOffset:"2px"}
                        }, title)
                      : React.createElement("span",{style:{fontFamily:"'Crimson Text',Georgia,serif",fontSize:"0.92rem",color:"#3a3028",lineHeight:1.4}},title),
                    (dateExtra || loc) && React.createElement("div",{style:{fontSize:"0.76rem",color:"#8a7460",marginTop:"2px",lineHeight:1.4}},
                      dateExtra,
                      dateExtra && loc ? " · " : "",
                      loc ? "📍 "+loc : ""
                    )

                );

            )
          );
        })
  );
}

// ── Build memories from stored tree data for a given tree person ────────────
// Used by both "Start Chronicle" (promoteToSubject) and "Sync from Tree" button.
function buildMemsFromTree(tp, tpById, treeF) {
  let idx = 0;
  const subBirth = parseInt(tp.dob)||null;
  const subDeath = parseInt(tp.dod)||null;
  const lifetimeUpperBound = subDeath || new Date().getFullYear();
  function inLifetime(yr) {
    if(!yr) return false;
    if(subBirth && yr < subBirth) return false;
    if(yr > lifetimeUpperBound) return false;
    return true;
  }
  function mkMem(title, year, loc, people, extra={}) {
    if (!inLifetime(year)) return null;
    return { id:"tp_mem_"+tp.id+"_"+(idx++), title, year, month:1, day:1,
      fuzzy:"year", season:"Early",
      location:loc||"", locations:loc?[loc]:[],
      tags:[], people:people||[], orgs:[], mediaUrls:[],
      endFuzzy:null, endYear:null, endMonth:1, endDay:1, endSeason:"Early", endOngoing:false,
      perspectives:[], fromGedcom:true, content:"", ...extra };
  }

  const parentsOf={}, childrenOf={}, spousesOf={};
  (treeF||[]).forEach(fam=>{
    const h=fam.husbandId, w=fam.wifeId;
    (fam.childIds||[]).forEach(cid=>{
      if(h){(parentsOf[cid]=parentsOf[cid]||[]).push(h);(childrenOf[h]=childrenOf[h]||[]).push(cid);}
      if(w){(parentsOf[cid]=parentsOf[cid]||[]).push(w);(childrenOf[w]=childrenOf[w]||[]).push(cid);}
    });
    if(h&&w){(spousesOf[h]=spousesOf[h]||[]).push(w);(spousesOf[w]=spousesOf[w]||[]).push(h);}
  });

  // Personal events
  const personalMems = [];
  personalMems.push(mkMem("Born", subBirth, tp.birthPlace, []));
  personalMems.push(mkMem("Died", subDeath, tp.deathPlace, []));
  (treeF||[]).forEach(fam=>{
    if(fam.husbandId!==tp.id && fam.wifeId!==tp.id) return;
    const spouseId = fam.husbandId===tp.id ? fam.wifeId : fam.husbandId;
    const spouse = spouseId ? tpById[spouseId] : null;
    const spouseName = spouse?.name||null;
    if(fam.marriageYear)
      personalMems.push(mkMem(spouseName?"Married "+spouseName:"Married", fam.marriageYear, fam.marriagePlace||"", spouseName?[spouseName]:[]));
    (fam.childIds||[]).forEach(cid=>{
      const ch=tpById[cid]; if(!ch) return;
      personalMems.push(mkMem("Birth of "+ch.name, parseInt(ch.dob)||null, ch.birthPlace||"", [ch.name]));
      if(ch.dod) personalMems.push(mkMem("Death of "+ch.name, parseInt(ch.dod)||null, ch.deathPlace||"", [ch.name]));
    });
  });

  // Relatives
  const subParents       = parentsOf[tp.id]||[];
  const subGrandpars     = subParents.flatMap(p=>parentsOf[p]||[]);
  const subGreatGrands   = subGrandpars.flatMap(p=>parentsOf[p]||[]);
  const subChildren      = childrenOf[tp.id]||[];
  const subSiblings      = subParents.flatMap(p=>childrenOf[p]||[]).filter(id=>id!==tp.id);
  const subSpouses       = spousesOf[tp.id]||[];
  const subAuntsUncles   = subGrandpars.flatMap(g=>childrenOf[g]||[]).filter(id=>!subParents.includes(id)&&id!==tp.id);
  const subNiecesNephews = subSiblings.flatMap(s=>childrenOf[s]||[]);
  const subCousins       = subAuntsUncles.flatMap(au=>childrenOf[au]||[]);

  function relLabel(id) {
    if(subSpouses.includes(id))       return "Spouse";
    if(subParents.includes(id))       return "Parent";
    if(subChildren.includes(id))      return "Child";
    if(subSiblings.includes(id))      return "Sibling";
    if(subGrandpars.includes(id))     return "Grandparent";
    if(subAuntsUncles.includes(id))   return "Aunt/Uncle";
    if(subNiecesNephews.includes(id)) return "Niece/Nephew";
    if(subCousins.includes(id))       return "Cousin";
    if(subGreatGrands.includes(id))   return "Great-grandparent";
    return "";
  }

  const relativeIds = [...new Set([
    ...subSpouses, ...subParents, ...subChildren, ...subSiblings,
    ...subGrandpars, ...subAuntsUncles, ...subNiecesNephews, ...subCousins, ...subGreatGrands,
  ])].filter(id=>id!==tp.id);

  const contextMems = [];
  const rels = {};
  const ctxSeen = new Set();

  // Only bring in events where the relative is the *primary* — birth, death,
  // and marriage. Don't add "Birth of {child}" from the parent's perspective:
  // the child's own Born event (added when we iterate them as a relative) covers it.
  // Marriages are deduped by family id so they appear once even if both spouses
  // are relatives.
  relativeIds.forEach(relId=>{
    const rel = tpById[relId]; if(!rel) return;
    const rl = relLabel(relId);
    if(rl) rels[rel.name]=rl;
    const rlTag = rl?" ["+rl+"]":"";
    function addCtx(title, year, loc, people, dedupKey) {
      if(!inLifetime(year)) return;
      const key = dedupKey || (title+"|"+year+"|"+rel.name);
      if(ctxSeen.has(key)) return;
      ctxSeen.add(key);
      const verb = title.charAt(0).toLowerCase()+title.slice(1);
      const m = mkMem(rel.name+rlTag+" "+verb, year, loc, [rel.name,...(people||[])],
        {gedcomContext:true, visibility:"private"});
      if(m) contextMems.push(m);
    }
    addCtx("Born", parseInt(rel.dob)||null, rel.birthPlace||"", []);
    addCtx("Died", parseInt(rel.dod)||null, rel.deathPlace||"", []);
    (treeF||[]).forEach(fam=>{
      if(fam.husbandId!==relId && fam.wifeId!==relId) return;
      if(!fam.marriageYear) return;
      const spId = fam.husbandId===relId ? fam.wifeId : fam.husbandId;
      const sp = spId ? tpById[spId] : null;
      // Dedup by family id so a marriage between two relatives shows once,
      // not once per spouse.
      addCtx(
        sp?"Married "+sp.name:"Married",
        fam.marriageYear, fam.marriagePlace||"",
        sp?[sp.name]:[],
        "marriage|"+(fam.id||relId+"|"+(spId||""))
      );
    });
  });

  contextMems.sort((a,b)=>(a.year||0)-(b.year||0));
  const allMems = [...personalMems.filter(Boolean), ...contextMems].sort((a,b)=>(a.year||0)-(b.year||0));
  return { allMems, rels };
}

function FamilyTreeView({subjects, activeSubjectId, subjectLinks, persistTop, onSwitch,
  treePersons, treeFamilies, gedFocalPersonId, isHistoryMode, persistSubject, setView}) {
  const [tpSearch, setTpSearch] = React.useState("");
  const [focalId, setFocalId] = React.useState(()=>gedFocalPersonId||treePersons[0]?.id||null);
  const [depthUp, setDepthUp] = React.useState(3);
  const [depthDown, setDepthDown] = React.useState(2);
  const [personDetail, setPersonDetail] = React.useState(null); // tpId for detail panel
  const [treePan, setTreePan] = React.useState({x:0,y:0});
  const [treeZoom, setTreeZoom] = React.useState(1);
  const treeContainerRef = React.useRef(null);
  const treeDragging = React.useRef(null);

  // Reset pan/zoom when focal changes
  React.useEffect(()=>{ setTreePan({x:0,y:0}); setTreeZoom(1); },[focalId]);
  // Non-passive wheel listener for zoom
  React.useEffect(()=>{
    const el=treeContainerRef.current; if(!el) return;
    const onWh=e=>{ e.preventDefault(); setTreeZoom(z=>Math.max(0.25,Math.min(3,e.deltaY<0?z*1.1:z*0.9))); };
    el.addEventListener("wheel",onWh,{passive:false});
    return ()=>el.removeEventListener("wheel",onWh);
  });

  // Keep focalId in sync when gedFocalPersonId changes (e.g. after fresh import)
  React.useEffect(()=>{ if(gedFocalPersonId) setFocalId(gedFocalPersonId); },[gedFocalPersonId]);

  // ── FULL TREE MODE (treePersons populated) ──────────────────────────────
  const hasTree = treePersons && treePersons.length > 0;

  if (hasTree) {
    const tpById = Object.fromEntries(treePersons.map(p=>[p.id,p]));
    // Build parent/child/spouse maps from treeFamilies
    const parentsOf = {}; // childId → [parentId...]
    const childrenOf = {}; // parentId → [childId...]
    const spousesOf = {}; // personId → [spouseId...]
    const famForSpouses = {}; // "id1|id2" → famId
    (treeFamilies||[]).forEach(fam=>{
      const {husbandId:h, wifeId:w, childIds:cs=[]} = fam;
      cs.forEach(cid=>{
        (parentsOf[cid]=parentsOf[cid]||[]);
        if(h && !parentsOf[cid].includes(h)) parentsOf[cid].push(h);
        if(w && !parentsOf[cid].includes(w)) parentsOf[cid].push(w);
        (childrenOf[h||w||""]= childrenOf[h||w||""]||[]);
        if(h){(childrenOf[h]=childrenOf[h]||[]);if(!childrenOf[h].includes(cid))childrenOf[h].push(cid);}
        if(w){(childrenOf[w]=childrenOf[w]||[]);if(!childrenOf[w].includes(cid))childrenOf[w].push(cid);}
      });
      if(h&&w){
        (spousesOf[h]=spousesOf[h]||[]);if(!spousesOf[h].includes(w))spousesOf[h].push(w);
        (spousesOf[w]=spousesOf[w]||[]);if(!spousesOf[w].includes(h))spousesOf[w].push(h);
        const k=[h,w].sort().join("|");
        famForSpouses[k]=fam;
      }
    });

    // Collect visible nodes from focalId outward
    function collectAncestors(id, depth, seen=new Set()) {
      if (!id||depth<0||seen.has(id)) return [];
      seen.add(id); let out=[id];
      (parentsOf[id]||[]).forEach(pid=>{ out=[...out,...collectAncestors(pid,depth-1,seen)]; });
      return out;
    }
    function collectDescendants(id, depth, seen=new Set()) {
      if (!id||depth<0||seen.has(id)) return [];
      seen.add(id); let out=[id];
      (childrenOf[id]||[]).forEach(cid=>{ out=[...out,...collectDescendants(cid,depth-1,seen)]; });
      return out;
    }

    const focal = focalId && tpById[focalId] ? focalId : treePersons[0]?.id;
    const ancestorIds = new Set(collectAncestors(focal, depthUp));
    const descendantIds = new Set(collectDescendants(focal, depthDown));
    // Also include spouses of all visible
    const visibleIds = new Set([...ancestorIds, ...descendantIds]);
    const withSpouses = new Set(visibleIds);
    // Add ALL spouses of visible people, not only those already in visibleIds
    visibleIds.forEach(id=>{ (spousesOf[id]||[]).forEach(sid=>{ withSpouses.add(sid); }); });

    // Assign generations (0 = focal, negative = ancestors, positive = descendants)
    const genOf = {};
    function assignGen(id, g, seen=new Set()) {
      if(!id||seen.has(id)) return; seen.add(id); genOf[id]=g;
      (parentsOf[id]||[]).filter(pid=>withSpouses.has(pid)&&genOf[pid]===undefined).forEach(pid=>assignGen(pid,g-1,seen));
      (childrenOf[id]||[]).filter(cid=>withSpouses.has(cid)&&genOf[cid]===undefined).forEach(cid=>assignGen(cid,g+1,seen));
    }
    assignGen(focal, 0);
    // Assign spouses same generation
    withSpouses.forEach(id=>{ if(genOf[id]===undefined) { (spousesOf[id]||[]).forEach(sid=>{ if(genOf[sid]!==undefined) genOf[id]=genOf[sid]; }); } });
    withSpouses.forEach(id=>{ if(genOf[id]===undefined) genOf[id]=0; });

    const minG = Math.min(...[...withSpouses].map(id=>genOf[id]||0));
    const maxG = Math.max(...[...withSpouses].map(id=>genOf[id]||0));
    const byGen = {};
    for(let g=minG;g<=maxG;g++) byGen[g]=[];
    withSpouses.forEach(id=>{
      const g=genOf[id]||0;
      if(!byGen[g]) byGen[g]=[];
      byGen[g].push(id);
    });
    // Sort each row: birth year first, then pull spouses adjacent
    Object.values(byGen).forEach(arr=>{
      arr.sort((a,b)=>{
        const pa=tpById[a],pb=tpById[b];
        return (parseInt(pa?.dob)||9999)-(parseInt(pb?.dob)||9999)||(pa?.name||"").localeCompare(pb?.name||"");
      });
      const inRow=new Set(arr); const done=new Set(); const ordered=[];
      for(const id of arr){
        if(done.has(id)) continue;
        done.add(id); ordered.push(id);
        (spousesOf[id]||[]).filter(sid=>inRow.has(sid)&&!done.has(sid)).forEach(sid=>{done.add(sid);ordered.push(sid);});
      }
      arr.length=0; ordered.forEach(id=>arr.push(id));
    });

    const NW=130,NH=80,HG=20,VG=60;
    const maxRow = Math.max(1,...Object.values(byGen).map(a=>a.length));
    const cvW = Math.max(500, maxRow*(NW+HG)-HG+60);
    const cvH = (maxG-minG+1)*(NH+VG)-VG+60;
    const pos={};
    Object.entries(byGen).forEach(([g,arr])=>{
      const rowW=arr.length*(NW+HG)-HG;
      const sx=(cvW-rowW)/2;
      arr.forEach((id,i)=>{ pos[id]={x:sx+i*(NW+HG),y:30+(parseInt(g)-minG)*(NH+VG)}; });
    });

    // Edges
    const edges=[];
    (treeFamilies||[]).forEach(fam=>{
      const {husbandId:h, wifeId:w, childIds:cs=[]} = fam;
      // Spouse line
      if(h&&w&&pos[h]&&pos[w]) edges.push({type:"spouse",x1:pos[h].x+NW,y1:pos[h].y+NH/2,x2:pos[w].x,y2:pos[w].y+NH/2});
      // Parent-child lines: from midpoint between parents to each child
      const parents=[h,w].filter(p=>p&&pos[p]);
      const midX = parents.length===2 ? (pos[h].x+NW+pos[w].x)/2 : parents.length===1 ? pos[parents[0]].x+NW/2 : null;
      const midY = parents.length ? pos[parents[0]].y+NH : null;
      cs.filter(cid=>pos[cid]&&midX!==null).forEach(cid=>{
        edges.push({type:"parent",x1:midX,y1:midY,x2:pos[cid].x+NW/2,y2:pos[cid].y});
      });
    });

    const detailPerson = personDetail && tpById[personDetail];
    const linkedSubject = detailPerson?.subjectId ? subjects.find(s=>s.id===detailPerson.subjectId) : null;

    function promoteToSubject(tp) {
      const newId = "subj_tp_"+Date.now();
      const tpById = Object.fromEntries(treePersons.map(p=>[p.id,p]));
      const { allMems, rels } = buildMemsFromTree(tp, tpById, treeFamilies);
      const allKnownPeople = [...new Set(allMems.flatMap(m=>m.people||[]))].sort();
      const allKnownLocs   = [...new Set(allMems.map(m=>m.location).filter(Boolean))].sort();

      const newSubj = {
        id:newId, name:tp.name, isSelf:false, mode:"history",
        dob:tp.dob||"", notes:tp.notes||"",
        memories:allMems, candidates:[], candidatePersons:[],
        knownPeople:allKnownPeople, knownOrgs:[], knownLocations:allKnownLocs,
        knownSources:[], peopleEmails:{}, peopleRelationships:rels,
        peopleNotes:{}, orgNotes:{}, orgLocations:{}, orgPeriods:{}, entityPhotos:{},
        locationNotes:{}, locationCoords:{}, personOrgs:{}, personLocations:{},
        personGroups:{}, customTags:[], shareHistory:[], lastBackup:null, lastImport:null,
        backupPassword:"", legacyMessage:"", treePersons:[], treeFamilies:[],
      };

      // Mark the tree person as linked — must write to whichever subject owns the tree,
      // not necessarily the active subject, so update via persistTop directly.
      const updatedPersons = treePersons.map(p=>p.id===tp.id?{...p,subjectId:newId}:p);
      const treeHostSubj = subjects.find(s=>(s.treePersons||[]).length>0);
      const updatedSubjects = subjects.map(s=>
        s.id===treeHostSubj?.id ? {...s,treePersons:updatedPersons} : s
      );
      persistTop({subjects:[...updatedSubjects,newSubj], activeSubjectId:newId});
      setPersonDetail(null);
      setView("life");
    }

    // Filter for search
    const filtered = tpSearch.trim()
      ? treePersons.filter(p=>p.name.toLowerCase().includes(tpSearch.toLowerCase()))
      : null;

    return React.createElement("div",{style:{animation:"fadeIn 0.3s ease"}},
      // Header
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"16px",flexWrap:"wrap"}},
        React.createElement("h2",{style:{fontFamily:"'Playfair Display',serif",fontSize:"1.8rem",fontStyle:"italic",margin:0,color:"#1a1208"}},"Family Tree"),
        React.createElement("span",{style:{fontSize:"0.82rem",color:"#8a7460",fontStyle:"italic"}},treePersons.length+" people"),
        React.createElement("div",{style:{marginLeft:"auto",display:"flex",gap:"6px",alignItems:"center",flexWrap:"wrap"}},
          React.createElement("input",{value:tpSearch,onChange:e=>setTpSearch(e.target.value),placeholder:"Find person…",style:{...S.input,padding:"5px 10px",fontSize:"0.84rem",width:"160px"}}),
          React.createElement("span",{style:{fontSize:"0.8rem",color:"#8a7460"}},"\u2191"),
          [1,2,3,4].map(n=>React.createElement("button",{key:"u"+n,onClick:()=>setDepthUp(n),style:{padding:"3px 8px",border:"1px solid #c8b89a",borderRadius:"2px",background:depthUp===n?"#2c2416":"transparent",color:depthUp===n?"#f5f0e8":"#8a7460",cursor:"pointer",fontFamily:"'Crimson Text',serif",fontSize:"0.78rem"}},n)),
          React.createElement("span",{style:{fontSize:"0.8rem",color:"#8a7460"}},"gen \u2193"),
          [1,2,3].map(n=>React.createElement("button",{key:"d"+n,onClick:()=>setDepthDown(n),style:{padding:"3px 8px",border:"1px solid #c8b89a",borderRadius:"2px",background:depthDown===n?"#2c2416":"transparent",color:depthDown===n?"#f5f0e8":"#8a7460",cursor:"pointer",fontFamily:"'Crimson Text',serif",fontSize:"0.78rem"}},n))
        )
      ),

      // Search results
      filtered&&React.createElement("div",{style:{marginBottom:"16px",border:"1px solid #d4c4a8",borderRadius:"4px",maxHeight:"220px",overflowY:"auto"}},
        filtered.length===0
          ? React.createElement("p",{style:{padding:"12px 14px",color:"#8a7460",fontStyle:"italic",margin:0}},"No matches.")
          : filtered.map(p=>React.createElement("div",{key:p.id,onClick:()=>{setFocalId(p.id);setTpSearch("");persistSubject({gedFocalPersonId:p.id});},style:{padding:"9px 14px",cursor:"pointer",borderBottom:"1px solid #ede0cc",display:"flex",justifyContent:"space-between",alignItems:"center"},
              onMouseEnter:e=>e.currentTarget.style.background="rgba(200,184,154,0.12)",
              onMouseLeave:e=>e.currentTarget.style.background="transparent"
            },
            React.createElement("span",{style:{fontFamily:"'Crimson Text',serif",fontSize:"0.95rem",color:"#1a1208"}},p.name),
            React.createElement("span",{style:{fontSize:"0.78rem",color:"#8a7460"}},[p.dob,p.dod].filter(Boolean).join("–")||""),
            p.subjectId&&React.createElement("span",{style:{fontSize:"0.78rem",padding:"1px 6px",borderRadius:"20px",background:"rgba(196,169,98,0.2)",color:"#7a5a20",border:"1px solid rgba(196,169,98,0.4)",marginLeft:"6px"}},"Chronicle")
          ))
      ),

      // Person detail panel
      detailPerson&&React.createElement("div",{style:{background:"rgba(255,252,245,0.97)",border:"1px solid #a8885a",borderRadius:"4px",padding:"14px 16px",marginBottom:"16px"}},
        React.createElement("div",{style:{display:"flex",alignItems:"flex-start",gap:"10px"}},
          React.createElement("div",{style:{flex:1}},
            React.createElement("h3",{style:{fontFamily:"'Playfair Display',serif",fontSize:"1.1rem",margin:"0 0 4px",color:"#1a1208"}},detailPerson.name),
            React.createElement("p",{style:{margin:"0 0 4px",fontSize:"0.82rem",color:"#8a7460"}},
              [detailPerson.dob&&"b. "+detailPerson.dob, detailPerson.dod&&"d. "+detailPerson.dod].filter(Boolean).join("  ·  ")||"Dates unknown"

  // Resolve form's location state into the saved memory's location label
  // and a knownLocations list updated with any newly-picked structured data.
  // - form.location holds the picked place (canonical name); form.locationLabel
  //   is the optional display override; form._locationData is Nominatim metadata
  //   captured the moment the user picked a remote place.
  // - The display override wins for what shows in the memory; the structured
  //   address + coords are always attached to the knownLocations record under
  //   that displayed name, so the map and grouping work without a second lookup.
  function resolveLocationFromForm(f) {
    const fStreet = (f.locationStreet||"").trim();
    const fTown   = (f.locationTown||"").trim();
    const fState  = (f.locationState||"").trim();
    const fCountry= (f.locationCountry||"").trim();
    const displayName = (f.locationLabel||"").trim();
    const pickedName  = (f.location||"").trim();
    const derivedName = [fStreet, fTown, fState, fCountry].filter(Boolean).join(", ");
    const locationLabel = displayName || pickedName || derivedName;
    const locData = f._locationData || null;

    let updatedKnownLocs = knownLocations;
    if (locationLabel) {
      const existingIdx = knownLocations.findIndex(l => (typeof l==='string'?l:l.label) === locationLabel);
      if (existingIdx >= 0) {
        updatedKnownLocs = knownLocations.map((l, i) => {
          if (i !== existingIdx) return l;
          const base = typeof l === 'string' ? {label:l, street:"", town:"", state:"", country:""} : l;
          return {
            ...base,
            label: locationLabel,
            ...(fStreet  ? {street:  fStreet}  : {}),
            ...(fTown    ? {town:    fTown}    : {}),
            ...(fState   ? {state:   fState}   : {}),
            ...(fCountry ? {country: fCountry} : {}),
            // Honour fresh picker data — but never clobber a manually-set coord.
            ...(locData?.coords && !(base.coords?.manual) ? {coords: locData.coords} : {}),
            ...(locData?.placeId ? {placeId: locData.placeId} : {}),
            ...(locData?.osmId ? {osmId: locData.osmId, osmType: locData.osmType} : {}),
            ...(locData?.formalAddress ? {formalAddress: locData.formalAddress} : {}),
          };
        });
      } else {
        const locObj = {
          label: locationLabel, street: fStreet, town: fTown, state: fState, country: fCountry,
          ...(locData?.coords ? {coords: locData.coords} : {}),
          ...(locData?.placeId ? {placeId: locData.placeId} : {}),
          ...(locData?.osmId ? {osmId: locData.osmId, osmType: locData.osmType} : {}),
          ...(locData?.formalAddress ? {formalAddress: locData.formalAddress} : {}),
        };
        updatedKnownLocs = [...knownLocations, locObj].sort((a,b) => (typeof a==='string'?a:a.label).localeCompare(typeof b==='string'?b:b.label));
      }
    }
    // Strip the transient picker payload from the saved memory.
    const {_locationData, ...fClean} = f;
    const formWithLoc = {...fClean, location: locationLabel, locationLabel};
    return { locationLabel, formWithLoc, updatedKnownLocs };
  }

  function handleSubmit() {

  function commitMemory(primary, secondary, updatedKnownLocs) {
    // All location/people/org state is merged here in one persistSubject call to avoid
    // stale-closure stomping when multiple state updates would otherwise race each other.
    const allFormLocs = [primary.location,...(primary.locations||[])].filter(Boolean);
    const newPeople = [...new Set([...knownPeople, ...(primary.people||[]), ...(secondary?.people||[])])].sort();
    const newOrgs   = [...new Set([...knownOrgs,   ...(primary.orgs||[]),   ...(secondary?.orgs||[])])].sort();
    // Merge any form locations not yet in the list, preserving existing location objects
    const baseLocs = updatedKnownLocs || knownLocations;
    const existingLabels = new Set(baseLocs.map(l => typeof l==='string' ? l : l.label));
    const newLocs = [
      ...baseLocs,
      ...allFormLocs
        .filter(label => !existingLabels.has(label))
        .map(label => ({label, street:"", town:"", state:"", country:""}))
    ].sort((a,b) => (typeof a==='string'?a:a.label).localeCompare(typeof b==='string'?b:b.label));

    if (editingId) {
      // Preserve addedBy, allow contributor name correction via edit form
      const {addedByName, ...primaryClean} = primary;
      const orig = memories.find(m=>m.id===editingId);
      const editedPrimary = orig?.addedBy
        ? {...primaryClean, addedBy:{...orig.addedBy, ...(addedByName!==undefined&&{name:addedByName})}}
        : primaryClean;
      const updated = memories.map(m=>m.id===editingId?editedPrimary:m).sort((a,b)=>sortKey(a)-sortKey(b));
      persistSubject({memories:updated, knownPeople:newPeople, knownOrgs:newOrgs, knownLocations:newLocs});

    } else {

        primary = {...primary, addedBy:attrib};
        if (secondary) secondary = {...secondary, addedBy:attrib};
        if (!isHistoryMode) {
          primary = {...primary, recalledBy:form.recalledBy||"self"};
          if (secondary) secondary = {...secondary, recalledBy:form.recalledBy||"self"};
        }

      const toAdd = secondary ? [primary, secondary] : [primary];
      const updated = [...memories,...toAdd].sort((a,b)=>sortKey(a)-sortKey(b));
      persistSubject({memories:updated, knownPeople:newPeople, knownOrgs:newOrgs, knownLocations:newLocs});
      setForm(newForm()); clearDraft();
      setView("life");
    }
    setPendingEndMemory(null);
  }

  // ── Candidate ops ────────────────────────────────────────────
  function saveCandidate(primary, updatedKnownLocs) {
    const newPeople = [...new Set([...knownPeople,...(primary.people||[])])].sort();

    const baseLocs  = updatedKnownLocs || knownLocations;

    const allFormLocs = [primary.location,...(primary.locations||[])].filter(Boolean);

  function mergeCandidatePerson(cp, intoPersonName) {
    // intoPersonName: null/empty = merge into subject; otherwise a known person name to attach as an event participant
    const tagged = memories.filter(m=>m.candidatePersonId===cp.id);
    const others = memories.filter(m=>m.candidatePersonId!==cp.id);
    const updatedTagged = tagged.map(m=>{
      const {candidatePersonId:_id, candidateConfidence:_cc, researchNote:_rn, ...rest} = m;
      if (intoPersonName) {

      const choice = window.confirm(`Discard candidate "${cp.name}"?\n\n${tagged.length} event${tagged.length===1?"":"s"} ${tagged.length===1?"is":"are"} tagged with this candidate.\n\nOK = discard candidate, keep events (untagged)\nCancel = let me decide differently`);
      if (!choice) {
        const alsoDelete = window.confirm(`Delete the ${tagged.length} tagged event${tagged.length===1?"":"s"} as well?\n\nOK = delete candidate AND its events\nCancel = abort, change nothing`);
        if (!alsoDelete) return;
        deleteEvents = true;
      }
    } else {
      if (!window.confirm(`Discard candidate "${cp.name}"?`)) return;
    }
    const updatedMems = deleteEvents
      ? memories.filter(m=>m.candidatePersonId!==cp.id)
      : memories.map(m=>{
          if (m.candidatePersonId !== cp.id) return m;
          const {candidatePersonId:_id, ...rest} = m;
          return rest;
        });
    persistSubject({
      memories: updatedMems,
      candidatePersons: candidatePersons.filter(c=>c.id!==cp.id),
    });
  }

  function addCandidatePerson(name, notes) {
    const trimmed = (name||"").trim();
    if (!trimmed) return {error:"Name is required."};
    const norm = trimmed.toLowerCase();
    if (subject?.name && norm === subject.name.trim().toLowerCase()) return {error:`"${subject.name}" is the subject's name. Use a disambiguator.`};
    if (candidatePersons.some(c=>(c.name||"").trim().toLowerCase()===norm)) return {error:"Another candidate already has this name."};
    if (knownPeople.some(p=>p.trim().toLowerCase()===norm)) return {error:`"${trimmed}" matches a known person. Use a disambiguator if this is a different individual.`};
    const cp = {id:"cp_"+Date.now()+Math.random().toString(36).slice(2,6), name:trimmed, notes:(notes||"").trim()};
    persistSubject({candidatePersons:[...candidatePersons, cp]});
    return {id:cp.id};
  }

  function handleEditCandidate(c) {
    let editForm = {...c, locationLabel:"", locationStreet:"", locationTown:"", locationState:"", locationCountry:"", locationPrivacy:c.locationPrivacy||"town", _locationData:null};
    if (c.location) {
      const known = findKnownLocation(knownLocations, c.location);
      if (known && typeof known === 'object') {
        editForm.locationStreet=known.street||""; editForm.locationTown=known.town||""; editForm.locationState=known.state||""; editForm.locationCountry=known.country||"";
        if (known.coords || known.placeId) {
          editForm._locationData = { coords: known.coords||null, placeId: known.placeId||null, osmId: known.osmId||null, osmType: known.osmType||null, formalAddress: known.formalAddress||null };
        }
      }
    }
    setForm({...newForm(),...editForm});
    setEditingId(c.id); setEditingCandidateId(c.id);
    setView("edit");

  function handleSaveCandidateSubmit() {
    if (!form.title.trim()) return;
    const { formWithLoc, updatedKnownLocs } = resolveLocationFromForm(form);
    const primaryId = editingCandidateId || (Date.now().toString()+Math.random().toString(36).slice(2));
    const primary = {...formWithLoc, id:primaryId};

  function handleAcceptFromForm() {
    if (!form.title.trim() || !editingCandidateId) return;
    const { formWithLoc, updatedKnownLocs } = resolveLocationFromForm(form);
    const {researchNote:_rn, candidateConfidence:_cc, ...memData} = {...formWithLoc, id:editingCandidateId};
    const newPeople = [...new Set([...knownPeople,...(memData.people||[])])].sort();
    const newOrgs   = [...new Set([...knownOrgs,...(memData.orgs||[])])].sort();
    const updated = [...memories, memData].sort((a,b)=>sortKey(a)-sortKey(b));
    persistSubject({memories:updated, candidates:candidates.filter(c=>c.id!==editingCandidateId), knownPeople:newPeople, knownOrgs:newOrgs, knownLocations:updatedKnownLocs});
    setEditingCandidateId(null); setEditingId(null); setForm(newForm()); clearDraft();
    setSelected(editingCandidateId); setView("detail");
  }

function handleEdit(m) {
    // Pre-fill structured address fields from the matching knownLocation so the
    // user can edit them and the picker chip renders the saved place. The
    // Display name field starts empty — old memories stored locationLabel === location
    // redundantly, but treating that as a real override would make the field
    // look pre-filled when the user hasn't actually set one.
    let editForm = {...m, locationLabel: "", locationStreet: "", locationTown: "", locationState: "", locationCountry: "", locationPrivacy: m.locationPrivacy || "town", addedByName: m.addedBy?.name ?? "", _locationData: null};
    if (m.location) {
      const known = findKnownLocation(knownLocations, m.location);
      if (known && typeof known === 'object') {
        editForm.locationStreet = known.street || "";
        editForm.locationTown = known.town || "";
        editForm.locationState = known.state || "";
        editForm.locationCountry = known.country || "";
        // Carry coords/place metadata so renaming via Display name preserves the geocode.
        if (known.coords || known.placeId) {
          editForm._locationData = {
            coords: known.coords || null,
            placeId: known.placeId || null,
            osmId: known.osmId || null,
            osmType: known.osmType || null,
            formalAddress: known.formalAddress || null,
          };
        }
      }
    }
    setForm(editForm); setEditingId(m.id); setView("edit");
  }

  function handleDelete(id) {
    if (!confirm("Delete this memory?")) return;
    // Clean up IDB blobs for this memory
    const mem = memories.find(m=>m.id===id);
    if (mem) (mem.mediaUrls||[]).forEach(med=>{ if(med.mediaId) idbDelete(med.mediaId); });
    setMemories(memories.filter(m=>m.id!==id)); setView("life"); setSelected(null);
  }

  function handleSavePerspectives(updatedMemory) {
    const updated = memories.map(mem => mem.id===updatedMemory.id ? updatedMemory : mem);

  const [shareCodeInput, setShareCodeInput] = useState("");
  const [shareCodeStatus, setShareCodeStatus] = useState("");
