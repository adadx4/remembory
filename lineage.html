// ── Licence key validation ─────────────────────────────────────
// Keys are issued by Remembory (Stripe or PayPal subscription, or manual).
// Validated against the social worker. Cached in localStorage for offline use.
const LS_CACHE_KEY = "chronicle-licence-cache";

function loadLicenceCache() {
  try { return JSON.parse(localStorage.getItem(LS_CACHE_KEY)||"null"); } catch(e) { return null; }
}
function saveLicenceCache(data) {
  try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(data)); } catch(e) {}
}
function clearLicenceCache() {
  try { localStorage.removeItem(LS_CACHE_KEY); } catch(e) {}
}

async function validateLicenceKey(key) {
  if (!key) return null;
  const clean = key.trim();
  if (!clean) return null;
  const cached = loadLicenceCache();
  // If we have a valid cached result for this key, use it immediately —
  // then recheck in the background so the cache stays fresh for next time.
  if (cached && cached.key === clean && cached.status === "active") {
    // Background refresh — don't await, never blocks the user
    fetch(WORKER_URL + "/license/check", {method:"POST",headers:{"Content-Type":"application/json","X-LS-Key":clean},body:JSON.stringify({key:clean})})
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d) saveLicenceCache({key: clean, checked: Date.now(), status: d.status, tier: d.tier||"premium", renewedAt: d.renewedAt}); })
      .catch(() => {});
    return {valid: true, tier: cached.tier||"premium", status: cached.status, renewedAt: cached.renewedAt};
  }
  // No valid cache — must go online to activate
  try {
    const r = await fetch(WORKER_URL + "/license/check", {method:"POST",headers:{"Content-Type":"application/json","X-LS-Key":clean},body:JSON.stringify({key:clean})});
    if (!r.ok) throw new Error("server");
    const d = await r.json();
    saveLicenceCache({key: clean, checked: Date.now(), status: d.status, tier: d.tier||"premium", renewedAt: d.renewedAt});
    if (d.valid) return {valid: true, tier: d.tier||"premium", status: d.status, renewedAt: d.renewedAt};
    return {valid: false, reason: d.status === "cancelled" || d.status === "suspended" ? "expired" : "invalid"};
  } catch(e) {
    return {valid: false, reason: "unavailable"};
  }
}

// ── Helpers ────────────────────────────────────────────────────
// Scroll a DOM anchor into view, settling against content-visibility:auto.
// Each off-screen block uses an estimated height, so the first scroll
// targets a position that shifts as real layouts resolve. Re-aim across
// a few frames until the target's top stabilises, then finish with a
// short smooth scroll.
function scrollAnchorIntoView(id) {
  const el = document.getElementById(id);
  if (!el) return;
  let attempts = 0;
  let lastTop = NaN;
  function settle() {
    const top = el.getBoundingClientRect().top + window.scrollY;
    if (top === lastTop || attempts > 8) {
      el.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    lastTop = top;
    window.scrollTo({ top, behavior: "auto" });
    attempts++;
    requestAnimationFrame(settle);
  }
  requestAnimationFrame(settle);
}

function fuzzyDateLabel(m) {
  const { year, month, day, fuzzy, season } = m;
  function startLabel() {
    if (fuzzy==="uncertain") return year ? `${year}?` : "Date unknown";
    if (fuzzy==="decade") return `${Math.floor(year/10)*10}s`;
    if (fuzzy==="year") return `${year}`;
    if (fuzzy==="season") return `${season} ${year}`;
    if (fuzzy==="month") return `${MONTHS[month-1]} ${year}`;
    return `${MONTHS[month-1]} ${day}, ${year}`;
  }
  if (!m.endFuzzy) return startLabel();
  if (m.endOngoing) return `${startLabel()} – present`;
  function endLabel() {
    const { endYear:ey, endMonth:em, endDay:ed, endFuzzy:ef, endSeason:es } = m;
    if (ef==="decade") return `${Math.floor(ey/10)*10}s`;
    if (ef==="year") return `${ey}`;
    if (ef==="season") return `${es||"Early"} ${ey}`;
    if (ef==="month") return `${MONTHS[(em||1)-1]} ${ey}`;
    return `${MONTHS[(em||1)-1]} ${ed||1}, ${ey}`;
  }
  return `${startLabel()} – ${endLabel()}`;
}

function sortKey(m) {
  const mv = m.fuzzy==="month"||m.fuzzy==="day" ? (m.month||1) :
             m.fuzzy==="season" ? (m.season==="Early"?2:m.season==="Mid"?6:m.season==="Late"?10:6) : 1;
  return m.year*10000 + mv*100 + (m.fuzzy==="day"?m.day||1:1);
}

// Lazy-migrate event source citations: events stored under the old shape
// (sourceIds:[id]) are read as the new shape (sources:[{sourceId, citation, ...}]).
// New saves write the new shape; old data continues to work without rewrite.
function eventSources(m) {
  if (Array.isArray(m?.sources)) return m.sources;
  if (Array.isArray(m?.sourceIds)) return m.sourceIds.map(id => ({sourceId:id, citation:"", recordNotes:"", confidence:"unknown", mediaUrls:[]}));
  return [];
}

// Classify a Lineage event by how well-sourced it is. Used to colour event
// rows in history mode so unsourced gaps look obviously different from
// locked-in primary-source facts.
//   strong   — at least one citation marked primary
//   medium   — at least one secondary citation, no primary
//   weak     — only derivative or unknown citations
//   unsourced — no citation has a sourceId yet
function eventConfidence(m) {
  const cits = eventSources(m).filter(s => s && s.sourceId);
  if (cits.length === 0) return "unsourced";
  const confs = cits.map(s => s.confidence || "unknown");
  if (confs.includes("primary"))   return "strong";
  if (confs.includes("secondary")) return "medium";
  return "weak";
}
const EVENT_CONFIDENCE_STYLE = {
  strong:    { color: "#3a6b4a", bg: "rgba(122,158,138,0.12)", label: "✓ primary" },
  medium:    { color: "#3a4a7a", bg: "rgba(139,157,195,0.12)", label: "secondary" },
  weak:      { color: "#7a5820", bg: "rgba(196,169,98,0.14)",  label: "derivative" },
  unsourced: { color: "#a04050", bg: "rgba(196,133,138,0.10)", label: "? unsourced" },
};

// ─── Backup / sync helpers (v3 multi-subject format) ───────────────────────────
// The sync file and full backups are v3 — each holds a `subjects` array with
// every subject in the user's data, plus the cross-subject "top-level" fields.
// v1/v2 backups (single subject's data flat at top level) continue to import
// via readBackupSubjects, which wraps them as a synthetic single subject.

// Restore embedded data:URL media in a subject back into IndexedDB and
// rewrite mediaUrls to point at the new IDB ids. Idempotent — skips entries
// that are already IDB references.
async function restoreSubjectMedia(subject) {
  async function restoreMems(mems) {
    return Promise.all((mems||[]).map(async m => {
      const mediaUrls = await Promise.all((m.mediaUrls||[]).map(async med => {
        if (med && med.url && med.url.startsWith("data:")) {
          const id = med.mediaId || ("media_" + Date.now() + "_" + Math.random().toString(36).slice(2));
          const res = await fetch(med.url);
          const blob = await res.blob();
          await idbPut(id, blob);
          return { mediaId: id, name: med.name || "photo" };
        }
        return med;
      }));
      return { ...m, mediaUrls };
    }));
  }
  const memories = await restoreMems(subject.memories);
  const candidates = await restoreMems(subject.candidates);
  const entityPhotos = {};
  await Promise.all(Object.entries(subject.entityPhotos||{}).map(async ([key, med]) => {
    if (med && med.url && med.url.startsWith("data:")) {
      const id = med.mediaId || ("media_" + Date.now() + "_" + Math.random().toString(36).slice(2));
      const res = await fetch(med.url);
      const blob = await res.blob();
      await idbPut(id, blob);
      entityPhotos[key] = { mediaId: id, name: med.name || "photo" };
    } else if (med) {
      entityPhotos[key] = med;
    }
  }));
  return { ...subject, memories, candidates, entityPhotos };
}

// Normalize any backup payload (v1/v2/v3) into a list of subjects.
// v1/v2 (no `subjects` array) is wrapped as a single synthetic subject so the
// rest of the merge logic doesn't need to special-case it.
function readBackupSubjects(remote) {
  if (!remote) return [];
  if (Array.isArray(remote.subjects)) return remote.subjects;
  if (remote.memories) {
    return [{
      id: "subj_imported_" + Date.now(),
      name: remote.subjectName || "Imported subject",
      dob: remote.subjectDob || "",
      notes: remote.subjectNotes || "",
      isSelf: true, mode: null,
      memories: remote.memories || [],
      candidates: remote.candidates || [],
      candidatePersons: remote.candidatePersons || [],
      treePersons: remote.treePersons || [],
      treeFamilies: remote.treeFamilies || [],
      gedFocalPersonId: remote.gedFocalPersonId || null,
      knownPeople: remote.knownPeople || [],
      knownOrgs: remote.knownOrgs || [],
      knownLocations: remote.knownLocations || [],
      knownSources: remote.knownSources || [],
      customTags: remote.customTags || [],
      peopleEmails: remote.peopleEmails || {},
      peopleRelationships: remote.peopleRelationships || {},
      peopleNotes: remote.peopleNotes || {},
      orgNotes: remote.orgNotes || {},
      orgLocations: remote.orgLocations || {},
      orgPeriods: remote.orgPeriods || {},
      entityPhotos: remote.entityPhotos || {},
      locationNotes: remote.locationNotes || {},
      locationCoords: remote.locationCoords || {},
      personOrgs: remote.personOrgs || {},
      personLocations: remote.personLocations || {},
      personGroups: remote.personGroups || {},
      shareHistory: remote.shareHistory || [],
      senderNameMaps: remote.senderNameMaps || {},
      legacyMessage: remote.legacyMessage || "",
      contributionLinks: remote.contributionLinks || [],
    }];
  }
  return [];
}

// Match a remote subject to a local one — by id first, then case-insensitive
// name (so legacy v2 imports get attached to the right local subject).
function findMatchingLocalSubject(remote, localSubjects) {
  if (!remote) return null;
  let m = (localSubjects||[]).find(s => s.id === remote.id);
  if (m) return m;
  const rn = (remote.name||"").trim().toLowerCase();
  if (!rn) return null;
  return (localSubjects||[]).find(s => (s.name||"").trim().toLowerCase() === rn) || null;
}

// Merge two subjects' fields. Local wins on dictionary conflicts (so the
// device the user is editing on takes precedence on key:value entries);
// arrays are unioned by id where possible, otherwise sorted set-union.
// ── Sync merge helpers ──────────────────────────────────────────
// Deep equality for primitives, plain objects, and arrays. Used so the
// merge can detect identical-but-different-reference values (e.g. two
// "London" objects produced by separate edits with the same final fields).
function deepEq(a, b) {
  if (a === b) return true;
  if (a == null || b == null) return false;
  if (typeof a !== typeof b) return false;
  if (typeof a !== "object") return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (Array.isArray(a)) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (!deepEq(a[i], b[i])) return false;
    return true;
  }
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  for (const k of ka) if (!deepEq(a[k], b[k])) return false;
  return true;
}

function isEmptyVal(v) {
  if (v == null || v === "") return true;
  if (Array.isArray(v)) return v.length === 0;
  if (typeof v === "object") return Object.keys(v).length === 0;
  return false;
}

// Merge a single field. Prefers non-empty over empty; on a true value
// conflict (both non-empty, different), prefers `remote` — because sync
// pull and file import both express the user's intent to bring incoming
// data in. Returns { value, conflict }.
function mergeField(local, remote) {
  if (deepEq(local, remote)) return { value: local, conflict: false };
  if (isEmptyVal(local))  return { value: remote, conflict: false };
  if (isEmptyVal(remote)) return { value: local,  conflict: false };
  return { value: remote, conflict: true };
}

// Merge two key/value dictionaries field-by-field.
function mergeDict(local, remote) {
  const out = {};
  let conflicts = 0;
  const keys = new Set([...Object.keys(local||{}), ...Object.keys(remote||{})]);
  for (const k of keys) {
    const lHas = local  && Object.prototype.hasOwnProperty.call(local,  k);
    const rHas = remote && Object.prototype.hasOwnProperty.call(remote, k);
    if (!lHas) { out[k] = remote[k]; continue; }
    if (!rHas) { out[k] = local[k];  continue; }
    const r = mergeField(local[k], remote[k]);
    out[k] = r.value;
    if (r.conflict) conflicts++;
  }
  return { result: out, conflicts };
}

// Merge two knownLocations arrays. Coalesces both string and object form
// to objects, dedupes by label, and merges the structured fields
// (street/town/state/country/coords/...) per key via mergeField. Without
// this, a cloud-side address fix never reaches a device that already had
// a stale entry with the same label.
function mergeKnownLocations(local, remote) {
  const labelOf = l => typeof l === "string" ? l : (l && l.label) || "";
  const toObj = l => typeof l === "string" ? { label: l } : (l || {});
  const byLabel = new Map();
  let conflicts = 0;
  for (const lo of (local || [])) {
    const lbl = labelOf(lo);
    if (!lbl) continue;
    byLabel.set(lbl, toObj(lo));
  }
  for (const ro of (remote || [])) {
    const lbl = labelOf(ro);
    if (!lbl) continue;
    const existing = byLabel.get(lbl);
    if (!existing) { byLabel.set(lbl, toObj(ro)); continue; }
    const m = mergeDict(existing, toObj(ro));
    conflicts += m.conflicts;
    byLabel.set(lbl, { ...m.result, label: lbl });
  }
  return {
    result: [...byLabel.values()].sort((a, b) => labelOf(a).localeCompare(labelOf(b))),
    conflicts,
  };
}

function mergeSubjects(local, remote) {
  if (!local) return remote;
  if (!remote) return local;
  const sortKeyLocal = (m) => {
    const mv = m.fuzzy === "month" || m.fuzzy === "day" ? (m.month||1)
             : m.fuzzy === "season" ? (m.season === "Early" ? 2 : m.season === "Mid" ? 6 : 10) : 1;
    return (m.year||0)*10000 + mv*100 + (m.fuzzy==="day" ? (m.day||1) : 1);
  };
  // Memories: union by id, merge perspectives by author
  const remoteMemsById = new Map((remote.memories||[]).map(m => [m.id, m]));
  const localIds = new Set((local.memories||[]).map(m => m.id));
  const mergedMems = (local.memories||[]).map(m => {
    const rem = remoteMemsById.get(m.id);
    if (!rem) return m;
    const existing = m.perspectives || [];
    const newP = (rem.perspectives||[]).filter(p => !existing.some(e => e.author === p.author));
    return newP.length ? { ...m, perspectives: [...existing, ...newP] } : m;
  });
  const newMems = (remote.memories||[]).filter(m => !localIds.has(m.id));
  const memories = [...mergedMems, ...newMems].sort((a,b) => sortKeyLocal(a) - sortKeyLocal(b));
  // ID-keyed unions (local entries kept; remote-only added)
  const unionById = (a, b) => {
    const seen = new Set((a||[]).map(x => x.id));
    return [...(a||[]), ...(b||[]).filter(x => x && x.id && !seen.has(x.id))];
  };
  // String set-unions, sorted
  const unionSorted = (a, b) => [...new Set([...(a||[]), ...(b||[])])].sort();
  // knownLocations: dedupe by label, merging structured fields per-label so
  // cloud-side address corrections actually reach a device that already had
  // a stale entry with the same label.
  const knownLocations = mergeKnownLocations(local.knownLocations, remote.knownLocations).result;
  // shareHistory: union by (timestamp + memId list) signature
  const shareSig = (h) => (h.timestamp||"") + "|" + (h.memIds||[]).join(",");
  const localShareKeys = new Set((local.shareHistory||[]).map(shareSig));
  const newShares = (remote.shareHistory||[]).filter(h => !localShareKeys.has(shareSig(h)));
  return {
    ...remote, ...local, // local wins for top-level fields like name/dob/mode/notes
    memories,
    candidates:        unionById(local.candidates, remote.candidates),
    candidatePersons:  unionById(local.candidatePersons, remote.candidatePersons),
    knownPeople:       unionSorted(local.knownPeople, remote.knownPeople),
    knownOrgs:         unionSorted(local.knownOrgs, remote.knownOrgs),
    customTags:        unionSorted(local.customTags, remote.customTags),
    knownLocations,
    knownSources:      unionById(local.knownSources, remote.knownSources),
    treePersons:       unionById(local.treePersons, remote.treePersons),
    treeFamilies:      unionById(local.treeFamilies, remote.treeFamilies),
    gedFocalPersonId:  local.gedFocalPersonId || remote.gedFocalPersonId || null,
    peopleEmails:        mergeDict(local.peopleEmails,        remote.peopleEmails).result,
    peopleRelationships: mergeDict(local.peopleRelationships, remote.peopleRelationships).result,
    peopleNotes:         mergeDict(local.peopleNotes,         remote.peopleNotes).result,
    orgNotes:            mergeDict(local.orgNotes,            remote.orgNotes).result,
    orgLocations:        mergeDict(local.orgLocations,        remote.orgLocations).result,
    orgPeriods:          mergeDict(local.orgPeriods,          remote.orgPeriods).result,
    entityPhotos:        mergeDict(local.entityPhotos,        remote.entityPhotos).result,
    locationNotes:       mergeDict(local.locationNotes,       remote.locationNotes).result,
    locationCoords:      mergeDict(local.locationCoords,      remote.locationCoords).result,
    personOrgs:          mergeDict(local.personOrgs,          remote.personOrgs).result,
    personLocations:     mergeDict(local.personLocations,     remote.personLocations).result,
    personGroups:        mergeDict(local.personGroups,        remote.personGroups).result,
    senderNameMaps:      mergeDict(local.senderNameMaps,      remote.senderNameMaps).result,
    shareHistory:      [...(local.shareHistory||[]), ...newShares],
    legacyMessage:     local.legacyMessage || remote.legacyMessage || "",
    contributionLinks: unionById(local.contributionLinks, remote.contributionLinks),
  };
}

// Build a deep link to the Genealogy research tool with as much of the event
// context prefilled as possible. m is optional — if absent, the tool opens bare.
function genealogyResearchUrl(m, knownLocations) {
  const params = new URLSearchParams();
  if (m) {
    if (m.eventType) params.set("eventType", m.eventType);
    if (m.year) {
      params.set("rangeStartYear", String(m.year));
      params.set("rangeEndYear", String(m.year));
    }
    const label = m.location || "";
    if (label) {
      const known = (knownLocations||[]).find(l => (typeof l === "string" ? l : l.label) === label);
      if (known && typeof known === "object") {
        if (known.country) params.set("country", known.country);
        if (known.state)   params.set("stateProvince", known.state);
        if (known.town)    params.set("townParish", known.town);
      }
    }
    if (params.get("eventType") && params.get("country")) params.set("autosubmit", "1");
  }
  const qs = params.toString();
  return GENEALOGY_TOOL_URL + (qs ? "?" + qs : "");
}

const COUNTRY_LOWER = new Map(COUNTRY_LIST.map(c => [c.toLowerCase(), c]));
function normaliseCountry(s) {
  if (!s) return null;
  const k = String(s).trim().toLowerCase().replace(/\.$/,"").replace(/^the\s+/,"");
  return COUNTRY_LOWER.get(k) || null;
}

// Parse a comma-separated location label into structured fields. Conservative:
// only commits to a layout when it can disambiguate. 2-part labels stay
// ambiguous unless the second part matches a known country.
function parseLabelToFields(label) {
  if (!label || typeof label !== 'string') return null;
  const s = label.trim();
  if (!s) return null;
  const parts = s.split(",").map(p => p.trim()).filter(Boolean);
  if (parts.length >= 4) return { street: parts[0], town: parts[1], state: parts[2], country: normaliseCountry(parts[parts.length-1]) || parts[parts.length-1] };
  if (parts.length === 3) return { street: "", town: parts[0], state: parts[1], country: normaliseCountry(parts[2]) || parts[2] };
  if (parts.length === 2) {
    const c = normaliseCountry(parts[1]);
    return c
      ? { street: "", town: parts[0], state: "", country: c }
      : { street: "", town: parts[0], state: "", country: "" };
  }
  if (parts.length === 1) {
    const c = normaliseCountry(parts[0]);
    return c ? { street: "", town: "", state: "", country: c } : null;
  }
  return null;
}

function migrateKnownLocation(loc) {
  // Already an object with label? Return as-is
  if (loc && typeof loc === 'object' && loc.label) return loc;
  if (typeof loc !== 'string' || !loc.trim()) return null;
  const s = loc.trim();
  const parsed = parseLabelToFields(s) || {};
  return { label: s, street: parsed.street||"", town: parsed.town||"", state: parsed.state||"", country: parsed.country||"" };
}

function migrateKnownLocations(arr) {
  if (!arr || !arr.length) return [];
  // If first item is already an object, assume migrated
  if (typeof arr[0] === 'object' && arr[0].label) return arr;
  return arr.map(migrateKnownLocation).filter(Boolean);
}

function knownLocationLabels(knownLocations) {
  return (knownLocations || []).map(l => typeof l === 'string' ? l : l.label).filter(Boolean);
}

function findKnownLocation(knownLocations, label) {
  if (!label) return null;
  return (knownLocations || []).find(l =>
    (typeof l === 'string' ? l : l.label) === label
  ) || null;
}

function knownLocationValues(knownLocations, field) {
  // Get unique values for a specific field (town, state, country) across all known locations
  return [...new Set(
    (knownLocations || [])
      .map(l => typeof l === 'object' ? l[field] : "")
      .filter(Boolean)
  )].sort();
}

function newForm() {
  return { title:"", content:"", year:0, month:1, day:0, fuzzy:"day", season:"Early", dateUncertain:false, location:"", locations:[], tags:[], people:[], orgs:[], sources:[], mediaUrls:[], endFuzzy:null, endYear:null, endMonth:1, endDay:1, endSeason:"Early", endOngoing:false, inLegacy:false, visibility:"private", publicSummary:"", locationLabel:"", locationStreet:"", locationTown:"", locationState:"", locationCountry:"", locationPrivacy:"town", researchNote:"", candidateConfidence:"possible", candidatePersonId:"", eventType:"", recalledBy:"self" };
}

// ── Storage ────────────────────────────────────────────────────

// ── IndexedDB for media blobs ──────────────────────────────────
const IDB_NAME = "chronicle-media";
const IDB_STORE = "blobs";
let _idb = null;

function openIDB() {
  if (_idb) return Promise.resolve(_idb);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess = e => { _idb = e.target.result; resolve(_idb); };
    req.onerror = () => reject(req.error);
  });
}

async function idbPut(id, blob) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(blob, id);
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
}

async function idbGet(id) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(id);
    req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error);
  });
}

async function idbDelete(id) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
}

async function idbGetAll() {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const items = {};
    const tx = db.transaction(IDB_STORE);
    const req = tx.objectStore(IDB_STORE).openCursor();
    req.onsuccess = e => {
      const cursor = e.target.result;
      if (cursor) { items[cursor.key] = cursor.value; cursor.continue(); }
      else resolve(items);
    };
    req.onerror = () => reject(req.error);
  });
}

// Save a data-url string as a blob in IDB, return the mediaId
async function storeMedia(dataUrl, name) {
  const mediaId = "media_" + Date.now() + "_" + Math.random().toString(36).slice(2);
  // Convert data-url to Blob
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  await idbPut(mediaId, blob);
  return { mediaId, name };
}

// Resize a blob image to max dimension, return data URL
async function resizeImageBlob(blob, maxDim) {
  // Always re-encode through a canvas — even when no resize is needed —
  // so EXIF metadata (camera, GPS, timestamp) is stripped before the
  // image leaves the device via share / sync. Returning the original
  // blob via FileReader would preserve EXIF and quietly leak GPS.
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const w = img.width, h = img.height;
      const scale = (w <= maxDim && h <= maxDim) ? 1 : maxDim / Math.max(w, h);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load failed")); };
    img.src = url;
  });
}

// Resolve a mediaId (or legacy base64 url) to an object URL for display
const _objUrlCache = {};
async function resolveMediaUrl(med) {
  // Legacy: inline base64 data-url stored directly
  if (med.url && med.url.startsWith("data:")) {
    // Migrate inline to IDB on first access
    if (!med.mediaId) {
      const { mediaId } = await storeMedia(med.url, med.name || "photo");
      med.mediaId = mediaId;
      med.url = null; // strip inline data after migration
    }
  }
  if (!med.mediaId) return null;
  if (_objUrlCache[med.mediaId]) return _objUrlCache[med.mediaId];
  const blob = await idbGet(med.mediaId);
  if (!blob) return null;
  const objUrl = URL.createObjectURL(blob);
  _objUrlCache[med.mediaId] = objUrl;
  return objUrl;
}

// ── Crypto helpers ────────────────────────────────────────────
const CRYPTO_KEY = "chronicle-crypto";  // stores {salt, iv, ciphertext, check} — all base64

function b64(buf) {
  const bytes = new Uint8Array(buf);
  let str = "";
  for (let i = 0; i < bytes.length; i += 8192) {
    str += String.fromCharCode(...bytes.subarray(i, i + 8192));
  }
  return btoa(str);
}
function unb64(s) { return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }

async function deriveKey(password, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt, iterations:200000, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]
  );
}

async function encryptData(password, plaintext) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await deriveKey(password, salt);
  const enc  = await crypto.subtle.encrypt({name:"AES-GCM",iv}, key, new TextEncoder().encode(plaintext));
  // Store a small check token so we can verify the password before decrypting everything
  const checkIv  = crypto.getRandomValues(new Uint8Array(12));
  const checkEnc = await crypto.subtle.encrypt({name:"AES-GCM",iv:checkIv}, key, new TextEncoder().encode("chronicle-ok"));
  return { salt:b64(salt), iv:b64(iv), ciphertext:b64(enc), checkIv:b64(checkIv), check:b64(checkEnc) };
}

async function decryptData(password, stored) {
  try {
    const salt = unb64(stored.salt);
    const key  = await deriveKey(password, salt);
    // Verify password with the check token first
    const checkPlain = await crypto.subtle.decrypt(
      {name:"AES-GCM", iv:unb64(stored.checkIv)}, key, unb64(stored.check)
    );
    if (new TextDecoder().decode(checkPlain) !== "chronicle-ok") return null;
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(stored.iv)}, key, unb64(stored.ciphertext));
    return new TextDecoder().decode(plain);
  } catch(e) { return null; }
}

function isEncrypted() {
  try { const d = localStorage.getItem(CRYPTO_KEY); return !!d && !!JSON.parse(d).ciphertext; } catch(e) { return false; }
}

async function saveEncrypted(password, data) {
  const clean = {
    ...data,
    subjects: (data.subjects||[]).map(s => ({
      ...s,
      memories: (s.memories||[]).map(m => ({
        ...m,
        mediaUrls: (m.mediaUrls||[]).map(med => med.url?.startsWith("data:") ? {mediaId:med.mediaId, name:med.name} : med)
      }))
    }))
  };
  // CRITICAL: only remove the unencrypted copy after confirming the encrypted write
  // succeeded. localStorage can throw on quota errors, in private-browsing mode, or
  // when the storage backend is in a bad state — losing both copies would be
  // unrecoverable, so we keep the plaintext copy intact on failure.
  try {
    const stored = await encryptData(password, JSON.stringify(clean));
    localStorage.setItem(CRYPTO_KEY, JSON.stringify(stored));
  } catch (e) {
    console.error("[saveEncrypted] failed:", e);
    return false;
  }
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (e) {
    // Encrypted save succeeded; cleanup of the plaintext copy failed. Not fatal —
    // next successful save will retry. Don't roll back the encrypted write.
    console.warn("[saveEncrypted] could not remove plaintext copy:", e);
  }
  return true;
}

async function loadEncrypted(password) {
  try {
    const stored = JSON.parse(localStorage.getItem(CRYPTO_KEY));
    const plain  = await decryptData(password, stored);
    if (!plain) return null; // wrong password
    return JSON.parse(plain);
  } catch(e) { return null; }
}

// ── Unencrypted fallback ───────────────────────────────────────
function loadData() {
  try {
    const d = localStorage.getItem(STORAGE_KEY);
    const raw = d ? JSON.parse(d) : null;
    if (!raw) return migrateData({});
    return scrubLegacyTags(migrateData(raw));
  } catch(e) { return migrateData({}); }
}

// Strip the legacy "genealogy" auto-tag from every memory (and candidate). Older
// GEDCOM imports added this tag automatically; it served no purpose and cluttered
// the Tags index. Idempotent — runs every load, only mutates if the tag is found.
function scrubLegacyTags(data) {
  const stripTag = (m) => {
    if (!Array.isArray(m.tags) || !m.tags.includes("genealogy")) return m;
    return { ...m, tags: m.tags.filter(t => t !== "genealogy") };
  };
  const subjects = (data.subjects || []).map(s => ({
    ...s,
    memories:   (s.memories   || []).map(stripTag),
    candidates: (s.candidates || []).map(stripTag),
  }));
  return { ...data, subjects };
}
function saveData(data) {
  try {
    const clean = {
      ...data,
      subjects: (data.subjects||[]).map(s => ({
        ...s,
        memories: (s.memories||[]).map(m => ({
          ...m,
          mediaUrls: (m.mediaUrls||[]).map(med => med.url?.startsWith("data:") ? {mediaId:med.mediaId, name:med.name} : med)
        }))
      }))
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clean)); return true;
  } catch(e) { return false; }
}

function seedSubject(s) {
  const mems = s.memories || [];
  // Migrate knownLocations from string array to object array
  const existingLocs = migrateKnownLocations(s.knownLocations || []);
  const existingLabels = new Set(existingLocs.map(l => l.label));
  // Add any location labels from memories that aren't already known
  const memLabels = mems.flatMap(m => [m.location, ...(m.locations || [])].filter(Boolean));
  const newLocs = [...memLabels].filter(label => !existingLabels.has(label));
  const allLocs = [...existingLocs, ...newLocs.map(label => migrateKnownLocation(label))].filter(Boolean);
  // Deduplicate by label
  const seen = new Set();
  const dedupedLocs = allLocs.filter(l => { if (seen.has(l.label)) return false; seen.add(l.label); return true; });
  dedupedLocs.sort((a, b) => a.label.localeCompare(b.label));

  // Normalise email casing on every save so two share entries for
  // "user@x.com" and "User@X.com" can't accumulate as duplicates. The
  // sync Worker already lowercases on its side; this matches it locally.
  const normEmails = {};
  Object.entries(s.peopleEmails || {}).forEach(([name, email]) => {
    if (typeof email === "string") normEmails[name] = email.trim().toLowerCase();
    else if (email != null) normEmails[name] = email;
  });

  return {
    ...s,
    knownPeople:    [...new Set([...(s.knownPeople||[]),    ...mems.flatMap(m=>m.people||[])])].sort(),
    knownOrgs:      [...new Set([...(s.knownOrgs||[]),      ...mems.flatMap(m=>m.orgs||[])])].sort(),
    knownLocations: dedupedLocs,
    peopleEmails:   normEmails,
  };
}

// ── EXIF ───────────────────────────────────────────────────────
function extractExif(buffer) {
  try {
    const view = new DataView(buffer);
    if (view.getUint16(0) !== 0xFFD8) return {};
    let offset = 2;
    while (offset < view.byteLength - 4) {
      const marker = view.getUint16(offset);
      const segLen = view.getUint16(offset + 2);
      if (marker === 0xFFE1) {
        const hdr = String.fromCharCode(...new Uint8Array(buffer, offset + 4, 6));
        if (hdr.startsWith("Exif")) {
          return parseExifSegment(view, offset + 10);
        }
      }
      if (marker === 0xFFDA) break;
      offset += 2 + segLen;
    }
  } catch(e) {}
  return {};
}

function parseExifSegment(view, tiff) {
  try {
    const le  = view.getUint16(tiff) === 0x4949;
    const g16 = o => view.getUint16(tiff + o, le);
    const g32 = o => view.getUint32(tiff + o, le);
    function readASCII(offset, len) {
      return String.fromCharCode(...new Uint8Array(view.buffer, tiff + offset, len)).replace(/\0/g, "");
    }
    function scanIFD(ifdOffset) {
      const tags = {}; const n = g16(ifdOffset);
      for (let i = 0; i < n; i++) {
        const e = ifdOffset + 2 + i * 12;
        const tag = g16(e); const typ = g16(e+2); const cnt = g32(e+4); const val = g32(e+8);
        tags[tag] = { typ, cnt, val };
      }
      return tags;
    }
    const ifd0 = g32(4);
    const ifd0Tags = scanIFD(ifd0);
    let dateResult = null;
    const exifIFDPtr = ifd0Tags[0x8769];
    if (exifIFDPtr) {
      const exifTags = scanIFD(exifIFDPtr.val);
      for (const dtTag of [0x9003, 0x9004, 0x0132]) {
        const t = exifTags[dtTag] || ifd0Tags[dtTag];
        if (t) {
          const ds = readASCII(t.val, 19);
          const mx = ds.match(/^(\d{4}):(\d{2}):(\d{2})/);
          if (mx) { dateResult = { year:+mx[1], month:+mx[2], day:+mx[3] }; break; }
        }
      }
    }
    if (!dateResult && ifd0Tags[0x0132]) {
      const ds = readASCII(ifd0Tags[0x0132].val, 19);
      const mx = ds.match(/^(\d{4}):(\d{2}):(\d{2})/);
      if (mx) dateResult = { year:+mx[1], month:+mx[2], day:+mx[3] };
    }
    // GPS extraction
    let gps = null;
    const gpsIFDPtr = ifd0Tags[0x8825];
    if (gpsIFDPtr) {
      try {
        const gpsTags = scanIFD(gpsIFDPtr.val);
        function readRational(offset) {
          const num = g32(offset); const den = g32(offset + 4);
          return den ? num / den : 0;
        }
        function readGPSCoord(tag) {
          const t = gpsTags[tag];
          if (!t) return null;
          if (t.cnt === 3) {
            const d = readRational(t.val); const m = readRational(t.val + 8); const s = readRational(t.val + 16);
            return d + m / 60 + s / 3600;
          }
          // Some cameras store as a single rational
          if (t.cnt === 1) return readRational(t.val);
          return null;
        }
        const lat = readGPSCoord(0x0002);
        const lng = readGPSCoord(0x0004);
        if (lat !== null && lng !== null) {
          function readRef(tag, fallback) {
            const t = gpsTags[tag]; if (!t) return fallback;
            try {
              if (t.cnt <= 4) {
                // Inline: val contains the bytes directly; extract first byte as char
                const b = le ? (t.val & 0xFF) : ((t.val >> 24) & 0xFF);
                return b ? String.fromCharCode(b) : fallback;
              }
              return readASCII(t.val, 1) || fallback;
            } catch(e) { return fallback; }
          }
          const latRef = readRef(0x0001, "N");
          const lngRef = readRef(0x0003, "E");
          gps = { lat: lat * (latRef === "S" ? -1 : 1), lng: lng * (lngRef === "W" ? -1 : 1) };
        }
      } catch(e) {}
    }
    return { ...dateResult, ...(gps ? {gps} : {}) };
  } catch(e) {}
  return {};
}

// ── Email parser ───────────────────────────────────────────────

// Decode quoted-printable encoding (=XX hex escapes, soft line breaks)
function decodeQP(str) {
  return str
    .replace(/=\r?\n/g, "")                          // soft line breaks
    .replace(/=([0-9A-Fa-f]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
}

// Decode encoded-word headers: =?UTF-8?Q?...?= or =?UTF-8?B?...?=
function decodeHeader(str) {
  return str.replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g, (_, charset, enc, data) => {
    try {
      if (enc.toUpperCase() === "B") {
        const bin = atob(data);
        return new TextDecoder(charset).decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
      } else {
        return decodeQP(data.replace(/_/g, " "));
      }
    } catch(e) { return data; }
  });
}

// Parse raw MIME headers from a block of text, returning {headers, bodyStart}
function parseMimeHeaders(text) {
  const headers = {};
  let i = 0;
  const lines = text.split(/\r?\n/);
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === "") { i++; break; }           // blank line = end of headers
    // fold continuation lines (start with whitespace)
    let full = line;
    while (i + 1 < lines.length && /^[ \t]/.test(lines[i + 1])) {
      i++;
      full += " " + lines[i].trim();
    }
    const colon = full.indexOf(":");
    if (colon > 0) {
      const key = full.slice(0, colon).trim().toLowerCase();
      const val = full.slice(colon + 1).trim();
      headers[key] = val;
    }
    i++;
  }
  return { headers, bodyLines: lines.slice(i) };
}

// Extract the best plain-text part from a MIME message (recursive)
function extractPlainText(headers, bodyLines) {
  const ct = headers["content-type"] || "text/plain";
  const cte = (headers["content-transfer-encoding"] || "").toLowerCase();

  // Multipart: find boundary and recurse into parts
  const boundaryMatch = ct.match(/boundary="?([^";\s]+)"?/i);
  if (boundaryMatch) {
    const boundary = boundaryMatch[1];
    const body = bodyLines.join("\n");
    const parts = body.split(new RegExp("--" + boundary.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?:--)?\\r?\\n?"));
    let plain = "";
    let html = "";
    for (const part of parts) {
      if (!part.trim() || part.trim() === "--") continue;
      const { headers: ph, bodyLines: pb } = parseMimeHeaders(part);
      const pct = ph["content-type"] || "";
      if (/text\/plain/i.test(pct)) plain = extractPlainText(ph, pb);
      else if (/text\/html/i.test(pct) && !plain) html = extractPlainText(ph, pb);
      else if (/multipart\//i.test(pct)) {
        const nested = extractPlainText(ph, pb);
        if (nested) plain = nested;
      }
    }
    return plain || html;
  }

  // Leaf part: decode the body
  let body = bodyLines.join("\n");
  if (cte === "quoted-printable") body = decodeQP(body);
  else if (cte === "base64") {
    try { body = atob(body.replace(/\s+/g, "")); } catch(e) { return ""; }
  }

  // Strip HTML tags if this is an HTML part
  if (/text\/html/i.test(ct)) {
    body = body
      .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, "")
      .replace(/[<]script[^>]*>[\s\S]*?<\/script>/gi, "")
      .replace(/<br\s*\/?>/gi, "\n")
      .replace(/<\/p>/gi, "\n\n")
      .replace(/<\/div>/gi, "\n")
      .replace(/<[^>]+>/g, "")
      .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&nbsp;/g, " ");
  }

  // Clean up: collapse quoted reply chains (lines starting with >)
  body = body
    .split("\n")
    .filter(l => !l.trimStart().startsWith(">"))   // strip quoted lines
    .join("\n")
    .replace(/On .{10,80}wrote:\s*$/m, "")          // strip "On [date] X wrote:"
    .replace(/\n{3,}/g, "\n\n")                     // collapse excess blank lines
    .trim();

  return body;
}

function parseEmail(text) {
  const { headers, bodyLines } = parseMimeHeaders(text);

  const from    = decodeHeader(headers["from"]    || "");
  const subject = decodeHeader(headers["subject"] || "");
  const dateStr = headers["date"] || "";

  let year=null, month=null, day=null, fuzzy="day";
  if (dateStr) {
    const d = new Date(dateStr);
    if (!isNaN(d)) { year=d.getFullYear(); month=d.getMonth()+1; day=d.getDate(); }
  }
  if (!year) fuzzy = "year";

  const body = extractPlainText(headers, bodyLines).slice(0, 3000);

  return {
    from, subject, dateStr,
    body,
    year: year || new Date().getFullYear(),
    month: month || 1,
    day: day || 1,
    fuzzy
  };
}

  loc => `Did anything unexpected or memorable happen at ${loc}?`,

];
const ORG_PROMPTS = [

function buildPrompt(memories, knownPeople, knownOrgs, knownLocations, seen=new Set(), extras={}) {
  // extras: { peopleRelationships, orgLocations, personOrgs }
  const { peopleRelationships={}, orgLocations={}, personOrgs={} } = extras;

  // Score people, places, orgs by memory count (fewer = more interesting to fill in)
  const memCount = arr => arr.map(x => ({
    x, n: memories.filter(m =>
      (m.people||[]).includes(x) || (m.orgs||[]).includes(x) ||
      [m.location,...(m.locations||[])].includes(x)
    ).length
  })).sort((a,b) => a.n - b.n);

  const locLabels = knownLocations.map(l=>typeof l==='string'?l:l.label);
  const people = memCount(knownPeople).filter(({n})=>n<10).sort((a,b)=>a.n-b.n);
  const orgs   = memCount(knownOrgs).filter(({n})=>n<8).sort((a,b)=>a.n-b.n);
  const locs   = memCount(locLabels).filter(({n})=>n<8).sort((a,b)=>a.n-b.n);

  // ── Completion prompts: incomplete index data ──────────────────
  const completionPool = [];

  // People without a relationship set
  knownPeople.filter(p=>!peopleRelationships[p]).forEach(p=>{
    completionPool.push({ type:"person", subtype:"set-relationship", entity:p, count:memories.filter(m=>(m.people||[]).includes(p)).length,
      text:`What is ${p} to you? Adding a relationship helps you find and filter memories.`,
      action:`Add a memory with ${p}` });
  });

  // Locations without geocodes
  knownLocations.filter(l=>{const loc=typeof l==='object'?l:null; return !loc||!loc.coords;}).forEach(l=>{
    const label=typeof l==='string'?l:l.label;
    completionPool.push({ type:"place", subtype:"set-coords", entity:label, count:memories.filter(m=>m.location===label||(m.locations||[]).includes(label)).length,
      text:`${label} has no map coordinates yet — it won\u2019t appear on your map. Do you know roughly where it is?`,
      action:`Add a memory at ${label}` });
  });

  // Orgs without any linked people
  knownOrgs.filter(o=>!Object.values(personOrgs).some(os=>(os||[]).includes(o))).forEach(o=>{
    completionPool.push({ type:"org", subtype:"set-org-people", entity:o, count:memories.filter(m=>(m.orgs||[]).includes(o)).length,
      text:`${o} has no people linked to it. Who were the key people in your time there?`,
      action:`Add a memory about ${o}` });
  });

  // Orgs without any linked locations
  knownOrgs.filter(o=>!(orgLocations[o]||[]).length).forEach(o=>{
    completionPool.push({ type:"org", subtype:"set-org-location", entity:o, count:memories.filter(m=>(m.orgs||[]).includes(o)).length,
      text:`Where was ${o} based? Linking a location helps connect it to your map and other memories.`,
      action:`Add a memory about ${o}` });
  });

  // Zero-memory entities get top slots in pool
  const zeroPool = [
    ...people.filter(({n})=>n===0).map(({x})=>({ type:"person",entity:x,count:0,text:`You\u2019ve recorded ${x} but haven\u2019t linked any memories yet. What\u2019s the first thing that comes to mind?`,action:`Add a memory with ${x}` })),
    ...orgs.filter(({n})=>n===0).map(({x})=>({ type:"org",entity:x,count:0,text:`${x} is in your index but has no memories attached. What period of your life does it belong to?`,action:`Add a memory about ${x}` })),
    ...locs.filter(({n})=>n===0).map(({x})=>({ type:"place",entity:x,count:0,text:`You\u2019ve noted ${x} but haven\u2019t added any memories there yet. What happened at ${x}?`,action:`Add a memory at ${x}` })),
  ];

  // Find decade gaps
  const decades = [...new Set(memories.map(m=>Math.floor(m.year/10)*10))];
  const allDecades = [];
  const minDec = memories.length ? Math.floor(Math.min(...memories.map(m=>m.year))/10)*10 : null;
  const maxDec = memories.length ? Math.floor(new Date().getFullYear()/10)*10 : null;
  if (minDec && maxDec) {
    for (let d=minDec; d<=maxDec; d+=10) if (!decades.includes(d)) allDecades.push(d);
  }

  // Tags present
  const tagCounts = {};
  memories.forEach(m=>(m.tags||[]).forEach(t=>{ tagCounts[t]=(tagCounts[t]||0)+1; }));

  // Build pool of possible prompts
  const pool = [];

  // Completion prompts (incomplete data) go first if not seen
  completionPool.forEach(p=>{ if(!seen.has(p.entity+"||"+p.text)) pool.push(p); });
  // Zero-memory entities go next if not seen
  zeroPool.forEach(p=>{ if(!seen.has(p.entity+"||"+p.text)) pool.push(p); });
  people.filter(({n})=>n>0).slice(0,8).forEach(({x,n})=>{
    const fns = PERSON_PROMPTS;
    const fn = fns[Math.floor(Math.random()*fns.length)];
    pool.push({ type:"person", entity:x, count:n, text:fn(x), action:`Add a memory with ${x}` });
  });
  locs.slice(0,6).forEach(({x,n})=>{
    const fn = PLACE_PROMPTS[Math.floor(Math.random()*PLACE_PROMPTS.length)];
    pool.push({ type:"place", entity:x, count:n, text:fn(x), action:`Add a memory at ${x}` });
  });
  orgs.slice(0,4).forEach(({x,n})=>{
    const fn = ORG_PROMPTS[Math.floor(Math.random()*ORG_PROMPTS.length)];
    pool.push({ type:"org", entity:x, count:n, text:fn(x), action:`Add a memory about ${x}` });
  });
  Object.entries(tagCounts).forEach(([tag,n])=>{
    const fn = TAG_PROMPTS[tag];
    if (!fn) return;
    const dec = allDecades.length ? allDecades[Math.floor(Math.random()*allDecades.length)] : null;
    pool.push({ type:"tag", entity:tag, count:n, text:fn(n,dec), action:`Add a ${tag} memory` });
  });
  allDecades.slice(0,3).forEach(dec=>{
    const fn = DECADE_PROMPTS[Math.floor(Math.random()*DECADE_PROMPTS.length)];
    pool.push({ type:"decade", entity:String(dec), count:0, text:fn(dec), action:`Add a memory from the ${dec}s` });
  });

  const fresh = pool.filter(p => !seen.has(p.entity + "||" + p.text));
  const candidates = fresh.length ? fresh : pool; // fall back to full pool if all seen
  return candidates[Math.floor(Math.random()*candidates.length)];
}

  function previous() {

// ── Linkify — turn URLs in text into clickable anchors ──────────
function linkify(text) {
  if (!text) return null;
  const urlRe = /https?:\/\/[^\s<>"()]+[^\s<>"().,:;!?]/g;
  const parts = []; let last = 0; let m;
  while ((m = urlRe.exec(text)) !== null) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    parts.push(React.createElement("a", {
      key: m.index, href: m[0], target: "_blank", rel: "noopener noreferrer",
      style: { color: "#5a6a8a", textDecoration: "underline", textDecorationColor: "#c8b89a", wordBreak: "break-all" },
      onClick: e => e.stopPropagation()
    }, m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push(text.slice(last));
  return parts.length === 1 && typeof parts[0] === "string" ? text : parts;
}

  // ignoring callback identity is safe here. Without this, the parent

  if (prev.email !== next.email) return false;
  if (prev.photo !== next.photo) return false;
  if (prev.connectionEntry !== next.connectionEntry) return false;

    a = a || []; b = b || [];
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  };

  if (!arrEq(prev.locs, next.locs)) return false;
  if (!arrEq(prev.knownOrgs, next.knownOrgs)) return false;
  if (!arrEq(prev.knownLocations, next.knownLocations)) return false;
  if (!arrEq(prev.allRelationships, next.allRelationships)) return false;

// Group a relationship label into a broad category for the tree view.
// Match against keywords rather than exact strings so free-text labels like
// "Childhood best friend" still land in the right bucket.
const RELATIONSHIP_CATEGORIES = [
  { key:"family",   label:"\ud83d\udc6a Family",  patterns:["father","mother","parent","son","daughter","child","sister","brother","sibling","grandparent","grandmother","grandfather","grandchild","granddaughter","grandson","aunt","uncle","niece","nephew","cousin","in-law","in law","spouse","partner","wife","husband","ex-","step"] },
  { key:"friends",  label:"\ud83d\udc6b Friends", patterns:["friend","mate","girlfriend","boyfriend","companion"] },
  { key:"work",     label:"\ud83d\udcbc Work",    patterns:["colleague","coworker","co-worker","manager","employer","employee","boss","mentor","mentee","teammate","supervisor","client","business"] },
  { key:"education",label:"\ud83c\udf93 Education",patterns:["teacher","tutor","student","classmate","professor","schoolmate","lecturer"] },
  { key:"care",     label:"\ud83c\udfe5 Healthcare",patterns:["doctor","therapist","coach","nurse","psychiatrist","psychologist","counsellor","counselor","carer","caregiver","midwife","gp"] },
  { key:"community",label:"\ud83c\udfd8 Community",patterns:["neighbour","neighbor","flatmate","housemate","roommate"] },
];
function categoriseRelationship(rel) {
  const r = (rel||"").toLowerCase();
  for (const c of RELATIONSHIP_CATEGORIES) {
    if (c.patterns.some(p => r.includes(p))) return c;
  }
  return { key:"other", label:"\ud83d\udcce Other" };
}

function RelationshipIndex({memories, peopleRelationships, onView, onRenameRelationship}) {
  const [search, setSearch] = React.useState("");
  // Paths in `expanded` are shown; default all collapsed so the user gets a
  // tidy category-level overview matching the Locations tree's behaviour.
  const [expanded, setExpanded] = React.useState(() => new Set());
  function toggle(path) {
    setExpanded(prev => { const n = new Set(prev); if (n.has(path)) n.delete(path); else n.add(path); return n; });
  }
  const allRels=[...new Set(Object.values(peopleRelationships).map(r=>(r||"").trim()).filter(Boolean))].sort();
  if(allRels.length===0) return React.createElement("p",{style:{color:"#7a6a58",fontStyle:"italic"}},"No relationships tagged yet.");
  const q = search.trim().toLowerCase();

  // Filter relationships, keeping the ones whose name OR people match the search
  const peopleByRel = {};
  for (const rel of allRels) peopleByRel[rel] = Object.entries(peopleRelationships).filter(([,r])=>(r||"").trim()===rel).map(([n])=>n);
  const filtered = q
    ? allRels.filter(rel => rel.toLowerCase().includes(q) || peopleByRel[rel].some(p=>p.toLowerCase().includes(q)))
    : allRels;

  // While searching, fall back to a flat list for predictable results
  if (q) {
    return React.createElement("div",null,
      React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:"12px",gap:"12px"}},
        React.createElement("p",{style:{fontSize:"0.8rem",color:"#7a6a58",fontStyle:"italic",margin:0}},allRels.length+" relationship type"+(allRels.length===1?"":"s")+" \u00b7 click a name to see memories \u00b7 rename to merge types"),
      ),
      React.createElement("input",{value:search,onChange:e=>setSearch(e.target.value),placeholder:"Search relationships or people\u2026",style:{...S.input,marginBottom:"14px",padding:"7px 11px",fontSize:"0.88rem"}}),
      filtered.length===0&&React.createElement("p",{style:{color:"#7a6a58",fontStyle:"italic"}},"No matches."),
      filtered.map(rel=>{
        const people = peopleByRel[rel];
        const mc=memories.filter(m=>m.people?.some(p=>people.includes(p))).length;
        return React.createElement(RelationshipRow,{key:rel,rel,people,memCount:mc,onView,onRename:onRenameRelationship});
      })
    );
  }

  // Tree mode: bucket each relationship into its category, then render
  // category → relationship type → people.
  const buckets = {};
  for (const rel of allRels) {
    const cat = categoriseRelationship(rel);
    if (!buckets[cat.key]) buckets[cat.key] = { label: cat.label, rels: [] };
    buckets[cat.key].rels.push(rel);

  const ORDER = ["family","friends","work","education","care","community","other"];
  const orderedKeys = ORDER.filter(k => buckets[k]);

  return React.createElement("div",null,
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:"12px",gap:"12px"}},
      React.createElement("p",{style:{fontSize:"0.8rem",color:"#7a6a58",fontStyle:"italic",margin:0}},allRels.length+" relationship type"+(allRels.length===1?"":"s")+" \u00b7 click a name to see memories \u00b7 rename to merge types"),
    ),
    React.createElement("input",{value:search,onChange:e=>setSearch(e.target.value),placeholder:"Search relationships or people\u2026",style:{...S.input,marginBottom:"14px",padding:"7px 11px",fontSize:"0.88rem"}}),
    orderedKeys.map(catKey => {
      const bucket = buckets[catKey];
      const catPath = "c:"+catKey;
      const catOpen = expanded.has(catPath);
      const catRelCount = bucket.rels.length;
      const catPeopleCount = new Set(bucket.rels.flatMap(r=>peopleByRel[r])).size;
      return React.createElement("div",{key:catKey,style:{borderBottom:"1px solid #ede4d4"}},
        React.createElement("button",{
          onClick:()=>toggle(catPath),
          style:{
            width:"100%",display:"flex",alignItems:"center",gap:"8px",
            background:"transparent",border:"none",cursor:"pointer",

          }
        },
          React.createElement("span",{style:{display:"inline-block",width:"10px",fontSize:"0.7rem",color:"#a89a7a"}}, catOpen?"\u25bc":"\u25b6"),
          React.createElement("span",null, bucket.label),
          React.createElement("span",{style:{fontSize:"0.78rem",color:"#a89a7a",fontWeight:400,marginLeft:"4px"}}, catRelCount+" type"+(catRelCount===1?"":"s")+" \u00b7 "+catPeopleCount+" people")
        ),

            return React.createElement(RelationshipRow,{key:rel,rel,people,memCount:mc,onView,onRename:onRenameRelationship});
          })

    })
  );
}

        return Object.values(node).reduce((acc,v)=>acc+countLeaves(v),0);
      }
      function collectLeaves(node) {
        if (Array.isArray(node)) return node;
        return Object.values(node).flatMap(collectLeaves);
      }

      const FIELD_LABELS = { country:"Country", state:"State / Region", town:"Town / City", street:"Street" };

      function renderEditor(depth) {
        if (!editLabels) return null;
        return React.createElement("div",{
          style:{margin:"4px 0 8px",marginLeft:((depth+1)*16)+"px",padding:"10px 12px",background:"rgba(168,136,90,0.08)",border:"1px solid rgba(168,136,90,0.3)",borderRadius:"3px"}
        },
          React.createElement("p",{style:{fontSize:"0.78rem",color:"#8a7460",fontStyle:"italic",margin:"0 0 8px"}},
            "Bulk-edit "+editLabels.size+" location"+(editLabels.size===1?"":"s")+" under this branch. A field shown as \u201c(varies)\u201d means entries already differ \u2014 type a value to set them all the same; leave it as-is to keep them per entry."
          ),
          ["country","state","town","street"].map(k => React.createElement("div",{key:k,style:{marginBottom:"6px"}},
            React.createElement("label",{style:{fontSize:"0.76rem",color:"#8a7460",display:"block",marginBottom:"2px"}}, FIELD_LABELS[k]),
            React.createElement("input",{
              value: editForm[k]||"",

            })

      }

      // Skip groups that only have a single PLACEHOLDER child — collapse them
      // so a location with just country="USA" doesn't render as
      // "USA > — > — > — > leaf". Walk down to the first branching node.
      function pruneSingleChain(node) {
        if (Array.isArray(node)) return { skipped: 0, node };
        const keys = Object.keys(node);
        if (keys.length === 1 && keys[0] === PLACEHOLDER) {
          const inner = pruneSingleChain(node[PLACEHOLDER]);
          return { skipped: inner.skipped + 1, node: inner.node };
        }
        return { skipped: 0, node };
      }

      function renderNode(node, path, depth, levelLabel) {
        // Reached the leaves
        if (Array.isArray(node)) {
          return node.map(renderLeaf);

        const keys = Object.keys(node);
        return keys.map(k => {

          const { node: child } = pruneSingleChain(childRaw);

          const isLeafGroup = Array.isArray(child);
          const displayName = k === PLACEHOLDER
            ? ({country:"(no country)", state:"(no state)", town:"(no town)", street:""}[levelLabel])
            : k;

          // already display the name and street, so the extra row is noise.
          if (k === PLACEHOLDER && levelLabel === "street") {

            React.createElement("div",{style:{display:"flex",alignItems:"center",gap:"4px",marginLeft:(depth*16)+"px"}},
              React.createElement("button",{
                onClick: () => toggle(subPath),
                style:{
                  flex:1,
                  display:"flex",alignItems:"center",gap:"6px",
                  background:"transparent",border:"none",cursor:"pointer",
                  padding:"4px 0",
                  fontFamily:"'Crimson Text',serif",color:"#5a4820",
                  textAlign:"left",
                  fontSize: depth === 0 ? "0.95rem" : "0.88rem",
                  fontWeight: depth === 0 ? 600 : 500
                }
              },
                React.createElement("span",{style:{display:"inline-block",width:"10px",fontSize:"0.7rem",color:"#a89a7a"}},
                  isOpen ? "▼" : "▶"
                ),
                React.createElement("span",null, displayName),
                React.createElement("span",{style:{fontSize:"0.78rem",color:"#a89a7a",fontWeight:400,marginLeft:"4px"}}, "("+leafCount+")")
              ),
              React.createElement("button",{
                onClick: () => openEditor(subPath, collectLeaves(childRaw)),
                title: "Bulk-edit address fields for everything in this group",
                style: { background:"transparent",border:"none",cursor:"pointer",padding:"4px 8px",fontSize:"0.84rem",color:"#a89a7a" }
              }, "\u270e Edit")
            ),
            editingPath === subPath && renderEditor(depth),
            isOpen && React.createElement("div",{style:{marginLeft:"4px"}},
              renderNode(child, subPath, depth+1, ({country:"state",state:"town",town:"street",street:null}[levelLabel]))
            )
          );
        });
      }

      return renderNode(tree, "", 0, "country");
    })()
  );
}

// ── Geocode cache (persisted in localStorage) ─────────────────
const GEOCODE_CACHE_KEY = "chronicle-geocode-cache";
;
function loadGeocodeCache() { try { return JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY)||"{}"); } catch(e) { return {}; } }
function saveGeocodeCache(cache) { try { localStorage.setItem(GEOCODE_CACHE_KEY, JSON.stringify(cache)); } catch(e) {} }

async function geocode(name, cache) {
  if (cache[name]) return cache[name];
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(name)}&format=json&limit=1`, {
      headers: { "Accept-Language": "en", "User-Agent": "Chronicle-Journal-App" }
    });
    const data = await res.json();
    if (data[0]) {
      const result = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), display: data[0].display_name };
      cache[name] = result;
      saveGeocodeCache(cache);
      return result;
    }
    cache[name] = null; saveGeocodeCache(cache); return null;
  } catch(e) { return null; }
}

// ── ShareViaLink ───────────────────────────────────────────────
function ShareViaLink({memories, senderName, senderEmail, personalMsg, deliverToEmails, deliveredToNames, allDelivered, onDone}) {
  const [status, setStatus] = useState("idle");
  const [shareUrl, setShareUrl] = useState("");
  const [shareCode, setShareCode] = useState("");
  const [shareErr, setShareErr] = useState("");
  const [copied, setCopied] = useState(false);
  const [copiedMsg, setCopiedMsg] = useState(false);

  const someDelivered = !allDelivered && deliveredToNames && deliveredToNames.length > 0;

  // Default message mode: "full" intro for unknown recipients, "code" if they likely have Chronicle
  const defaultMode = someDelivered ? "code" : "full";
  const [msgMode, setMsgMode] = useState(defaultMode);

  const CHRONICLE_INTRO = "I\u2019ve shared some memories with you using Chronicle \u2014 a free, private memory journal at remembory.net.\n\nChronicle lets you collect the story of a life: memories, photos, places, and the people in them. Everything is stored privately on your own device \u2014 nothing is uploaded to a server unless you choose to share it.\n\nWhen you open the link below, you\u2019ll be able to review the memories I\u2019ve shared, choose which ones to save, and add them to your own Chronicle \u2014 where you can add your own perspective, fill in your side of the story, and start building your own timeline.\n\nIt\u2019s free to use. No account or sign-up needed to get started.\n\n\u26a0 Please open the link in a browser (Safari, Chrome, Firefox) \u2014 opening from inside a messaging app may not work correctly:\n";
  const CODE_INSTRUCTIONS = "To add these memories to your Chronicle, open remembory.net/chronicle.html in your browser, go to the Sharing page, and enter this code:";
  function buildMessage() {
    if (msgMode === "full") return CHRONICLE_INTRO + shareUrl + (shareCode ? "\n\nAlready have Chronicle? Use the share code instead: " + shareCode : "");
    if (msgMode === "code") return CODE_INSTRUCTIONS + "\n\n" + shareCode;
    return shareUrl;
  }
  function copyMessage() {
    navigator.clipboard.writeText(buildMessage()).then(()=>{ setCopiedMsg(true); setTimeout(()=>setCopiedMsg(false),2500); });
  }

  useEffect(()=>{ generate(); }, []);

  async function generate() {
    setStatus("loading");
    try {
      // Strip the sender's own subject name from people arrays before sharing
      // so the recipient doesn't see "My Chronicle" or similar as a tagged person.
      // Also resolve any mediaId blob references to embedded data: URLs so the
      // recipient receives the actual photo data, not just a local IDB key.
      const sanitisedMemories = await Promise.all(memories.map(async (m, mi) => {
        const mediaUrls = await Promise.all((m.mediaUrls||[]).slice(0,3).map(async (med) => {
          if (med.mediaId) {
            try {
              const blob = await idbGet(med.mediaId);
              if (blob) {
                const dataUrl = await resizeImageBlob(blob, 1200);
                return {url:dataUrl, name:med.name};
              }
            } catch(e) {}
          }
          if (med.url && med.url.startsWith("data:")) return {url:med.url, name:med.name};
          return null;
        }));
        return { ...m, people: (m.people||[]).filter(p => p !== senderName.trim()), mediaUrls: mediaUrls.filter(Boolean) };
      }));
      const payload = {
        sharedBy: senderName.trim(),
        sharedByEmail: senderEmail||"",
        message: personalMsg||"",
        requestConnect: true,
        memories: sanitisedMemories
      };
      const res = await fetch(WORKER_URL + "/share", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Server error " + res.status);
      const data = await res.json();
      setShareUrl(data.url);
      setShareCode(data.code || "");
      setStatus("done");
      // Deliver directly to connected recipients who have an email on file
      if (data.code && deliverToEmails && deliverToEmails.length > 0) {
        deliverToEmails.forEach(email => {
          fetch(WORKER_URL + "/share/deliver", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({shareId:data.code,toEmail:email,fromName:senderName.trim(),fromEmail:senderEmail||""})
          }).catch(()=>{});
        });
      }
    } catch(e) {
      setStatus("error");
      setShareErr(e.message || String(e));
      console.error(e);
    }
  }

  function copy() {
    navigator.clipboard.writeText(shareUrl).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2500); });
  }

  if (status==="loading") return React.createElement("p",{style:{color:"#8a7460",fontStyle:"italic",padding:"16px 0",textAlign:"center"}},"Generating link…");

  if (status==="error") return React.createElement("div",null,
    React.createElement("p",{style:{color:"#c4858a",fontSize:"0.9rem",marginBottom:"10px"}},"Couldn’t reach the share server. Check your connection."),
    shareErr ? React.createElement("p",{style:{color:"#8a7460",fontSize:"0.78rem",fontStyle:"italic",marginBottom:"10px",wordBreak:"break-all"}},shareErr) : null,
    React.createElement("button",{onClick:generate,style:{...S.btnOutline,color:"#7a9e8a",borderColor:"#7a9e8a"}},"Retry"),
    React.createElement("button",{onClick:onDone,style:{...S.btnOutline,marginLeft:"8px",color:"#8a7460",borderColor:"#c8b89a"}},"Cancel")
  );


  if (status==="done") {
    // ── All-delivered confirmation (no copy needed) ──────────────────────────
    if (allDelivered) return React.createElement("div",null,
      React.createElement("div",{style:{background:"rgba(74,122,90,0.08)",border:"1px solid rgba(74,122,90,0.3)",borderRadius:"4px",padding:"16px 18px",marginBottom:"12px"}},
        React.createElement("p",{style:{fontSize:"0.92rem",color:"#2a5a3a",fontWeight:600,margin:"0 0 6px"}},
          "✓ Delivered to "+(deliveredToNames.length===1?deliveredToNames[0]:deliveredToNames.join(", "))
        ),
        React.createElement("p",{style:{fontSize:"0.82rem",color:"#4a7a5a",margin:0,lineHeight:1.5}},
          (memories.length===1?"This memory has":"These "+memories.length+" memories have")+" arrived in their Chronicle inbox. No link needed."
        )
      ),
      React.createElement("p",{style:{fontSize:"0.78rem",color:"#8a7460",fontStyle:"italic",margin:"0 0 12px"}},
        "If they don\u2019t see it, they can also enter code: "+shareCode+" in Sharing \u2192 Receive a Share."
      ),
      React.createElement("button",{onClick:onDone,style:{...S.btn,width:"100%"}},"Done")
    );

    // ── Partial delivery: banner + copy UI for the rest ──────────────────────
    return React.createElement("div",null,
      someDelivered&&React.createElement("div",{style:{background:"rgba(74,122,90,0.08)",border:"1px solid rgba(74,122,90,0.3)",borderRadius:"4px",padding:"10px 14px",marginBottom:"14px",fontSize:"0.84rem",color:"#2a5a3a"}},
        "✓ Sent to "+(deliveredToNames.join(", "))+" \u2014 already in their inbox."
      ),
      React.createElement("p",{style:{fontSize:"0.82rem",color:"#4a7a5a",fontWeight:600,marginBottom:"10px"}},
        someDelivered ? "Also send to everyone else:" : "Choose what to send:"
      ),
      React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:"6px",marginBottom:"12px"}},
        [
          ["full","New to Chronicle","includes app intro + link — use for first-time recipients"],
          ["link","Has Chronicle","just the share link"],
          ["code","Has Chronicle (code)","short code they enter in the Sharing page"],
        ].map(([val,label,hint])=>
          React.createElement("label",{key:val,style:{display:"flex",alignItems:"flex-start",gap:"8px",cursor:"pointer",padding:"6px 10px",borderRadius:"3px",background:msgMode===val?"rgba(122,158,138,0.1)":"transparent",border:msgMode===val?"1px solid rgba(122,158,138,0.4)":"1px solid transparent"}},
            React.createElement("input",{type:"radio",name:"msgMode",value:val,checked:msgMode===val,onChange:()=>setMsgMode(val),style:{marginTop:"3px",flexShrink:0}}),
            React.createElement("div",null,
              React.createElement("div",{style:{fontSize:"0.88rem",color:"#2c2416",lineHeight:1.4}},label),
              React.createElement("div",{style:{fontSize:"0.78rem",color:"#8a7460"}},hint)
            )
          )
        )
      ),
      React.createElement("textarea",{
        readOnly:true,
        value:buildMessage(),
        onClick:e=>e.target.select(),
        rows: msgMode==="full" ? 8 : 3,
        style:{...S.input,width:"100%",fontSize:"0.82rem",color:"#2c2416",lineHeight:1.6,resize:"none",boxSizing:"border-box",fontFamily:"inherit",whiteSpace:"pre-wrap",marginBottom:"10px"}
      }),
      React.createElement("button",{onClick:copyMessage,style:{...S.btn,width:"100%",marginBottom:"8px",fontSize:"0.88rem"}},
        copiedMsg ? "✓ Copied!" : "Copy message"
      ),
      React.createElement("p",{style:{fontSize:"0.78rem",color:"#8a7460",fontStyle:"italic",margin:"0"}},
        "Link expires in 30 days and is deleted once the recipient saves it."
      ),
      React.createElement("button",{onClick:onDone,style:{...S.btnOutline,marginTop:"12px",color:"#8a7460",borderColor:"#c8b89a",width:"100%"}},"Done")
    );
  }

  return null;
}

// ── ShareButton component ──────────────────────────────────────
function ShareButton({memory, peopleEmails, memories, ownerName, ownerEmail, shareHistory, localConnections, onRecordShare, onSaveEmails, onSetSenderEmail, userTier, onShareUsed}) {
  const [open, setOpen] = useState(false);
  const [step, setStep] = useState("compose");
  const [senderName, setSenderName] = useState(ownerName||"");
  const [selectedPeople, setSelectedPeople] = useState([]);
  const [selectedMemIds, setSelectedMemIds] = useState(new Set([memory.id]));
  const [personalMsg, setPersonalMsg] = useState("");
  const [msgError, setMsgError] = useState("");
  const [emailInputs, setEmailInputs] = useState({}); // {personName: emailString} for ad-hoc emails
  const [selectedPhotos, setSelectedPhotos] = useState({}); // {memId: Set of mediaId indices to include}
  const [sendStatus, setSendStatus] = useState("idle"); // idle | sending | sent | error
  const [sendError, setSendError] = useState("");

  useEffect(()=>{ if(ownerName && !senderName) setSenderName(ownerName); }, [ownerName]);

  const effectiveEmail = ownerEmail || "";
  const allMems = memories || [];

  // Resolve email for a person from either the per-subject email map or localConnections
  function emailFor(p) {
    return (peopleEmails||{})[p] || (localConnections||[]).find(c=>c.name===p)?.email || "";
  }
  // Classify a recipient: connected Chronicle user, or just a name
  function recipientType(p) {
    const isConn = (localConnections||[]).some(c=>c.name===p);
    const hasEmail = !!emailFor(p);
    if (isConn && hasEmail) return "connected_email";
    if (isConn) return "connected_no_email";
    if (hasEmail) return "has_email";
    return "name_only";
  }

  // Only people tagged in the current memory are offered as recipients
  const allPeople = [...new Set(memory.people||[])].sort();

  // Memories shown in checklist: only those that include ALL selected recipients
  // When nobody selected yet, show only the current memory
  const eligibleMems = selectedPeople.length === 0
    ? allMems.filter(m => m.id === memory.id)
    : allMems.filter(m => selectedPeople.every(p=>(m.people||[]).includes(p)));

  function togglePerson(person) {
    setSelectedPeople(prev => {
      const next = prev.includes(person) ? prev.filter(p=>p!==person) : [...prev, person];
      // Re-seed selected memories to those eligible for the new recipient set
      // Always keep current memory selected if it qualifies
      const eligible = next.length === 0
        ? allMems.filter(m => m.id === memory.id)
        : allMems.filter(m => next.every(p=>(m.people||[]).includes(p)));
      const eligibleIds = new Set(eligible.map(m=>m.id));
      setSelectedMemIds(eligibleIds.has(memory.id) ? new Set([memory.id]) : new Set(eligible.map(m=>m.id)));
      return next;
    });
  }

  function toggleMem(id) {
    setSelectedMemIds(prev => { const next = new Set(prev); next.has(id) ? next.delete(id) : next.add(id); return next; });
  }

  function effectiveEmailFor(p) {
    return emailFor(p) || (emailInputs[p]||"").trim();
  }

  function handleGetLink() {
    if (!senderName.trim()) { alert("Please enter your name first."); return; }
    setMsgError("");
    if (onRecordShare && selectedPeople.length) onRecordShare(selectedPeople, selectedMemIds);
    setStep("link");
  }

  async function handleSend() {
    if (!senderName.trim()) { alert("Please enter your name first."); return; }
    // Free tier cannot share
    if (!userTier || userTier === "free") { setSendError("Sharing requires a subscription."); setSendStatus("error"); return; }
    // Basic tier: 3 shares per day
    if (userTier === "basic") {

      // Sanitise: resize first photo to data URL, strip sender from people
      const sanitised = await Promise.all(toShare.map(async (m) => {
        const photos = m.mediaUrls||[];

              }
