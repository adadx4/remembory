// ── PerspectivesPanel ──────────────────────────────────────────
function PerspectivesPanel({memory, onSave, peopleEmails, senderName, ownerName=""}) {
  const perspectives = memory.perspectives || [];
  const [showAll, setShowAll] = useState(true);
  const [addingMine, setAddingMine] = useState(false);
  const [myDraft, setMyDraft] = useState("");
  const [myName, setMyName] = useState(ownerName||"");
  const [makeDominant, setMakeDominant] = useState(true);
  const myPerspective = perspectives.find(p=>p.isOwn);

  // Who is currently dominant? Stored as memory.dominantAuthor — null means OP (memory.content from before sharing)
  const dominantAuthor = memory.dominantAuthor || null;
  const otherPerspectives = perspectives.filter(p=>!p.isOwn);

  function setDominant(author) {
    // Swap: put chosen perspective's content into memory.content, demote current dominant back into perspectives
    const chosen = perspectives.find(p=>p.author===author);
    if (!chosen) return;
    onSave({...memory, content: chosen.content, dominantAuthor: author});
  }

  function clearDominant() {
    // Revert to no dominant (original content, if any)
    onSave({...memory, dominantAuthor: null});
  }

  function saveMine() {
    if (!myDraft.trim()) return;
    const newP = {author:myName.trim()||"Me", content:myDraft.trim(), addedAt:new Date().toISOString(), isOwn:true};
    const updatedPerspectives = [...perspectives.filter(p=>!p.isOwn), newP];
    // If making dominant: set content to this perspective's text
    const updatedMemory = makeDominant
      ? {...memory, perspectives:updatedPerspectives, content:newP.content, dominantAuthor:newP.author}
      : {...memory, perspectives:updatedPerspectives};
    onSave(updatedMemory);
    setAddingMine(false);

  }

  function removeMine() {
    if (!window.confirm("Remove your perspective from this memory?")) return;
    const updatedPerspectives = perspectives.filter(p=>!p.isOwn);
    // If mine was dominant, revert
    const wasDominant = dominantAuthor === myPerspective?.author;
    onSave({...memory, perspectives:updatedPerspectives, dominantAuthor: wasDominant ? null : dominantAuthor});
  }

  const others = showAll ? otherPerspectives.filter(p=>p.author!==dominantAuthor) : [];

  const [editingAuthor, setEditingAuthor] = useState(null);
  const [editDraft, setEditDraft] = useState("");
  const [keepOriginal, setKeepOriginal] = useState(true);

  function startEditOther(p) {
    setEditingAuthor(p.author);
    setEditDraft(p.content);
    setKeepOriginal(true);
  }

  function saveEditOther() {
    if (!editDraft.trim()) return;
    const updated = perspectives.map(p => {
      if (p.author !== editingAuthor) return p;
      const base = {...p, content: editDraft.trim(), editedAt: new Date().toISOString()};
      if (keepOriginal && p.content !== editDraft.trim()) {
        base.originalContent = p.originalContent || p.content;
      } else if (!keepOriginal) {
        delete base.originalContent;
      }
      return base;
    });
    const wasDominant = dominantAuthor === editingAuthor;
    const updatedMemory = wasDominant
      ? {...memory, perspectives: updated, content: editDraft.trim()}
      : {...memory, perspectives: updated};
    onSave(updatedMemory);
    setEditingAuthor(null);
  }

  function removeOther(author) {
    if (!window.confirm("Remove this perspective? This cannot be undone.")) return;
    const updated = perspectives.filter(p => p.author !== author);
    const wasDominant = dominantAuthor === author;
    onSave({...memory, perspectives: updated, dominantAuthor: wasDominant ? null : dominantAuthor});
  }

  function PerspectiveBlock({p, isMine}) {
    const isDominant = dominantAuthor === p.author;
    const borderColor = isMine ? "#7a9e8a" : "#8b9dc3";
    const bgColor = isMine ? "rgba(122,158,138,0.07)" : "rgba(139,157,195,0.07)";
    const labelColor = isMine ? "#7a9e8a" : "#8b9dc3";
    const isEditing = editingAuthor === p.author;

    return React.createElement("div", {style:{background:bgColor,borderLeft:`3px solid ${borderColor}`,borderRadius:"0 4px 4px 0",padding:"10px 14px"}},
      React.createElement("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px",flexWrap:"wrap",gap:"6px"}},
        React.createElement("div", {style:{display:"flex",alignItems:"center",gap:"8px"}},
          React.createElement("span", {style:{fontSize:"0.8rem",color:labelColor,fontWeight:600,letterSpacing:"0.05em",textTransform:"uppercase"}},
            p.author + (isMine ? "'s memory (you)" : "'s memory")
          ),
          isDominant && React.createElement("span", {style:{fontSize:"0.78rem",background:labelColor,color:"#fff",padding:"1px 7px",borderRadius:"10px",letterSpacing:"0.04em"}}, "shown in timeline"),
          p.editedAt && React.createElement("span", {style:{fontSize:"0.78rem",color:"#7a6a58",fontStyle:"italic"}}, "edited")
        ),
        React.createElement("div", {style:{display:"flex",gap:"8px",alignItems:"center"}},
          !isDominant && React.createElement("button", {
            onClick:()=>setDominant(p.author),
            style:{background:"transparent",border:`1px solid ${borderColor}`,color:labelColor,cursor:"pointer",fontSize:"0.78rem",padding:"2px 8px",borderRadius:"2px",fontFamily:"'Crimson Text',serif"}
          }, "make dominant"),
          isDominant && React.createElement("button", {
            onClick:clearDominant,
            style:{background:"transparent",border:"none",color:"#7a6a58",cursor:"pointer",fontSize:"0.78rem",fontFamily:"'Crimson Text',serif"}
          }, "remove from timeline"),
          isMine
            ? React.createElement("button", {onClick:()=>{setMyDraft(p.content);setMyName(p.author);setMakeDominant(dominantAuthor===p.author);setAddingMine(true);},style:{background:"transparent",border:"none",color:"#7a6a58",cursor:"pointer",fontSize:"0.78rem",fontFamily:"'Crimson Text',serif"}}, "edit")
            : React.createElement("button", {onClick:()=>startEditOther(p),style:{background:"transparent",border:"none",color:"#7a6a58",cursor:"pointer",fontSize:"0.78rem",fontFamily:"'Crimson Text',serif"}}, "edit"),
          isMine
            ? React.createElement("button", {onClick:removeMine,style:{background:"transparent",border:"none",color:"#c4858a",cursor:"pointer",fontSize:"0.78rem",fontFamily:"'Crimson Text',serif"}}, "remove")
            : React.createElement("button", {onClick:()=>removeOther(p.author),style:{background:"transparent",border:"none",color:"#c4858a",cursor:"pointer",fontSize:"0.78rem",fontFamily:"'Crimson Text',serif"}}, "remove")
        )
      ),
      isEditing
        ? React.createElement("div", null,
            React.createElement("textarea", {
              value: editDraft,
              onChange: e=>setEditDraft(e.target.value),
              rows: 5,
              style:{...S.input, resize:"vertical", lineHeight:"1.7", marginBottom:"10px"}
            }),
            React.createElement("label", {style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"12px",cursor:"pointer",fontSize:"0.84rem",color:"#6a5840"}},
              React.createElement("input", {type:"checkbox", checked:keepOriginal, onChange:e=>setKeepOriginal(e.target.checked)}),
              "Keep a copy of the original version"
            ),

function isInAppBrowser() {
  const ua = navigator.userAgent || "";
  if (/FBAN|FBAV|FB_IAB/i.test(ua)) return "facebook";
  if (/Instagram/i.test(ua)) return "instagram";
  if (/WhatsApp/i.test(ua)) return "whatsapp";
  if (/LinkedInApp/i.test(ua)) return "linkedin";
  if (/Snapchat/i.test(ua)) return "snapchat";
  if (/TikTok|musical_ly|Bytedance/i.test(ua)) return "tiktok";
  if (/MicroMessenger/i.test(ua)) return "wechat";
  if (/Twitter/i.test(ua)) return "twitter";
  return null;
}
 
function CloudSyncPanel({buildBackupJson, importBackup, licenceKey, onSyncComplete}) {
  const [passphrase, setPassphrase] = React.useState("");
  const [showPass, setShowPass] = React.useState(false);
  const [status, setStatus] = React.useState(""); // "", "pushing", "pulling", "done", "error:..."
  const [lastPushedAt, setLastPushedAt] = React.useState(() => {
    try { return localStorage.getItem("chronicle-sync-pushedat") || ""; } catch(e) { return ""; }
  });

  function savePushedAt(ts) {
    setLastPushedAt(ts);
    try { localStorage.setItem("chronicle-sync-pushedat", ts); } catch(e) {}
  }

  async function keyHash(licKey) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(licKey.trim().toUpperCase()));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }

  // Encrypt/decrypt binary blobs for photo sync
  async function encryptBlob(password, blob) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt);
    const buf = await blob.arrayBuffer();
    const enc = await crypto.subtle.encrypt({name:"AES-GCM",iv}, key, buf);
    // Pack: salt(16) + iv(12) + ciphertext
    const out = new Uint8Array(16 + 12 + enc.byteLength);
    out.set(salt, 0); out.set(iv, 16); out.set(new Uint8Array(enc), 28);
    return out.buffer;
  }
  async function decryptBlob(password, packed) {
    const arr = new Uint8Array(packed);
    const salt = arr.slice(0, 16);
    const iv = arr.slice(16, 28);
    const ciphertext = arr.slice(28);
    const key = await deriveKey(password, salt);
    return await crypto.subtle.decrypt({name:"AES-GCM",iv}, key, ciphertext);
  }

  async function buildSyncJson() {
    // Like buildBackupJson but strips media blobs — returns {json, mediaIds}.
    // Photos are uploaded separately to R2; the JSON only carries id+name refs.
    const full = await buildBackupJson();
    const parsed = JSON.parse(full);
    const mediaIds = new Set();
    function stripMems(mems) {
      return (mems || []).map(m => ({
        ...m, mediaUrls: (m.mediaUrls||[]).map(med => {
          if (med && med.mediaId) { mediaIds.add(med.mediaId); return {mediaId:med.mediaId,name:med.name}; }
          return med;
        })
      }));
    }
    function stripEntityPhotos(ep) {
      const out = {};
      Object.keys(ep || {}).forEach(k => {
        const v = ep[k];
        if (v && v.mediaId) { mediaIds.add(v.mediaId); out[k] = {mediaId:v.mediaId,name:v.name}; }
        else if (v) out[k] = v;
      });
      return out;
    }
    if (Array.isArray(parsed.subjects)) {
      // v3 multi-subject — strip media from each subject's memories/candidates/entityPhotos
      parsed.subjects = parsed.subjects.map(s => ({
        ...s,
        memories:   stripMems(s.memories),
        candidates: stripMems(s.candidates),
        entityPhotos: stripEntityPhotos(s.entityPhotos),
      }));
    } else {
      // Legacy v2 fallback (in case buildBackupJson regresses or a caller passes v2 data)
      if (parsed.memories) parsed.memories = stripMems(parsed.memories);
      if (parsed.entityPhotos) parsed.entityPhotos = stripEntityPhotos(parsed.entityPhotos);
    }
    return { json: JSON.stringify(parsed), mediaIds: [...mediaIds] };
  }

  async function push() {
    if (!passphrase.trim()) { setStatus("error:Enter a sync passphrase first."); return; }
    if (!licenceKey) { setStatus("error:A licence key is required for cloud sync."); return; }
    setStatus("pushing");
    try {
      const { json, mediaIds } = await buildSyncJson();
      const encrypted = await encryptData(passphrase, json);
      const hash = await keyHash(licenceKey);
      // 1. Push metadata
      const res = await fetch(WORKER_URL + "/sync/push", {
        method: "POST",
        headers: {"Content-Type":"application/json","X-Chronicle-Client":"1"},
        body: JSON.stringify({keyHash: hash, ...encrypted, mediaIds, ...(lastPushedAt ? {knownPushedAt: lastPushedAt} : {})}),
      });
      if (res.status === 409) { setStatus("error:Another device pushed more recently — pull first to avoid overwriting it, then push again."); return; }
      if (!res.ok) { const e=await res.json().catch(()=>({})); setStatus("error:"+(e.error||res.status)); return; }
      const pushResult = await res.json().catch(()=>({}));
      if (pushResult.pushedAt) savePushedAt(pushResult.pushedAt);
      if (onSyncComplete) onSyncComplete("push");
      // 2. Upload photos to R2 (skip ones already there)
      if (mediaIds.length > 0) {
        setStatus("checking photos...");
        let toUpload = mediaIds;
        try {
          const checkRes = await fetch(WORKER_URL + "/sync/media/check/" + hash, {
            method:"POST", headers:{"Content-Type":"application/json","X-LS-Key":licenceKey},
            body:JSON.stringify({mediaIds})
          });
          if (checkRes.ok) {
            const {existing} = await checkRes.json();
            toUpload = mediaIds.filter(id => !existing.includes(id));
          }
        } catch(e) {}
        if (toUpload.length > 0) {
          setStatus("pushing "+toUpload.length+" photo"+(toUpload.length===1?"":"s")+"...");
          let uploaded = 0, failed = 0;
          const allMedia = await idbGetAll();
          for (const mediaId of toUpload) {
            const blob = allMedia[mediaId];
            if (!blob) { uploaded++; failed++; continue; }
            try {
              const encBuf = await encryptBlob(passphrase, blob);
              const pr = await fetch(WORKER_URL + "/sync/media/" + hash + "/" + encodeURIComponent(mediaId), {
                method: "PUT",
                headers: {"Content-Type":"application/octet-stream","X-Chronicle-Client":"1","X-LS-Key":licenceKey},
                body: encBuf,
              });
              if (!pr.ok) failed++;
            } catch(e) { failed++; }
            uploaded++;
            setStatus("pushing photos ("+uploaded+"/"+toUpload.length+(failed?" \u00b7 "+failed+" failed":"") +")");
          }
        } else if (mediaIds.length > 0) {
          setStatus("photos up to date");
          await new Promise(r=>setTimeout(r,1000));
        }
      }
      setStatus("done");
      setTimeout(()=>setStatus(""),3000);
    } catch(e) { setStatus("error:"+e.message); }
  }

  async function clearCloud() {
    if (!licenceKey) { setStatus("error:A licence key is required for cloud sync."); return; }
    const ok = window.confirm(
      "Wipe all cloud sync data for this licence key?\n\n" +
      "This permanently deletes the encrypted blob and photos stored in the cloud. " +
      "Your local memories on this device are NOT affected.\n\n" +
      "Use this when you've lost your sync passphrase and need to start fresh. " +
      "After clearing, set a new passphrase and push from the device that has the data you want to keep."
    );
    if (!ok) return;
    setStatus("clearing");
    try {
      const hash = await keyHash(licenceKey);
      const res = await fetch(WORKER_URL + "/sync/" + hash, {
        method: "DELETE",
        headers: {"X-Chronicle-Client":"1","X-LS-Key":licenceKey},
      });
      if (!res.ok) { const e=await res.json().catch(()=>({})); setStatus("error:"+(e.error||res.status)); return; }
      savePushedAt("");
      setStatus("cleared");
      setTimeout(()=>setStatus(""),3000);
    } catch(e) { setStatus("error:"+e.message); }
  }

  async function pull() {
    if (!passphrase.trim()) { setStatus("error:Enter your sync passphrase first."); return; }
    if (!licenceKey) { setStatus("error:A licence key is required for cloud sync."); return; }
    setStatus("pulling");
    try {
      const hash = await keyHash(licenceKey);
      const res = await fetch(WORKER_URL + "/sync/pull/" + hash, {headers:{"X-Chronicle-Client":"1"}});
      if (res.status === 404) { setStatus("error:No sync data found. Push from your other device first."); return; }
      if (!res.ok) { const e=await res.json().catch(()=>({})); setStatus("error:"+(e.error||res.status)); return; }
      const stored = await res.json();
      const plain = await decryptData(passphrase, stored);
      if (!plain) { setStatus("error:Wrong passphrase — could not decrypt."); return; }
      if (stored.pushedAt) savePushedAt(stored.pushedAt);
      // 1. Import metadata
      const fakeEvt = {target:{files:[new File([plain],"chronicle-sync.json",{type:"application/json"})]}};
      importBackup(fakeEvt);
      // 2. Download photos from R2
      const mediaIds = stored.mediaIds || [];
      if (mediaIds.length > 0) {
        let toDownload = mediaIds.filter(async id => !(await idbGet(id)));
        // Check which ones we already have
        const haveLocally = [];
        for (const id of mediaIds) {
          const ex = await idbGet(id);
          if (ex) haveLocally.push(id);
        }
        toDownload = mediaIds.filter(id => !haveLocally.includes(id));
        if (toDownload.length > 0) {
          setStatus("pulling "+toDownload.length+" photo"+(toDownload.length===1?"":"s")+"...");
          let downloaded = 0, failed = 0;
          for (const mediaId of toDownload) {
            try {
              const mr = await fetch(WORKER_URL + "/sync/media/" + hash + "/" + encodeURIComponent(mediaId), {headers:{"X-Chronicle-Client":"1"}});
              if (mr.ok) {
                const encBuf = await mr.arrayBuffer();
                const decBuf = await decryptBlob(passphrase, encBuf);
                await idbPut(mediaId, new Blob([decBuf]));
              } else { failed++; }
            } catch(e) { failed++; }
            downloaded++;
            setStatus("pulling photos ("+downloaded+"/"+toDownload.length+(failed?" \u00b7 "+failed+" failed":"")+")");
          }
        }
      }
      if (onSyncComplete) onSyncComplete("pull");
      setStatus("done");
      setTimeout(()=>setStatus(""),3000);
    } catch(e) { setStatus("error:"+e.message); }
  }

  const isErr = status.startsWith("error:");
  const errMsg = isErr ? status.slice(6) : "";

  return React.createElement("div",null,
    React.createElement("p",{style:{fontSize:"0.82rem",color:"#8a7460",margin:"0 0 4px",lineHeight:1.6}},
      "Your memories are encrypted with your passphrase before leaving your device. We never see them in readable form."),
    React.createElement("p",{style:{fontSize:"0.78rem",color:"#a8885a",fontStyle:"italic",margin:"0 0 12px"}},
      "Use the same passphrase on all your devices."),
    React.createElement("div",{style:{position:"relative",marginBottom:"12px"}},
      React.createElement("input",{
        type:showPass?"text":"password",
        value:passphrase,
        onChange:e=>setPassphrase(e.target.value),
        placeholder:"Sync passphrase",
        style:{...S.input,paddingRight:"60px"}
      }),
      React.createElement("button",{
        onClick:()=>setShowPass(s=>!s),
        style:{position:"absolute",right:"8px",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#8a7460",cursor:"pointer",fontSize:"0.78rem"}
      },showPass?"Hide":"Show")
    ),
    React.createElement("div",{style:{display:"flex",gap:"8px",marginBottom:"8px"}},
      React.createElement("button",{
        onClick:push,
        disabled:status==="pushing"||status==="pulling"||status==="clearing",
        style:{...S.btn,flex:1,opacity:(status==="pushing"||status==="pulling"||status==="clearing")?0.6:1}
      },status==="pushing"?"Pushing\u2026":"Push to cloud"),
      React.createElement("button",{
        onClick:pull,
        disabled:status==="pushing"||status==="pulling"||status==="clearing",
        style:{...S.btnOutline,flex:1,opacity:(status==="pushing"||status==="pulling"||status==="clearing")?0.6:1}
      },status==="pulling"?"Pulling\u2026":"Pull from cloud")
    ),
    React.createElement("div",{style:{marginBottom:"8px"}},
      React.createElement("button",{
        onClick:clearCloud,
        disabled:status==="pushing"||status==="pulling"||status==="clearing",
        style:{background:"none",border:"none",color:"#a8885a",cursor:"pointer",fontSize:"0.78rem",fontFamily:"'Crimson Text',serif",textDecoration:"underline",padding:0,opacity:(status==="pushing"||status==="pulling"||status==="clearing")?0.6:1}
      },status==="clearing"?"Clearing\u2026":"Lost passphrase? Clear cloud data and start fresh")
    ),
    // Progress indicator
    (status.startsWith("pushing")||status.startsWith("pulling"))&&(()=>{
      const match=status.match(/\((\d+)\/(\d+)\)/);
      const label=status.startsWith("pushing")?"Pushing":"Pulling";
      if(match){

            React.createElement("span",null,label+" photos\u2026"),React.createElement("span",null,cur+"/"+tot)),
          React.createElement("div",{style:{height:"6px",background:"#e0d4be",borderRadius:"3px",overflow:"hidden"}},
            React.createElement("div",{style:{height:"100%",width:pct+"%",background:"#4a7a5a",borderRadius:"3px",transition:"width 0.3s"}}))

      }
      return React.createElement("p",{style:{fontSize:"0.82rem",color:"#8a7460",fontStyle:"italic"}},label+"\u2026");
    })(),
    status==="done"&&React.createElement("p",{style:{fontSize:"0.82rem",color:"#4a7a5a",fontStyle:"italic"}},"\u2713 Done"),
    status==="cleared"&&React.createElement("p",{style:{fontSize:"0.82rem",color:"#4a7a5a",fontStyle:"italic"}},"\u2713 Cloud cleared. Set a passphrase above and push from the device with the data you want to keep."),

// ── SharingView ───────────────────────────────────────────────
function SharingView({memories, shareHistory, ownerName, shareCodeInput, setShareCodeInput,
  shareCodeStatus, importFromCode, setView, setSelected, ownerEmail, licenceKey, emailVerifyToken,
  subject, isCarerMode, acceptShare, setPendingConnectRequest, onShareBadgeCount,
  contributionLinks, persistSubject}) {

  const isLegacyMode = subject && !subject.isSelf;
  const [tab, setTab] = React.useState(isLegacyMode ? "contributions" : "inbox");

  // Contribution link creation state
  const [linkNote, setLinkNote] = React.useState("");
  const [linkBusy, setLinkBusy] = React.useState(false);
  const [linkCopied, setLinkCopied] = React.useState(null); // code that was just copied
  const [pendingDeliveries, setPendingDeliveries] = React.useState([]);
  const [inboxItems, setInboxItems] = React.useState([]);
  const [serverDeclined, setServerDeclined] = React.useState([]);
  const [inboxError, setInboxError] = React.useState("");

  // Inline review state (replaces the App-level modal)
  const [reviewing, setReviewing] = React.useState(null); // {delivery, memIdx}
  const [editDraft, setEditDraft] = React.useState(null); // {title, content, addedByName}
  const [declined, setDeclined] = React.useState(new Set()); // set of "deliveryIdx:memIdx"

  React.useEffect(() => {
    if (!ownerEmail) return;
    if (isLegacyMode) {
      fetch(WORKER_URL + "/my/deliveries/fetch", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email:ownerEmail})
      }).then(r=>r.ok?r.json():{deliveries:[]})
        .then(d=>{
          if (d.deliveries && d.deliveries.length) {
            setPendingDeliveries(d.deliveries);
            if (onShareBadgeCount) onShareBadgeCount(d.deliveries.reduce((n,del)=>(n+(del.memories||[]).length),0));
          }
        })
        .catch(()=>{});
    } else {
      (async()=>{
        let d = {inbox:[],declined:[]};
        let errMsg = "";
        try {
          const headers = {"Content-Type":"application/json"};
          if (licenceKey) headers["X-LS-Key"] = licenceKey;
          const bodyObj = {email:ownerEmail};
          if (emailVerifyToken) bodyObj.verifyToken = emailVerifyToken;
          const r = await fetch(WORKER_URL + "/share/inbox/fetch", {
            method:"POST", headers, body:JSON.stringify(bodyObj)
          });
          if (r.ok) {
            d = await r.json();
          } else if (r.status === 403) {
            errMsg = emailVerifyToken
              ? "Your email verification has expired or doesn't match the current address. Re-verify in Settings to see shared memories."
              : "Verify your email in Settings to see memories shared with you.";
          } else {
            errMsg = "Couldn't load your inbox (server returned " + r.status + "). Try again shortly.";
          }
        } catch(e) {
          errMsg = "Couldn't reach the server. Check your connection and try again.";
        }
        const items = d.inbox || [];
        const dec = d.declined || [];
        const activeCount = items.filter(item=>!dec.some(dc=>dc.shareId===item._shareId)).length;
        setInboxItems(items);
        setServerDeclined(dec);
        setInboxError(errMsg);
        if (onShareBadgeCount) onShareBadgeCount(activeCount);
      })();
    }
  }, [ownerEmail, emailVerifyToken, licenceKey]);

  const received = memories.filter(m => m.sharedBy);
  const sent = shareHistory || [];
  const sentMemoryCount = new Set(sent.flatMap(h => h.memIds || [])).size;
  const sentPeopleCount = new Set(sent.flatMap(h => h.people || [])).size;
  const pendingMemCount = pendingDeliveries.reduce((n,d)=>(n+(d.memories||[]).length),0);
  const activeInboxItems = inboxItems.filter(item => !serverDeclined.some(dc => dc.shareId === item._shareId));
  const activeInboxCount = activeInboxItems.length;

  // Keep badge count in sync whenever items change (accept/decline/review)
  React.useEffect(() => {
    if (onShareBadgeCount) onShareBadgeCount(isLegacyMode ? pendingMemCount : activeInboxCount);
  }, [pendingMemCount, activeInboxCount]);

  // Inbox helpers
  async function respondToShare(shareId, action) {
    try {
      await fetch(WORKER_URL + "/share/inbox/respond", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email:ownerEmail, shareId, action})
      });
    } catch(e) {}
  }
  function acceptInboxItem(item) {
    acceptShare({sharedBy:item.sharedBy||item.fromName||"Someone", sharedAt:item.sentAt||new Date().toISOString(), memories:item.memories||[], _shareId:item._shareId});
    respondToShare(item._shareId, "accept");
    setInboxItems(prev => prev.filter(i => i._shareId !== item._shareId));
    if (onShareBadgeCount) onShareBadgeCount(Math.max(0, activeInboxCount - 1));
  }
  function declineInboxItem(item) {
    respondToShare(item._shareId, "decline");
    setServerDeclined(prev => [...prev, {shareId:item._shareId, declinedAt:new Date().toISOString(), memIds:(item.memories||[]).map(m=>m.id)}]);
    if (onShareBadgeCount) onShareBadgeCount(Math.max(0, activeInboxCount - 1));
  }
  function reconsiderItem(shareId) {
    setServerDeclined(prev => prev.filter(d => d.shareId !== shareId));
    if (onShareBadgeCount) onShareBadgeCount(activeInboxCount + 1);
  }

  // Group sent by recipient person
  const byPerson = {};
  sent.forEach(h => {
    (h.people || []).forEach(p => {
      if (!byPerson[p]) byPerson[p] = [];
      byPerson[p].push(h);
    });
  });

  // Duplicate detection: does a memory in the chronicle closely match this incoming one?
  function isDuplicate(m) {
    return memories.some(existing =>
      existing.year === m.year &&
      existing.title.toLowerCase().trim() === (m.title||"").toLowerCase().trim()

  }

  // Accept a single memory from a delivery
  function acceptOne(delivery, mem, overrides={}) {
    const finalMem = {...mem, ...overrides};
    acceptShare({...delivery, memories:[finalMem]});
  }

  async function createContributionLink() {
    if (!ownerEmail) return;
    setLinkBusy(true);
    try {
      const r = await fetch(WORKER_URL + "/contribute/create", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          ownerEmail, subjectName: subject?.name || ownerName,
          subjectId: subject?.id || "", note: linkNote.trim(),

          subjectName: subject?.name || ownerName, createdAt: new Date().toISOString() };
        persistSubject({ contributionLinks: [...(contributionLinks||[]), newLink] });
        setLinkNote("");

        setLinkCopied(d.code);

      }
    } catch {}
    setLinkBusy(false);
  }

  function revokeContributionLink(code) {
    persistSubject({ contributionLinks: (contributionLinks||[]).filter(l=>l.code!==code) });
  }

  const cardStyle = {background:"rgba(255,252,245,0.7)",border:"1px solid #d4c4a8",borderRadius:"3px",padding:"16px 20px",marginBottom:"14px"};
  const tabActive  = {padding:"8px 18px",border:"none",background:"transparent",cursor:"pointer",fontFamily:"'Crimson Text',serif",fontSize:"0.95rem",marginBottom:"-2px",borderBottom:"2px solid #2c2416",color:"#1a1208",fontWeight:600,position:"relative"};
  const tabInactive = {...tabActive,borderBottom:"2px solid transparent",color:"#8a7460",fontWeight:400};

  // ── Inline edit/review panel ──
  function ReviewPanel({delivery, mem, memKey, onDone}) {
    const dup = isDuplicate(mem);
    const [draft, setDraft] = React.useState({title:mem.title||"", content:mem.content||"", addedByName:mem.addedBy?.name||(delivery.sharedBy||"")});
    return React.createElement("div",{style:{background:"rgba(122,158,138,0.07)",border:"1px solid #7a9e8a",borderRadius:"4px",padding:"16px",marginTop:"8px"}},
      dup&&React.createElement("div",{style:{background:"rgba(196,133,90,0.12)",border:"1px solid rgba(196,133,90,0.4)",borderRadius:"3px",padding:"8px 12px",marginBottom:"12px",fontSize:"0.82rem",color:"#7a4a18"}},

// ── Shared (intertwined) timeline ─────────────────────────────────────────
// Map a freeform relationship label onto a small set of categories so each
// category can take its own colour on the Shared Timeline. The order matters:
// e.g. "grandfather" must hit the grandparent rule before the parent rule.
function relationshipCategory(rel) {
  if (!rel) return "other";
  const r = String(rel).toLowerCase();
  if (r.includes("in-law") || r.includes("in law")) return "in-law";
  if (/grandfather|grandmother|grandparent|grandpa|grandma|granddad|nan\b|nana|gran\b/.test(r)) return "grandparent";
  if (/grandson|granddaughter|grandchild/.test(r))                                              return "grandchild";
  if (/father|mother|dad\b|mum|mom|papa|mama|parent/.test(r))                                   return "parent";
  if (/brother|sister|sibling/.test(r))                                                         return "sibling";
  if (/husband|wife|spouse|partner/.test(r))                                                    return "spouse";
  if (/son\b|daughter|child/.test(r))                                                           return "child";
  if (/uncle|aunt/.test(r))                                                                     return "aunt-uncle";
  if (/nephew|niece/.test(r))                                                                   return "niece-nephew";
  if (/cousin/.test(r))                                                                         return "cousin";
  return "other";
}

const RELATIONSHIP_COLORS = {
  parent:         "#7a9e8a",
  sibling:        "#8a6a9a",
  spouse:         "#c4858a",
  child:          "#5a8a9a",
  grandparent:    "#9a7a5a",
  grandchild:     "#8a9a5a",
  "aunt-uncle":   "#9a8a6a",
  "niece-nephew": "#6a8a6a",
  cousin:         "#6a7a9a",
  "in-law":       "#b09080",
  other:          "#8a7460",
};
const RELATIONSHIP_CATEGORY_LABEL = {
  parent: "parents", sibling: "siblings", spouse: "spouse", child: "children",
  grandparent: "grandparents", grandchild: "grandchildren",
  "aunt-uncle": "aunts & uncles", "niece-nephew": "nieces & nephews",
  cousin: "cousins", "in-law": "in-laws", other: "other relatives",
};

function SharedTimelineView({ memories, subjectName, dobYear, setSelected, setView }) {
  // Subject's age at a given event year. Returns null if dob unknown or age would be negative.
  const ageAt = (yr) => (dobYear && yr && yr >= dobYear) ? yr - dobYear : null;
  const ownMems = memories.filter(m => !m.gedcomContext);
  const ctxMems = memories.filter(m =>  m.gedcomContext);

  // Build relative list: name → relationship (extracted from title "[Rel]")
  const relMap = {};
  ctxMems.forEach(m => {
    const name = m.people?.[0];
    if (!name || relMap[name] !== undefined) return;
    relMap[name] = m.title.match(/\[([^\]]+)\]/)?.[1] || "";
  });
  const relatives = Object.entries(relMap); // [[name, rel], ...]

  // Each person gets the colour of their relationship CATEGORY (so all parents share
  // the same colour, all cousins share another, etc.). Subject keeps the gold accent.
  const SUBJECT_COLOR = "#c8a84a";
  const personColor = { [subjectName]: SUBJECT_COLOR };
  relatives.forEach(([name, rel]) => {
    personColor[name] = RELATIONSHIP_COLORS[relationshipCategory(rel)] || RELATIONSHIP_COLORS.other;
  });

  const [shown, setShown] = React.useState(() => {
    const s = new Set([subjectName]);
    relatives.forEach(([n]) => s.add(n));
    return s;
  });
  function toggle(name) {
    setShown(s => { const n = new Set(s); n.has(name) ? n.delete(name) : n.add(name); return n; });
  }

  const allEvents = [
    ...ownMems.map(m => ({ ...m, _person: subjectName })),
    ...ctxMems.map(m => ({ ...m, _person: m.people?.[0] || "" })),
  ]
    .filter(m => m._person && shown.has(m._person))
    .sort((a,b) => (a.year||0)-(b.year||0) || (a.month||1)-(b.month||1) || (a.day||1)-(b.day||1));

  const byDec = {};
  allEvents.forEach(m => {
    const dec = Math.floor((m.year||0)/10)*10;
    (byDec[dec] = byDec[dec]||[]).push(m);
  });

  const allPeople = [[subjectName,""], ...relatives];

  // Trim the year out of fuzzyDateLabel(m) so we can show date detail beside the
  // year column without repeating it. "Mar 15, 1985" → "Mar 15", "Spring 1985" → "Spring".
  function shortDate(m) {
    if (!m.fuzzy || m.fuzzy === "year" || m.fuzzy === "decade" || m.fuzzy === "uncertain") return "";
    const full = fuzzyDateLabel(m);
    if (!m.year) return full;
    return full.replace(new RegExp("[, ]?\\b" + m.year + "\\b"), "").replace(/^[\s,·]+|[\s,·]+$/g, "");
  }

  // Compose the displayed event title. For relatives' context events we surface
  // the format the user requested: "John Smith [father] Died" — name, lowercased
  // relation in brackets, capitalised verb. For the subject's own events we show
  // their stored title as-is.
  function displayTitleFor(m) {
    if (!m.gedcomContext || !m._person) return m.title;
    const esc = m._person.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    let stripped = m.title.replace(new RegExp("^" + esc + "\\s*(?:\\[[^\\]]*\\])?\\s*"), "");
    stripped = stripped ? stripped.charAt(0).toUpperCase() + stripped.slice(1) : m.title;
    const rel = (relMap[m._person] || "").toLowerCase();
    return m._person + (rel ? " [" + rel + "]" : "") + " " + stripped;
  }

  return React.createElement("div",{style:{animation:"fadeIn 0.3s ease",paddingBottom:"40px"}},
    React.createElement("h2",{style:{fontFamily:"'Playfair Display',serif",fontSize:"1.6rem",fontStyle:"italic",marginBottom:"4px",color:"#1a1208"}},"Shared Timeline"),
    React.createElement("p",{style:{fontSize:"0.82rem",color:"#8a7460",marginBottom:"16px",lineHeight:1.5}},
      "Memories of "+subjectName+" intertwined with events from close relatives. Colours indicate the type of relationship; toggle people on or off below."
    ),

    // Filter pills (per-person, coloured by relationship category)
    React.createElement("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"20px",alignItems:"center"}},
      React.createElement("span",{style:{fontSize:"0.74rem",color:"#8a7460",fontStyle:"italic",marginRight:"2px"}},"Show:"),
      allPeople.map(([name,rel])=>{
        const active = shown.has(name);
        const color  = personColor[name]||"#8a7460";
        return React.createElement("button",{
          key:name, onClick:()=>toggle(name),
          title: name===subjectName ? "" : (RELATIONSHIP_CATEGORY_LABEL[relationshipCategory(rel)] || ""),
          style:{padding:"3px 10px 3px 8px",borderRadius:"20px",border:"1px solid",cursor:"pointer",
            fontSize:"0.78rem",fontFamily:"'Crimson Text',serif",
            background:active?color+"22":"transparent",
            color:active?"#2c2416":"#8a7460",
            borderColor:active?color:"#d4c4a8",
            display:"flex",alignItems:"center",gap:"5px"}
        },
          React.createElement("span",{style:{width:"8px",height:"8px",borderRadius:"50%",background:active?color:"#c8b89a",display:"inline-block",flexShrink:0}}),
          name===subjectName ? name : name+(rel?" ("+rel.toLowerCase()+")":"")
        );
      }),
      shown.size < allPeople.length && React.createElement("button",{
        onClick:()=>setShown(new Set(allPeople.map(([n])=>n))),
        style:{padding:"3px 10px",borderRadius:"20px",border:"1px solid #c8b89a",cursor:"pointer",
          fontSize:"0.74rem",fontFamily:"'Crimson Text',serif",color:"#8a7460",background:"transparent"}
      },"Show all")
    ),

    // Decade jump-links
    allEvents.length>0 && Object.keys(byDec).length>1 && React.createElement("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"18px",paddingBottom:"12px",borderBottom:"1px solid #ede4d4",alignItems:"center"}},
      React.createElement("span",{style:{fontSize:"0.74rem",color:"#8a7460",fontStyle:"italic",letterSpacing:"0.04em",marginRight:"2px"}},"Jump to:"),
      Object.keys(byDec).sort((a,b)=>+a-+b).map(dec=>React.createElement("a",{
        key:"sjump-"+dec,
        href:"#sdec-"+dec,
        onClick:e=>{e.preventDefault();scrollAnchorIntoView("sdec-"+dec);},
        style:{fontSize:"0.82rem",color:"#5a4a38",textDecoration:"underline",textDecorationColor:"#c8b89a",textUnderlineOffset:"2px",fontFamily:"'Playfair Display',serif",fontWeight:700,letterSpacing:"0.04em",padding:"2px 4px"}
      }, dec+"s"))
    ),

    // Timeline
    allEvents.length===0
      ? React.createElement("p",{style:{color:"#8a7460",fontStyle:"italic",textAlign:"center",padding:"40px 0"}},"No events to display. Select people above.")
      : Object.keys(byDec).sort((a,b)=>+a-+b).map(dec=>{
          const events = byDec[dec];
          return React.createElement("div",{key:dec,id:"sdec-"+dec,style:{marginBottom:"24px",contentVisibility:"auto",containIntrinsicSize:"auto 500px"}},
            React.createElement("div",{style:{display:"flex",alignItems:"center",gap:"12px",marginBottom:"8px"}},
              React.createElement("h3",{style:{margin:0,fontFamily:"'Playfair Display',serif",fontSize:"1rem",color:"#8a7460",fontWeight:700,letterSpacing:"0.1em"}},
                dec,React.createElement("span",{style:{fontSize:"0.55em",letterSpacing:0,verticalAlign:"baseline"}},"s")
              ),
              React.createElement("div",{style:{flex:1,height:"1px",background:"linear-gradient(to right, #c8b89a, transparent)"}})
            ),
            React.createElement("div",{style:{paddingLeft:"14px",borderLeft:"3px solid #c8a87a"}},
              events.map(m=>{
                const color = personColor[m._person]||"#c8b89a";
                const isOwn = m._person===subjectName;
                const title = displayTitleFor(m);
                const dateExtra = shortDate(m);
                const loc = m.location || "";
                const age = ageAt(m.year);
                return React.createElement("div",{key:m.id,
                  style:{display:"flex",alignItems:"flex-start",gap:"8px",marginBottom:"8px"}},
                  // Year (+ age below) + dot
                  React.createElement("div",{style:{display:"flex",alignItems:"center",gap:"5px",width:"56px",flexShrink:0,paddingTop:"3px"}},
                    React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"flex-end",lineHeight:1.1,minWidth:"36px"}},
                      React.createElement("span",{style:{fontSize:"0.75rem",color:"#8a7460",fontFamily:"'Playfair Display',serif",fontWeight:700}},m.year||""),
                      age != null && React.createElement("span",{style:{fontSize:"0.66rem",color:"#a89060",fontStyle:"italic"}},"age "+age)
                    ),
                    React.createElement("span",{style:{width:"9px",height:"9px",borderRadius:"50%",background:color,flexShrink:0,display:"inline-block"}})
                  ),
                  // Title + date/location subline
                  React.createElement("div",{style:{flex:1,minWidth:0}},
                    isOwn
                      ? React.createElement("button",{
                          onClick:()=>{setSelected(m.id);setView("detail");},
                          style:{background:"none",border:"none",cursor:"pointer",padding:0,textAlign:"left",
                            fontFamily:"'Crimson Text',Georgia,serif",fontSize:"0.92rem",color:"#2c2416",lineHeight:1.4,
                            textDecoration:"underline",textDecorationColor:"#c8b89a",textUnderlineOffset:"2px"}
                        }, title)
                      : React.createElement("span",{style:{fontFamily:"'Crimson Text',Georgia,serif",fontSize:"0.92rem",color:"#3a3028",lineHeight:1.4}},title),
                    (dateExtra || loc) && React.createElement("div",{style:{fontSize:"0.76rem",color:"#8a7460",marginTop:"2px",lineHeight:1.4}},
                      dateExtra,
                      dateExtra && loc ? " · " : "",
                      loc ? "📍 "+loc : ""
                    )
                  )
                );
              })
            )
          );
        })
  );
}

// ── Build memories from stored tree data for a given tree person ────────────
// Used by both "Start Chronicle" (promoteToSubject) and "Sync from Tree" button.
function buildMemsFromTree(tp, tpById, treeF) {
  let idx = 0;
  const subBirth = parseInt(tp.dob)||null;
  const subDeath = parseInt(tp.dod)||null;
  const lifetimeUpperBound = subDeath || new Date().getFullYear();
  function inLifetime(yr) {
    if(!yr) return false;
    if(subBirth && yr < subBirth) return false;
    if(yr > lifetimeUpperBound) return false;
    return true;
  }
  function mkMem(title, year, loc, people, extra={}) {
    if (!inLifetime(year)) return null;
    return { id:"tp_mem_"+tp.id+"_"+(idx++), title, year, month:1, day:1,
      fuzzy:"year", season:"Early",
      location:loc||"", locations:loc?[loc]:[],
      tags:[], people:people||[], orgs:[], mediaUrls:[],
      endFuzzy:null, endYear:null, endMonth:1, endDay:1, endSeason:"Early", endOngoing:false,
      perspectives:[], fromGedcom:true, content:"", ...extra };
  }

  const parentsOf={}, childrenOf={}, spousesOf={};
  (treeF||[]).forEach(fam=>{
    const h=fam.husbandId, w=fam.wifeId;
    (fam.childIds||[]).forEach(cid=>{
      if(h){(parentsOf[cid]=parentsOf[cid]||[]).push(h);(childrenOf[h]=childrenOf[h]||[]).push(cid);}
      if(w){(parentsOf[cid]=parentsOf[cid]||[]).push(w);(childrenOf[w]=childrenOf[w]||[]).push(cid);}
    });
    if(h&&w){(spousesOf[h]=spousesOf[h]||[]).push(w);(spousesOf[w]=spousesOf[w]||[]).push(h);}
  });

  // Personal events. Prefer the rich GEDCOM event list captured at
  // import time (births, baptisms, residences, military, occupations,
  // immigration, etc., with full day/month dates) over deriving a
  // year-only stub from the family structure. Fall back to the family-
  // derivation when tp has no stored events (older imports, manually-
  // built trees).
  let personalMems = [];
  if (Array.isArray(tp.events) && tp.events.length > 0) {
    personalMems = tp.events.filter(m => m && m.year && inLifetime(m.year));
    // Add child birth/death markers from the family structure too — these
    // sit on the parent's record (not the child's) and stay useful even
    // when tp.events already has rich data for the focal person.
    (treeF||[]).forEach(fam=>{
      if(fam.husbandId!==tp.id && fam.wifeId!==tp.id) return;
      (fam.childIds||[]).forEach(cid=>{
        const ch=tpById[cid]; if(!ch) return;
        const m1 = mkMem("Birth of "+ch.name, parseInt(ch.dob)||null, ch.birthPlace||"", [ch.name]);
        if (m1) personalMems.push(m1);
        if (ch.dod) {
          const m2 = mkMem("Death of "+ch.name, parseInt(ch.dod)||null, ch.deathPlace||"", [ch.name]);
          if (m2) personalMems.push(m2);
        }
      });
    });
  } else {
    personalMems.push(mkMem("Born", subBirth, tp.birthPlace, []));
    personalMems.push(mkMem("Died", subDeath, tp.deathPlace, []));
    (treeF||[]).forEach(fam=>{
      if(fam.husbandId!==tp.id && fam.wifeId!==tp.id) return;
      const spouseId = fam.husbandId===tp.id ? fam.wifeId : fam.husbandId;
      const spouse = spouseId ? tpById[spouseId] : null;
      const spouseName = spouse?.name||null;
      if(fam.marriageYear)
        personalMems.push(mkMem(spouseName?"Married "+spouseName:"Married", fam.marriageYear, fam.marriagePlace||"", spouseName?[spouseName]:[]));
      (fam.childIds||[]).forEach(cid=>{
        const ch=tpById[cid]; if(!ch) return;
        personalMems.push(mkMem("Birth of "+ch.name, parseInt(ch.dob)||null, ch.birthPlace||"", [ch.name]));
        if(ch.dod) personalMems.push(mkMem("Death of "+ch.name, parseInt(ch.dod)||null, ch.deathPlace||"", [ch.name]));
      });
    });
  }

  // Relatives
  const subParents       = parentsOf[tp.id]||[];
  const subGrandpars     = subParents.flatMap(p=>parentsOf[p]||[]);
  const subGreatGrands   = subGrandpars.flatMap(p=>parentsOf[p]||[]);
  const subChildren      = childrenOf[tp.id]||[];
  const subSiblings      = subParents.flatMap(p=>childrenOf[p]||[]).filter(id=>id!==tp.id);
  const subSpouses       = spousesOf[tp.id]||[];
  const subAuntsUncles   = subGrandpars.flatMap(g=>childrenOf[g]||[]).filter(id=>!subParents.includes(id)&&id!==tp.id);
  const subNiecesNephews = subSiblings.flatMap(s=>childrenOf[s]||[]);
  const subCousins       = subAuntsUncles.flatMap(au=>childrenOf[au]||[]);

  function relLabel(id) {
    if(subSpouses.includes(id))       return "Spouse";
    if(subParents.includes(id))       return "Parent";
    if(subChildren.includes(id))      return "Child";
    if(subSiblings.includes(id))      return "Sibling";
    if(subGrandpars.includes(id))     return "Grandparent";
    if(subAuntsUncles.includes(id))   return "Aunt/Uncle";
    if(subNiecesNephews.includes(id)) return "Niece/Nephew";
    if(subCousins.includes(id))       return "Cousin";
    if(subGreatGrands.includes(id))   return "Great-grandparent";
    return "";
  }

  const relativeIds = [...new Set([
    ...subSpouses, ...subParents, ...subChildren, ...subSiblings,
    ...subGrandpars, ...subAuntsUncles, ...subNiecesNephews, ...subCousins, ...subGreatGrands,
  ])].filter(id=>id!==tp.id);

  const contextMems = [];
  const rels = {};
  const ctxSeen = new Set();

  // Only bring in events where the relative is the *primary* — birth, death,
  // and marriage. Don't add "Birth of {child}" from the parent's perspective:
  // the child's own Born event (added when we iterate them as a relative) covers it.
  // Marriages are deduped by family id so they appear once even if both spouses
  // are relatives.
  relativeIds.forEach(relId=>{
    const rel = tpById[relId]; if(!rel) return;
    const rl = relLabel(relId);
    if(rl) rels[rel.name]=rl;
    const rlTag = rl?" ["+rl+"]":"";
    function addCtx(title, year, loc, people, dedupKey) {
      if(!inLifetime(year)) return;
      const key = dedupKey || (title+"|"+year+"|"+rel.name);
      if(ctxSeen.has(key)) return;
      ctxSeen.add(key);
      const verb = title.charAt(0).toLowerCase()+title.slice(1);
      const m = mkMem(rel.name+rlTag+" "+verb, year, loc, [rel.name,...(people||[])],
        {gedcomContext:true, visibility:"private"});
      if(m) contextMems.push(m);
    }
    addCtx("Born", parseInt(rel.dob)||null, rel.birthPlace||"", []);
    addCtx("Died", parseInt(rel.dod)||null, rel.deathPlace||"", []);
    (treeF||[]).forEach(fam=>{
      if(fam.husbandId!==relId && fam.wifeId!==relId) return;
      if(!fam.marriageYear) return;
      const spId = fam.husbandId===relId ? fam.wifeId : fam.husbandId;
      const sp = spId ? tpById[spId] : null;
      // Dedup by family id so a marriage between two relatives shows once,
      // not once per spouse.
      addCtx(
        sp?"Married "+sp.name:"Married",
        fam.marriageYear, fam.marriagePlace||"",
        sp?[sp.name]:[],
        "marriage|"+(fam.id||relId+"|"+(spId||""))
      );
    });
  });

  contextMems.sort((a,b)=>(a.year||0)-(b.year||0));
  const allMems = [...personalMems.filter(Boolean), ...contextMems].sort((a,b)=>(a.year||0)-(b.year||0));
  return { allMems, rels };
}

function FamilyTreeView({subjects, activeSubjectId, subjectLinks, persistTop, onSwitch,
  treePersons, treeFamilies, gedFocalPersonId, isHistoryMode, persistSubject, setView, setImportTab}) {
  const [tpSearch, setTpSearch] = React.useState("");
  const [focalId, setFocalId] = React.useState(()=>gedFocalPersonId||treePersons[0]?.id||null);
  const [personDetail, setPersonDetail] = React.useState(null); // tpId for detail panel
  const [editingId, setEditingId] = React.useState(null);
  const [editDraft, setEditDraft] = React.useState({});
  // Add-relation state. addingKind ∈ "spouse"|"parent"|"sibling"|"child"|"first";
  // anchorId is the existing person whose relation we're adding (null for "first").
  const [addingKind, setAddingKind] = React.useState(null);
  const [addingAnchor, setAddingAnchor] = React.useState(null);
  const [newDraft, setNewDraft] = React.useState({});

  // Layout refs/state for the SVG connector overlay. Cards register their
  // DOM nodes via cardRefs; useLayoutEffect measures positions after each
  // render so the SVG paths land on the right pixels.
  const containerRef = React.useRef(null);
  const cardRefs = React.useRef({});
  const [layout, setLayout] = React.useState(null);
  React.useLayoutEffect(() => {
    function measure() {
      const c = containerRef.current;
      if (!c) return;
      const cBox = c.getBoundingClientRect();
      const positions = {};
      Object.keys(cardRefs.current).forEach(id => {
        const el = cardRefs.current[id];
        if (!el || !el.isConnected) return;
        const r = el.getBoundingClientRect();
        positions[id] = {
          cx: r.left + r.width/2 - cBox.left,
          top: r.top - cBox.top,
          bottom: r.bottom - cBox.top,
        };
      });
      setLayout({width: cBox.width, height: cBox.height, positions});
    }
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, [focalId, treePersons, treeFamilies, personDetail, editingId, addingKind]);

  function blankDraft() { return {name:"",sex:"",dob:"",dod:"",birthPlace:"",deathPlace:"",notes:""}; }
  function startAddRelation(kind, anchorId) {
    setAddingKind(kind);
    setAddingAnchor(anchorId);
    setNewDraft(blankDraft());
  }
  function cancelAddRelation() { setAddingKind(null); setAddingAnchor(null); setNewDraft({}); }

  // Keep focalId in sync when gedFocalPersonId changes (e.g. after fresh import)
  React.useEffect(()=>{ if(gedFocalPersonId) setFocalId(gedFocalPersonId); },[gedFocalPersonId]);

  // Memoised relationship indices — these only change when the tree
  // topology changes, so don't rebuild them on every focal click /
  // detail-panel toggle / window resize.
  const tpById = React.useMemo(
    () => Object.fromEntries((treePersons||[]).map(p=>[p.id,p])),
    [treePersons]
  );
  const familyMaps = React.useMemo(() => {
    const parentsOf = {}, childrenOf = {}, spousesOf = {};
    (treeFamilies||[]).forEach(fam => {
      const {husbandId:h, wifeId:w, childIds:cs=[]} = fam;
      cs.forEach(cid => {
        parentsOf[cid] = parentsOf[cid] || [];
        if (h && !parentsOf[cid].includes(h)) parentsOf[cid].push(h);
        if (w && !parentsOf[cid].includes(w)) parentsOf[cid].push(w);
        if (h) { childrenOf[h] = childrenOf[h] || []; if (!childrenOf[h].includes(cid)) childrenOf[h].push(cid); }
        if (w) { childrenOf[w] = childrenOf[w] || []; if (!childrenOf[w].includes(cid)) childrenOf[w].push(cid); }
      });
      if (h && w) {
        spousesOf[h] = spousesOf[h] || []; if (!spousesOf[h].includes(w)) spousesOf[h].push(w);
        spousesOf[w] = spousesOf[w] || []; if (!spousesOf[w].includes(h)) spousesOf[w].push(h);
      }
    });
    return {parentsOf, childrenOf, spousesOf};
  }, [treeFamilies]);
  // tp.id -> subject map. Three priority signals: tp.subjectId,
  // subject.gedFocalPersonId, name match. Memoised since subjects rarely
  // change in this view.
  const tpToSubject = React.useMemo(() => {
    const map = {};
    const subjectByName = new Map();
    (subjects||[]).forEach(s => {
      const nm = (s.name||"").trim().toLowerCase();
      if (nm && !subjectByName.has(nm)) subjectByName.set(nm, s);
    });
    (treePersons||[]).forEach(p => {
      if (p.subjectId) {
        const s = (subjects||[]).find(s2 => s2.id === p.subjectId);
        if (s) map[p.id] = s;
      }
    });
    (subjects||[]).forEach(s => {
      if (s.gedFocalPersonId && !map[s.gedFocalPersonId]) map[s.gedFocalPersonId] = s;
    });
    (treePersons||[]).forEach(p => {
      if (map[p.id]) return;
      const nm = (p.name||"").trim().toLowerCase();
      const s = nm ? subjectByName.get(nm) : null;
      if (s) map[p.id] = s;
    });
    return map;
  }, [subjects, treePersons]);
  const chronicleTpIds = React.useMemo(
    () => new Set(Object.keys(tpToSubject)),
    [tpToSubject]
  );

  // ── FULL TREE MODE (treePersons populated) ──────────────────────────────
  const hasTree = treePersons && treePersons.length > 0;

  if (hasTree) {
    const {parentsOf, childrenOf, spousesOf} = familyMaps;

    const focal = focalId && tpById[focalId] ? focalId : treePersons[0]?.id;
    const focalP = tpById[focal];

    // Sort helper: birth year, then name. Unknown DOB sinks to the end.
    function sortByDob(arr) {
      return arr.slice().sort((a,b) => {
        const pa=tpById[a], pb=tpById[b];
        const ya=parseInt(pa?.dob)||9999, yb=parseInt(pb?.dob)||9999;
        if (ya !== yb) return ya - yb;
        return (pa?.name||"").localeCompare(pb?.name||"");
      });
    }

    const parentIds = sortByDob(parentsOf[focal] || []);
    const spouseIds = sortByDob(spousesOf[focal] || []);
    // Siblings = other children of focal's parents; deduped across two parents.
    const sibSet = new Set();
    (parentsOf[focal]||[]).forEach(pid => (childrenOf[pid]||[]).forEach(cid => { if (cid !== focal) sibSet.add(cid); }));
    const siblingIds = sortByDob([...sibSet]);
    const childIds = sortByDob(childrenOf[focal] || []);

    function focusOn(id) {
      setFocalId(id);
      setPersonDetail(null);
      setEditingId(null);
      if (persistSubject) persistSubject({gedFocalPersonId:id});
    }

    function updateTreePerson(id, patch) {
      const updated = treePersons.map(p => p.id === id ? {...p, ...patch} : p);
      const treeHost = subjects.find(s => (s.treePersons||[]).length > 0);
      const newSubjects = subjects.map(s =>
        s.id === treeHost?.id ? {...s, treePersons: updated} : s
      );
      persistTop({subjects: newSubjects});
    }

    // ── Manual relation builder ────────────────────────────────
    // Helpers that produce {persons, families} updates without persisting,
    // so saveAddRelation can batch into a single persistTop call.
    function newPersonRecord(draft) {
      const id = "tp_manual_"+Date.now()+Math.random().toString(36).slice(2,5);
      return {
        id,
        gedId: "@" + id.toUpperCase() + "@",
        name: (draft.name||"").trim(),
        sex: (draft.sex||"").trim(),
        dob: (draft.dob||"").trim(),
        dod: (draft.dod||"").trim(),
        birthPlace: (draft.birthPlace||"").trim(),
        deathPlace: (draft.deathPlace||"").trim(),
        notes: (draft.notes||"").trim(),
        subjectId: null,
      };
    }
    function newFamilyRecord() {
      const id = "tf_manual_"+Date.now()+Math.random().toString(36).slice(2,5);
      return {
        id, gedId: "@" + id.toUpperCase() + "@",
        husbandId: null, wifeId: null, childIds: [],
        marriageYear: null, marriagePlace: "",
      };
    }
    // Each relation helper returns either {addFamily} (a new family object to
    // append) or {updateFamily} (an existing family object to replace by id).
    // Caller layers these on top of the new person itself.
    function relationOpsSpouse(anchorId, person) {
      const anchor = tpById[anchorId];
      // Slot the new spouse into an existing one-sided family if possible.
      const fam = (treeFamilies||[]).find(f =>
        (f.husbandId === anchorId && !f.wifeId) ||
        (f.wifeId === anchorId && !f.husbandId)
      );
      if (fam) {
        const upd = {...fam};
        if (fam.husbandId === anchorId) upd.wifeId = person.id;
        else upd.husbandId = person.id;
        return { updateFamily: upd };
      }
      const f = newFamilyRecord();
      if (anchor?.sex === "F") { f.wifeId = anchorId; f.husbandId = person.id; }
      else if (anchor?.sex === "M") { f.husbandId = anchorId; f.wifeId = person.id; }
      else if (person.sex === "F") { f.wifeId = person.id; f.husbandId = anchorId; }
      else { f.husbandId = anchorId; f.wifeId = person.id; }
      return { addFamily: f };
    }
    function relationOpsParent(anchorId, person) {
      let fam = (treeFamilies||[]).find(f => (f.childIds||[]).includes(anchorId));
      const isFemale = person.sex === "F";
      if (!fam) {
        const f = newFamilyRecord();
        f.childIds = [anchorId];
        if (isFemale) f.wifeId = person.id; else f.husbandId = person.id;
        return { addFamily: f };
      }
      const upd = {...fam};
      if (isFemale && !fam.wifeId) upd.wifeId = person.id;
      else if (!isFemale && !fam.husbandId) upd.husbandId = person.id;
      else if (!fam.wifeId) upd.wifeId = person.id;
      else if (!fam.husbandId) upd.husbandId = person.id;
      // Both slots already filled → spawn a new family with this child + new parent.
      else {
        const f = newFamilyRecord();
        f.childIds = [anchorId];
        if (isFemale) f.wifeId = person.id; else f.husbandId = person.id;
        return { addFamily: f };
      }
      return { updateFamily: upd };
    }
    function relationOpsSibling(anchorId, person) {
      let fam = (treeFamilies||[]).find(f => (f.childIds||[]).includes(anchorId));
      if (!fam) {
        const f = newFamilyRecord();
        f.childIds = [anchorId, person.id];
        return { addFamily: f };
      }
      return { updateFamily: {...fam, childIds: [...fam.childIds, person.id]} };
    }
    function relationOpsChild(anchorId, person) {
      const anchor = tpById[anchorId];
      const fam = (treeFamilies||[]).find(f => f.husbandId === anchorId || f.wifeId === anchorId);
      if (!fam) {
        const f = newFamilyRecord();
        if (anchor?.sex === "F") f.wifeId = anchorId; else f.husbandId = anchorId;
        f.childIds = [person.id];
        return { addFamily: f };
      }
      return { updateFamily: {...fam, childIds: [...(fam.childIds||[]), person.id]} };
    }

    function applyRelationChange(addPerson, ops) {
      const updPersons = [...treePersons, addPerson];
      let updFamilies = [...(treeFamilies||[])];
      if (ops?.addFamily) updFamilies = [...updFamilies, ops.addFamily];
      if (ops?.updateFamily) updFamilies = updFamilies.map(f => f.id === ops.updateFamily.id ? ops.updateFamily : f);
      const treeHost = subjects.find(s => (s.treePersons||[]).length > 0);
      const targetId = treeHost?.id || activeSubjectId;
      const newSubjects = subjects.map(s =>
        s.id === targetId ? {...s, treePersons: updPersons, treeFamilies: updFamilies} : s
      );
      persistTop({subjects: newSubjects});
    }

    function saveAddRelation() {
      if (!(newDraft.name||"").trim()) return;
      const person = newPersonRecord(newDraft);
      let ops = null;
      if (addingKind === "spouse")  ops = relationOpsSpouse(addingAnchor, person);
      else if (addingKind === "parent")  ops = relationOpsParent(addingAnchor, person);
      else if (addingKind === "sibling") ops = relationOpsSibling(addingAnchor, person);
      else if (addingKind === "child")   ops = relationOpsChild(addingAnchor, person);
      // "first" → just add the person; no family operations needed.
      applyRelationChange(person, ops);
      // Focus the new person so the user lands on their record.
      setFocalId(person.id);
      setPersonDetail(null);
      setAddingKind(null); setAddingAnchor(null); setNewDraft({});
      if (persistSubject) persistSubject({gedFocalPersonId: person.id});
    }

    function promoteToSubject(tp) {
      const newId = "subj_tp_"+Date.now();
      const tpById2 = Object.fromEntries(treePersons.map(p=>[p.id,p]));
      const { allMems, rels } = buildMemsFromTree(tp, tpById2, treeFamilies);
      const allKnownPeople = [...new Set(allMems.flatMap(m=>m.people||[]))].sort();
      const allKnownLocs   = [...new Set(allMems.map(m=>m.location).filter(Boolean))].sort();
      const newSubj = {
        id:newId, name:tp.name, isSelf:false, mode:"history",
        dob:tp.dob||"", notes:tp.notes||"",
        memories:allMems, candidates:[], candidatePersons:[],
        knownPeople:allKnownPeople, knownOrgs:[], knownLocations:allKnownLocs,
        knownSources:[], peopleEmails:{}, peopleRelationships:rels,
        peopleNotes:{}, orgNotes:{}, orgLocations:{}, orgPeriods:{}, entityPhotos:{},
        locationNotes:{}, locationCoords:{}, personOrgs:{}, personLocations:{},
        personGroups:{}, customTags:[], shareHistory:[], lastBackup:null, lastImport:null,
        backupPassword:"", legacyMessage:"", treePersons:[], treeFamilies:[],
      };
      const updatedPersons = treePersons.map(p=>p.id===tp.id?{...p,subjectId:newId}:p);
      const treeHostSubj = subjects.find(s=>(s.treePersons||[]).length>0);
      const updatedSubjects = subjects.map(s=>
        s.id===treeHostSubj?.id ? {...s,treePersons:updatedPersons} : s
      );
      persistTop({subjects:[...updatedSubjects,newSubj], activeSubjectId:newId});
      setPersonDetail(null);
      setView("life");
    }

    function startEdit(tp) {
      setEditDraft({
        name: tp.name||"", sex: tp.sex||"",
        dob: tp.dob||"", dod: tp.dod||"",
        birthPlace: tp.birthPlace||"", deathPlace: tp.deathPlace||"",
        notes: tp.notes||""
      });
      setEditingId(tp.id);
    }
    function saveEdit() {
      if (!editingId) return;
      const trim = (s) => (s||"").toString().trim();
      const patch = {
        name: trim(editDraft.name),
        sex: trim(editDraft.sex),
        dob: trim(editDraft.dob),
        dod: trim(editDraft.dod),
        birthPlace: trim(editDraft.birthPlace),
        deathPlace: trim(editDraft.deathPlace),
        notes: trim(editDraft.notes),
      };
      if (!patch.name) return;
      updateTreePerson(editingId, patch);
      setEditingId(null);
    }

    // Card. Chronicle subjects use a sage-green palette so they're visually
    // distinct; the focal card adds a ring/glow on top of whatever palette
    // is in play, so a Chronicle focal still reads as Chronicle.
    function renderCard(id, opts={}) {
      const tp = tpById[id];
      if (!tp) return null;
      const isFocal = id === focal;
      const isChronicle = chronicleTpIds.has(id);
      // Focal gets the amber ring as its highlight — drop the Chronicle
      // green palette in that case so the highlight reads cleanly. Non-

      const showChronicleColor = isChronicle && !isFocal;
      const sexAccent = tp.sex === "F" ? "#c4858a" : tp.sex === "M" ? "#8b9dc3" : "#a89a7a";
      const bg         = showChronicleColor ? "rgba(74,122,90,0.13)" : "rgba(255,252,245,0.97)";
      const borderCol  = showChronicleColor ? "#5a8a6a" : "#d4c4a8";

        }
      },
        React.createElement("div",{style:{fontFamily:"'Crimson Text',serif",fontSize:isFocal?"0.95rem":"0.9rem",color:"#1a1208",fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",lineHeight:1.2}}, tp.name),
        React.createElement("div",{style:{fontSize:"0.74rem",color: showChronicleColor?"#3a6b4a":"#8a7460",marginTop:"2px"}},
          [tp.dob && "b. "+tp.dob, tp.dod && "d. "+tp.dod].filter(Boolean).join(" \u00b7 ") || "\u00a0"
        )

    }


    const detailPerson = personDetail && tpById[personDetail];
    const linkedSubject = detailPerson ? (tpToSubject[detailPerson.id] || null) : null;
    const filtered = tpSearch.trim()
      ? treePersons.filter(p=>p.name.toLowerCase().includes(tpSearch.toLowerCase())).slice(0, 50)
      : null;

        fld("name","Name", false, false),

    }

    // Inline "+ add relation" form, computed once per render.
    const addRelationForm = (() => {
      if (!addingKind) return null;
      const anchor = addingAnchor ? tpById[addingAnchor] : null;
      const titles = {
        spouse: "Add a spouse" + (anchor ? " of " + anchor.name : ""),
        parent: "Add a parent" + (anchor ? " of " + anchor.name : ""),
        sibling: "Add a sibling" + (anchor ? " of " + anchor.name : ""),
        child: "Add a child" + (anchor ? " of " + anchor.name : ""),
        first: "Add the first person to your tree",
      };
      return React.createElement("div",{style:{background:"rgba(196,169,98,0.07)",border:"1px solid rgba(196,169,98,0.4)",borderRadius:"4px",padding:"14px 16px",marginBottom:"20px"}},
        React.createElement("h3",{style:{fontFamily:"'Playfair Display',serif",fontSize:"1.05rem",margin:"0 0 10px",color:"#1a1208"}}, titles[addingKind] || "Add a person"),
        renderPersonForm(newDraft, setNewDraft),
        React.createElement("div",{style:{display:"flex",gap:"6px",marginTop:"12px"}},
          React.createElement("button",{onClick:saveAddRelation,disabled:!(newDraft.name||"").trim(),style:{...S.btn,padding:"6px 14px",fontSize:"0.86rem",opacity:(newDraft.name||"").trim()?1:0.5}},"Save"),
          React.createElement("button",{onClick:cancelAddRelation,style:{...S.btnOutline,padding:"6px 12px",fontSize:"0.86rem"}},"Cancel")
        )
      );
    })();

    return React.createElement("div",{style:{animation:"fadeIn 0.3s ease"}},
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"16px",flexWrap:"wrap"}},
        React.createElement("h2",{style:{fontFamily:"'Playfair Display',serif",fontSize:"1.8rem",fontStyle:"italic",margin:0,color:"#1a1208"}},"Family Tree"),
        React.createElement("span",{style:{fontSize:"0.82rem",color:"#8a7460",fontStyle:"italic"}}, treePersons.length+" people \u00b7 focused on "+(focalP?.name||"\u2014")),
        React.createElement("div",{style:{marginLeft:"auto"}},
          React.createElement("input",{value:tpSearch,onChange:e=>setTpSearch(e.target.value),placeholder:"Find another person\u2026",style:{...S.input,padding:"5px 10px",fontSize:"0.86rem",width:"200px"}})
        )
      ),

      filtered && React.createElement("div",{style:{marginBottom:"16px",border:"1px solid #d4c4a8",borderRadius:"4px",maxHeight:"260px",overflowY:"auto",background:"rgba(255,252,245,0.85)"}},
        filtered.length === 0
          ? React.createElement("p",{style:{padding:"12px 14px",color:"#8a7460",fontStyle:"italic",margin:0}}, "No matches.")
          : filtered.map(p=>React.createElement("div",{key:p.id,onClick:()=>{focusOn(p.id);setTpSearch("");},
              style:{padding:"9px 14px",cursor:"pointer",borderBottom:"1px solid #ede0cc",display:"flex",justifyContent:"space-between",alignItems:"center",gap:"8px"},
              onMouseEnter:e=>e.currentTarget.style.background="rgba(200,184,154,0.12)",
              onMouseLeave:e=>e.currentTarget.style.background="transparent"
            },
              React.createElement("span",{style:{fontFamily:"'Crimson Text',serif",fontSize:"0.95rem",color:"#1a1208",flex:1}},p.name),
              React.createElement("span",{style:{fontSize:"0.78rem",color:"#8a7460"}},[p.dob,p.dod].filter(Boolean).join("\u2013")||""),
              p.subjectId && React.createElement("span",{style:{fontSize:"0.74rem",padding:"1px 7px",borderRadius:"20px",background:"rgba(74,122,90,0.16)",color:"#3a6b4a",border:"1px solid rgba(74,122,90,0.3)"}}, "\u2713 Chronicle")
            ))
      ),

      addRelationForm,

      // Detail panel — appears under the search box, above the rows
      detailPerson && !addingKind && React.createElement("div",{style:{background:"rgba(255,252,245,0.97)",border:"1px solid #a8885a",borderRadius:"4px",padding:"14px 16px",marginBottom:"20px"}},
        editingId === detailPerson.id
        ? React.createElement("div",null,
            React.createElement("h3",{style:{fontFamily:"'Playfair Display',serif",fontSize:"1.05rem",margin:"0 0 10px",color:"#1a1208"}}, "Edit "+(detailPerson.name||"person")),
            React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}},
              React.createElement("div",{style:{gridColumn:"1 / -1"}},
                React.createElement("label",{style:{fontSize:"0.76rem",color:"#8a7460",display:"block",marginBottom:"2px"}},"Name"),
                React.createElement("input",{value:editDraft.name||"",onChange:e=>setEditDraft(d=>({...d,name:e.target.value})),style:{...S.input,fontSize:"0.92rem",padding:"6px 10px"}})
              ),
              React.createElement("div",null,
                React.createElement("label",{style:{fontSize:"0.76rem",color:"#8a7460",display:"block",marginBottom:"2px"}},"Sex"),
                React.createElement("select",{value:editDraft.sex||"",onChange:e=>setEditDraft(d=>({...d,sex:e.target.value})),style:{...S.input,fontSize:"0.92rem",padding:"6px 10px"}},
                  React.createElement("option",{value:""},"\u2014"),

// ── TodoView ─────────────────────────────────────────────────
// Lineage research workspace: a manual to-do list plus six rule-based
// suggestions that surface gaps in the subject's evidence (unsourced
// events, missing dates, impossible cycles, etc.).
function TodoView({subject, memories, knownSources, knownPeople, todos, todoDismissals, persistSubject, setSelected, setView, setIndexFilter, dobYear, dodYear}) {
  const [draft, setDraft] = React.useState("");
  const [linkedTo, setLinkedTo] = React.useState(null);

  const open = (todos||[]).filter(t => !t.done);
  const done = (todos||[]).filter(t => t.done);

  function persistTodos(next) { persistSubject({todos: next}); }
  function persistDismissals(next) { persistSubject({todoDismissals: next}); }

  function addManual() {
    const text = draft.trim();
    if (!text) return;
    const t = {
      id: "todo_" + Date.now() + Math.random().toString(36).slice(2,6),
      text, linkedTo, done: false, createdAt: new Date().toISOString(), source: "manual",
    };
    persistTodos([...(todos||[]), t]);
    setDraft(""); setLinkedTo(null);
  }
  function toggleDone(id) {
    persistTodos((todos||[]).map(t => t.id===id ? {...t, done: !t.done, doneAt: !t.done ? new Date().toISOString() : null} : t));
  }
  function deleteTodo(id) {
    persistTodos((todos||[]).filter(t => t.id !== id));
  }
  function promoteSuggestion(s) {
    // Skip if already promoted
    if ((todos||[]).some(t => t.suggestionKey === s.key)) return;
    const t = {
      id: "todo_" + Date.now() + Math.random().toString(36).slice(2,6),
      text: s.text, linkedTo: s.linkedTo || null, done: false,
      createdAt: new Date().toISOString(),
      source: "check:" + s.rule,
      suggestionKey: s.key,
    };
    persistTodos([...(todos||[]), t]);
  }
  function dismissSuggestion(s) {
    persistDismissals({...(todoDismissals||{}), [s.key]: new Date().toISOString()});
  }

  function navigateLink(linkedTo) {
    if (!linkedTo) return;
    if (linkedTo.type === "memory") { setSelected(linkedTo.id); setView("detail"); }
    else if (linkedTo.type === "person") { setIndexFilter({type:"people", value: linkedTo.value}); setView("index"); }
    else if (linkedTo.type === "source") { setIndexFilter({type:"sources", value: linkedTo.value, sourceId: linkedTo.id}); setView("index"); }
    else if (linkedTo.type === "subject") { setView("settings"); }
  }

  // ── Suggestion rules ──────────────────────────────────────────
  // Each returns an array of {rule, key, text, linkedTo}. key uniquely
  // identifies the suggestion so dismissals + dedupe-against-promoted-todos
  // both work. Suggestions auto-disappear once the underlying issue is
  // fixed (because the rule no longer matches).
  const thisYear = new Date().getFullYear();
  const subjDob = dobYear || null;

  // 1. Unsourced events
  memories.forEach(m => {

    if (eventConfidence(m) !== "unsourced") return;
    suggestions.push({
      rule: "unsourced",

      React.createElement("input",{type:"checkbox",checked:false,onChange:()=>toggleDone(t.id),style:{marginTop:"3px",cursor:"pointer"}}),
