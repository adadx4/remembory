          ...(locData?.placeId ? {placeId: locData.placeId} : {}),
          ...(locData?.osmId ? {osmId: locData.osmId, osmType: locData.osmType} : {}),
          ...(locData?.formalAddress ? {formalAddress: locData.formalAddress} : {}),
        };
        updatedKnownLocs = [...knownLocations, locObj].sort((a,b) => (typeof a==='string'?a:a.label).localeCompare(typeof b==='string'?b:b.label));
      }
    }
    // Strip transient picker / form-UI payloads from the saved memory:
    // the location picker's _locationData, the Add-menu preset hints
    // (_expandEndDate, _initialTab, _promptHint), and each source citation's
    // _repoFilter (used only by the in-form Repository → Collection cascade).
    const {_locationData, _expandEndDate, _initialTab, _promptHint, ...fClean} = f;
    if (Array.isArray(fClean.sources)) {
      fClean.sources = fClean.sources.map(s => { const {_repoFilter, ...rest} = s; return rest; });
    }
    const formWithLoc = {...fClean, location: locationLabel, locationLabel};
    return { locationLabel, formWithLoc, updatedKnownLocs };
  }

  function handleSubmit() {
    if (!form.title.trim()) return;
    const { formWithLoc, updatedKnownLocs } = resolveLocationFromForm(form);

    const primaryId = editingId || (Date.now().toString()+Math.random().toString(36).slice(2));
    const primary = {...formWithLoc, id:primaryId, modifiedAt:new Date().toISOString()};

    // If there's an end date, offer to create a second memory for it
    if ((form.endFuzzy || form.endOngoing) && !editingId) {
      const secondary = {
        ...formWithLoc,
        id: Date.now().toString()+Math.random().toString(36).slice(2),
        title: form.title,
        year:  form.endOngoing ? new Date().getFullYear() : (form.endYear || form.year),
        month: form.endOngoing ? new Date().getMonth()+1 : (form.endMonth || form.month),
        day:   form.endOngoing ? new Date().getDate()    : (form.endDay   || form.day),
        fuzzy: form.endOngoing ? "month" : (form.endFuzzy || form.fuzzy),
        season: form.endSeason || form.season,
        mediaUrls: [],
        endFuzzy: null, endYear: null, endMonth: 1, endDay: 1, endSeason: "Early", endOngoing: false,
      };
      setPendingEndMemory({primary, secondary, updatedKnownLocs});
      return;
    }

    // Editing a candidate → save back to candidates array (not memories)
    if (editingCandidateId) { saveCandidate(primary, updatedKnownLocs); return; }

    commitMemory(primary, null, updatedKnownLocs);
  }

  function commitMemory(primary, secondary, updatedKnownLocs) {
    // All location/people/org state is merged here in one persistSubject call to avoid
    // stale-closure stomping when multiple state updates would otherwise race each other.
    const allFormLocs = [primary.location,...(primary.locations||[])].filter(Boolean);
    const newPeople = [...new Set([...knownPeople, ...(primary.people||[]), ...(secondary?.people||[])])].sort();
    const newOrgs   = [...new Set([...knownOrgs,   ...(primary.orgs||[]),   ...(secondary?.orgs||[])])].sort();
    // Merge any form locations not yet in the list, preserving existing location objects
    const baseLocs = updatedKnownLocs || knownLocations;
    const existingLabels = new Set(baseLocs.map(l => typeof l==='string' ? l : l.label));
    const newLocs = [
      ...baseLocs,
      ...allFormLocs
        .filter(label => !existingLabels.has(label))
        .map(label => ({label, street:"", town:"", state:"", country:""}))
    ].sort((a,b) => (typeof a==='string'?a:a.label).localeCompare(typeof b==='string'?b:b.label));

    if (editingId) {
      // Preserve addedBy, allow contributor name correction via edit form
      const {addedByName, ...primaryClean} = primary;
      const orig = memories.find(m=>m.id===editingId);
      const editedPrimary = orig?.addedBy
        ? {...primaryClean, addedBy:{...orig.addedBy, ...(addedByName!==undefined&&{name:addedByName})}}
        : primaryClean;
      const updated = memories.map(m=>m.id===editingId?editedPrimary:m).sort((a,b)=>sortKey(a)-sortKey(b));
      persistSubject({memories:updated, knownPeople:newPeople, knownOrgs:newOrgs, knownLocations:newLocs});
      setEditingId(null); setSelected(editingId); setForm(newForm()); clearDraft(); setView("detail");
    } else {
      // Stamp addedBy / recalledBy on new memories in carer mode
      if (isCarerMode) {
        const attrib = {name:carerName||"", on:new Date().toISOString().slice(0,10)};
        primary = {...primary, addedBy:attrib};
        if (secondary) secondary = {...secondary, addedBy:attrib};
        if (!isHistoryMode) {
          primary = {...primary, recalledBy:form.recalledBy||"self"};
          if (secondary) secondary = {...secondary, recalledBy:form.recalledBy||"self"};
        }
      }
      const toAdd = secondary ? [primary, secondary] : [primary];
      const updated = [...memories,...toAdd].sort((a,b)=>sortKey(a)-sortKey(b));
      persistSubject({memories:updated, knownPeople:newPeople, knownOrgs:newOrgs, knownLocations:newLocs});
      setForm(newForm()); clearDraft();
      setView("life");
    }
    setPendingEndMemory(null);
  }

  // ── Candidate ops ────────────────────────────────────────────
  function saveCandidate(primary, updatedKnownLocs) {
    const newPeople = [...new Set([...knownPeople,...(primary.people||[])])].sort();
    const newOrgs   = [...new Set([...knownOrgs,...(primary.orgs||[])])].sort();
    const baseLocs  = updatedKnownLocs || knownLocations;
    const existingLabels = new Set(baseLocs.map(l=>typeof l==='string'?l:l.label));
    const allFormLocs = [primary.location,...(primary.locations||[])].filter(Boolean);
    const newLocs = [...baseLocs,...allFormLocs.filter(l=>!existingLabels.has(l)).map(l=>({label:l,street:"",town:"",state:"",country:""}))].sort((a,b)=>(typeof a==='string'?a:a.label).localeCompare(typeof b==='string'?b:b.label));
    if (editingCandidateId) {
      const updated = candidates.map(c=>c.id===editingCandidateId?{...primary}:c);
      persistSubject({candidates:updated,knownPeople:newPeople,knownOrgs:newOrgs,knownLocations:newLocs});
      setEditingCandidateId(null); setEditingId(null);
    } else {
      persistSubject({candidates:[...candidates,primary],knownPeople:newPeople,knownOrgs:newOrgs,knownLocations:newLocs});
    }
    setForm(newForm()); clearDraft(); setView("life");
  }

  function acceptCandidate(id) {
    const c = candidates.find(x=>x.id===id); if(!c) return;
    const {researchNote:_rn, candidateConfidence:_cc, ...memData} = c;
    const updated = [...memories, memData].sort((a,b)=>sortKey(a)-sortKey(b));
    persistSubject({memories:updated, candidates:candidates.filter(x=>x.id!==id)});
  }

  function rejectCandidate(id) {
    if (!window.confirm("Discard this candidate entry?")) return;
    persistSubject({candidates:candidates.filter(c=>c.id!==id)});
  }

  function mergeCandidatePerson(cp, intoPersonName) {
    // intoPersonName: null/empty = merge into subject; otherwise a known person name to attach as an event participant
    const tagged = memories.filter(m=>m.candidatePersonId===cp.id);
    const others = memories.filter(m=>m.candidatePersonId!==cp.id);
    const updatedTagged = tagged.map(m=>{
      const {candidatePersonId:_id, candidateConfidence:_cc, researchNote:_rn, ...rest} = m;
      if (intoPersonName) {
        const existing = rest.people || [];
        const people = existing.includes(intoPersonName) ? existing : [...existing, intoPersonName];
        return {...rest, people};
      }
      return rest;
    });
    const updatedMems = [...others, ...updatedTagged].sort((a,b)=>sortKey(a)-sortKey(b));
    const newKnownPeople = intoPersonName && !knownPeople.includes(intoPersonName)
      ? [...knownPeople, intoPersonName].sort()
      : knownPeople;
    persistSubject({
      memories: updatedMems,
      candidatePersons: candidatePersons.filter(c=>c.id!==cp.id),
      knownPeople: newKnownPeople,
    });
  }

  function discardCandidatePerson(cp) {
    const tagged = memories.filter(m=>m.candidatePersonId===cp.id);
    let deleteEvents = false;
    if (tagged.length > 0) {
      const choice = window.confirm(`Discard candidate "${cp.name}"?\n\n${tagged.length} event${tagged.length===1?"":"s"} ${tagged.length===1?"is":"are"} tagged with this candidate.\n\nOK = discard candidate, keep events (untagged)\nCancel = let me decide differently`);
      if (!choice) {
        const alsoDelete = window.confirm(`Delete the ${tagged.length} tagged event${tagged.length===1?"":"s"} as well?\n\nOK = delete candidate AND its events\nCancel = abort, change nothing`);
        if (!alsoDelete) return;
        deleteEvents = true;
      }
    } else {
      if (!window.confirm(`Discard candidate "${cp.name}"?`)) return;
    }
    const updatedMems = deleteEvents
      ? memories.filter(m=>m.candidatePersonId!==cp.id)
      : memories.map(m=>{
          if (m.candidatePersonId !== cp.id) return m;
          const {candidatePersonId:_id, ...rest} = m;
          return rest;
        });
    persistSubject({
      memories: updatedMems,
      candidatePersons: candidatePersons.filter(c=>c.id!==cp.id),
    });
  }

  function addCandidatePerson(name, notes) {
    const trimmed = (name||"").trim();
    if (!trimmed) return {error:"Name is required."};
    const norm = trimmed.toLowerCase();
    if (subject?.name && norm === subject.name.trim().toLowerCase()) return {error:`"${subject.name}" is the subject's name. Use a disambiguator.`};
    if (candidatePersons.some(c=>(c.name||"").trim().toLowerCase()===norm)) return {error:"Another candidate already has this name."};
    if (knownPeople.some(p=>p.trim().toLowerCase()===norm)) return {error:`"${trimmed}" matches a known person. Use a disambiguator if this is a different individual.`};
    const cp = {id:"cp_"+Date.now()+Math.random().toString(36).slice(2,6), name:trimmed, notes:(notes||"").trim()};
    persistSubject({candidatePersons:[...candidatePersons, cp]});
    return {id:cp.id};
  }

  function handleEditCandidate(c) {
    let editForm = {...c, locationLabel:"", locationStreet:"", locationTown:"", locationState:"", locationCountry:"", locationPrivacy:c.locationPrivacy||"town", _locationData:null};
    if (c.location) {
      const known = findKnownLocation(knownLocations, c.location);
      if (known && typeof known === 'object') {
        editForm.locationStreet=known.street||""; editForm.locationTown=known.town||""; editForm.locationState=known.state||""; editForm.locationCountry=known.country||"";
        if (known.coords || known.placeId) {
          editForm._locationData = { coords: known.coords||null, placeId: known.placeId||null, osmId: known.osmId||null, osmType: known.osmType||null, formalAddress: known.formalAddress||null };
        }
      }
    }
    setForm({...newForm(),...editForm});
    setEditingId(c.id); setEditingCandidateId(c.id);
    setView("edit");
  }

  function handleSaveCandidateSubmit() {
    if (!form.title.trim()) return;
    const { formWithLoc, updatedKnownLocs } = resolveLocationFromForm(form);
    const primaryId = editingCandidateId || (Date.now().toString()+Math.random().toString(36).slice(2));
    const primary = {...formWithLoc, id:primaryId};
    saveCandidate(primary, updatedKnownLocs);
  }

  function handleAcceptFromForm() {
    if (!form.title.trim() || !editingCandidateId) return;
    const { formWithLoc, updatedKnownLocs } = resolveLocationFromForm(form);
    const {researchNote:_rn, candidateConfidence:_cc, ...memData} = {...formWithLoc, id:editingCandidateId};
    const newPeople = [...new Set([...knownPeople,...(memData.people||[])])].sort();
    const newOrgs   = [...new Set([...knownOrgs,...(memData.orgs||[])])].sort();
    const updated = [...memories, memData].sort((a,b)=>sortKey(a)-sortKey(b));
    persistSubject({memories:updated, candidates:candidates.filter(c=>c.id!==editingCandidateId), knownPeople:newPeople, knownOrgs:newOrgs, knownLocations:updatedKnownLocs});
    setEditingCandidateId(null); setEditingId(null); setForm(newForm()); clearDraft();
    setSelected(editingCandidateId); setView("detail");
  }

function handleEdit(m) {
    // Pre-fill structured address fields from the matching knownLocation so the
    // user can edit them and the picker chip renders the saved place. The
    // Display name field starts empty — old memories stored locationLabel === location
    // redundantly, but treating that as a real override would make the field
    // look pre-filled when the user hasn't actually set one.
    let editForm = {...m, locationLabel: "", locationStreet: "", locationTown: "", locationState: "", locationCountry: "", locationPrivacy: m.locationPrivacy || "town", addedByName: m.addedBy?.name ?? "", _locationData: null};
    if (m.location) {
      const known = findKnownLocation(knownLocations, m.location);
      if (known && typeof known === 'object') {
        editForm.locationStreet = known.street || "";
        editForm.locationTown = known.town || "";
        editForm.locationState = known.state || "";
        editForm.locationCountry = known.country || "";
        // Carry coords/place metadata so renaming via Display name preserves the geocode.
        if (known.coords || known.placeId) {
          editForm._locationData = {
            coords: known.coords || null,
            placeId: known.placeId || null,
            osmId: known.osmId || null,
            osmType: known.osmType || null,
            formalAddress: known.formalAddress || null,
          };
        }
      } else {
        // Not in knownLocations — best-effort parse the legacy label so the
        // structured fields show something rather than four blank inputs.
        const parsed = parseLabelToFields(m.location);
        if (parsed) {
          editForm.locationStreet  = parsed.street  || "";
          editForm.locationTown    = parsed.town    || "";
          editForm.locationState   = parsed.state   || "";
          editForm.locationCountry = parsed.country || "";
        }
      }
    }
    setForm(editForm); setEditingId(m.id); setView("edit");
  }

  // Stable callback for MemoryCard's onClick. Without this, every render
  // of the timeline produces a new arrow function and React.memo on
  // MemoryCard can't shortcut the re-render. setState refs are stable,
  // so empty deps are fine.
  const openMemoryDetail = React.useCallback(id => {
    setSelected(id);
    setView("detail");
  }, []);

  function handleDelete(id) {
    if (!confirm("Delete this memory?")) return;
    // Clean up IDB blobs — both the memory's own media AND any per-citation
    // record images attached to source citations.
    const mem = memories.find(m=>m.id===id);
    if (mem) {
      (mem.mediaUrls||[]).forEach(med=>{ if(med && med.mediaId) idbDelete(med.mediaId); });
      (mem.sources||[]).forEach(src=>{
        (src.mediaUrls||[]).forEach(med=>{ if(med && med.mediaId) idbDelete(med.mediaId); });
      });
    }
    setMemories(memories.filter(m=>m.id!==id)); setView("life"); setSelected(null);
  }

  function handleSavePerspectives(updatedMemory) {
    const updated = memories.map(mem => mem.id===updatedMemory.id ? updatedMemory : mem);
    persistSubject({memories:updated});
  }

  function handleMedia(e) {
    Array.from(e.target.files).forEach(async file=>{
      const dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=ev=>res(ev.target.result); r.readAsDataURL(file); });
      const med = await storeMedia(dataUrl, file.name);
      setForm(f=>({...f, mediaUrls:[...f.mediaUrls, med]}));
    });
  }

  // ── Export / Import backup ───────────────────────────────────
  const [shareCodeInput, setShareCodeInput] = useState("");
  const [shareCodeStatus, setShareCodeStatus] = useState("");
  const [saveBackupBusy, setSaveBackupBusy] = useState(false);

  async function importFromCode() {
    const code = shareCodeInput.trim().toLowerCase();
    if (!code) return;
    setShareCodeStatus("Fetching…");
    try {
      const res = await fetch(`${WORKER_URL}/s/${code}`, {headers:{"X-Chronicle-Client":"1"}});
      if (res.status === 404) { setShareCodeStatus("Code not found or expired (links last 30 days)."); return; }
      if (!res.ok) {
        const err = await res.json().catch(()=>({error:`Server error ${res.status}`}));
        setShareCodeStatus("Error: " + (err.error||res.status)); return;
      }
      const dRaw = await res.json();
      if (!dRaw.memories) { setShareCodeStatus("Server returned unexpected data — is the Worker deployed with KV bound?"); return; }
      // Restore any embedded media back into IDB
      const restoredMems = await Promise.all(dRaw.memories.map(async m => {
        const mediaUrls = await Promise.all((m.mediaUrls||[]).map(async med => {
          if (med.url && med.url.startsWith("data:")) {
            // Re-store into IDB (use existing mediaId or generate new)
            const id = med.mediaId || ("media_" + Date.now() + "_" + Math.random().toString(36).slice(2));
            const res = await fetch(med.url);
            const blob = await res.blob();
            await idbPut(id, blob);
            return { mediaId: id, name: med.name };
          }
          return med;
        }));
        return {...m, mediaUrls};
      }));
      setPendingShare({...dRaw, memories: restoredMems});
      setPendingShareSelected(new Set(restoredMems.map(m=>m.id)));
      setPendingShareWantConnect(true);
      setShareCodeStatus("");
      setShareCodeInput("");
    } catch(e) {
      setShareCodeStatus("Error fetching — check your connection.");
    }
  }


  async function acceptShare(d) {
    const isShared = !!d.sharedBy;
    const senderName = d.sharedBy || null;
    // Compute existingIds early so incomingMems.map can skip content-wrapping for already-owned memories
    const existingIds = new Set(memories.map(m=>m.id));
    const senderEmail = d.sharedByEmail || null;
    // Store received photos into IndexedDB — from data URLs or R2
    const shareId = d._shareId || "";
    const incomingMems = await Promise.all(d.memories.map(async m => {
      if (m.mediaUrls && m.mediaUrls.length > 0) {
        const migratedUrls = await Promise.all(m.mediaUrls.map(async med => {
          // Legacy: inline data URL
          if (med.url && med.url.startsWith("data:")) {
            try {
              const stored = await storeMedia(med.url, med.name || "photo");
              return { mediaId: stored.mediaId, name: med.name || "photo" };
            } catch(e) { return med; }
          }
          // R2: fetch photo from share media endpoint
          if (med._r2ref && shareId) {
            try {
              const r = await fetch(WORKER_URL + "/share/media/" + shareId + "/" + encodeURIComponent(med._r2ref));
              if (r.ok) {
                const blob = await r.blob();
                const dataUrl = await new Promise(res => { const reader = new FileReader(); reader.onload = () => res(reader.result); reader.readAsDataURL(blob); });
                const stored = await storeMedia(dataUrl, med.name || "photo");
                return { mediaId: stored.mediaId, name: med.name || "photo" };
              }
            } catch(e) {}
          }
          return med;
        }));
        m = { ...m, mediaUrls: migratedUrls };
      }
      if (!isShared || !m.content || existingIds.has(m.id)) return m; // skip content-wrap if we already own this memory
      const existingPerspectives = m.perspectives || [];
      const alreadyHasSender = existingPerspectives.some(p=>p.author===senderName);
      const perspectives = alreadyHasSender ? existingPerspectives : [
        ...existingPerspectives,
        { author:senderName, content:m.content, addedAt:d.sharedAt||new Date().toISOString(), isOwn:false }
      ];
      const existingPeople = m.people || [];
      const people = senderName && !existingPeople.includes(senderName) ? [...existingPeople, senderName] : existingPeople;
      return {...m, content:"", perspectives, sharedBy:senderName, sharedByEmail:senderEmail, sharedAt:d.sharedAt, people, visibility:"private"};
    }));
    const toAdd = incomingMems.filter(m=>!existingIds.has(m.id));
    const merged = memories.map(m=>{
      const incoming = incomingMems.find(im=>im.id===m.id);
      if (!incoming) return m;
      const existing = m.perspectives||[];
      const newP = (incoming.perspectives||[]).filter(p=>!existing.some(e=>e.author===p.author));
      return {...m, perspectives:[...existing,...newP], sharedBy:incoming.sharedBy||m.sharedBy};
    });
    const finalMems = [...merged,...toAdd].sort((a,b)=>sortKey(a)-sortKey(b));
    const updatedEmails = {...(peopleEmails||{})};
    if (senderName && senderEmail) updatedEmails[senderName] = senderEmail;
    const backupPeople = d.knownPeople||[...new Set(d.memories.flatMap(m=>m.people||[]))];
    const backupOrgs = d.knownOrgs||[...new Set(d.memories.flatMap(m=>m.orgs||[]))];
    persistSubject({memories:finalMems,
      knownPeople:[...new Set([...knownPeople,...backupPeople])].sort(),
      knownOrgs:[...new Set([...knownOrgs,...backupOrgs])].sort(),
      peopleEmails:updatedEmails
    });
    setPendingShare(null);
    // Upgrade pre-connection if sender email or name matches
    if (senderEmail || senderName) {
      try {
        const conns = JSON.parse(localStorage.getItem("chronicle-connections")||"[]");
        let updated = false;
        // Try email match first
        let idx = senderEmail ? conns.findIndex(c=>c.email===senderEmail&&c.preConnected) : -1;
        // Fallback: try name match (sender might have a different email than expected)
        if (idx < 0 && senderName) idx = conns.findIndex(c=>c.name===senderName&&c.preConnected);
        if (idx >= 0) {
          conns[idx] = {...conns[idx], preConnected:false, connectedAt:new Date().toISOString()};
          // Update email if the sender used a different one than we had on file
          if (senderEmail && conns[idx].email !== senderEmail) conns[idx].email = senderEmail;
          updated = true;
        }
        if (updated) { localStorage.setItem("chronicle-connections",JSON.stringify(conns)); setLocalConnections([...conns]); }
      } catch(e) {}
    }
    // Navigate to the first imported memory
    if (toAdd.length > 0) { setSelected(toAdd[0].id); setView("detail"); }
    else if (incomingMems.length > 0) { setSelected(incomingMems[0].id); setView("detail"); }
  }

  // ── Cloud sync functions ─────────────────────────────────────────────────
  // In-flight guard. Two parallel doSync calls (e.g., user double-clicks
  // "Sync now" or two side-effects fire it) used to read+merge+write
  // independently, so the slower writer would silently overwrite the
  // faster one. The ref-based guard lets a second call return immediately
  // without blocking the first.
  const syncInFlightRef = React.useRef(false);

  async function chooseSyncFile() {
    if (!window.showOpenFilePicker) {
      alert("Cloud sync requires Chrome or Edge on desktop. Use manual backup/restore instead.");
      return;
    }
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: "Chronicle sync file", accept: { "application/json": [".json"] } }],
        multiple: false,
        mode: "readwrite",
      });
      setSyncFileHandle(handle);
      const info = { name: handle.name, lastSync: null };
      setSyncInfo(info);
      localStorage.setItem("chronicle-sync-info", JSON.stringify(info));
      // Immediately do a first sync
      await doSync(handle);
    } catch(e) {
      if (e.name !== "AbortError") console.error("chooseSyncFile:", e);
    }
  }

  async function createSyncFile() {
    if (!window.showSaveFilePicker) {
      alert("Cloud sync requires Chrome or Edge on desktop. Use manual backup/restore instead.");
      return;
    }
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: "chronicle-sync.json",
        types: [{ description: "Chronicle sync file", accept: { "application/json": [".json"] } }]
      });
      setSyncFileHandle(handle);
      const info = { name: handle.name, lastSync: null };
      setSyncInfo(info);
      localStorage.setItem("chronicle-sync-info", JSON.stringify(info));
      // Write current data to the new file
      const json = await buildBackupJson();
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      const now = new Date().toISOString();
      const updated = { ...info, lastSync: now };
      setSyncInfo(updated);
      localStorage.setItem("chronicle-sync-info", JSON.stringify(updated));
      setSyncStatus("done");
      setTimeout(() => setSyncStatus(""), 3000);
    } catch(e) {
      if (e.name !== "AbortError") { console.error("createSyncFile:", e); setSyncStatus("error"); }
    }
  }

  async function doSync(handle) {
    let h = handle || syncFileHandle;
    if (!h) {
      await chooseSyncFile();
      return;
    }
    if (syncInFlightRef.current || importInFlightRef.current) {
      // Another sync or backup-import is mid-flight; ignore this call to
      // avoid trampling its write.
      return;
    }
    syncInFlightRef.current = true;
    setSyncStatus("syncing");
    try {
      const perm = await h.queryPermission({mode:"readwrite"});
      if (perm !== "granted") {
        const req = await h.requestPermission({mode:"readwrite"});
        if (req !== "granted") { setSyncStatus("error: permission denied — please re-open the sync file"); setTimeout(()=>setSyncStatus(""),8000); return; }
      }
      // 1. Read the sync file. The `exported` timestamp is the baseline we
      //    use later to detect concurrent writes from a second device.
      const file = await h.getFile();
      const text = await file.text();
      let remote;
      try { remote = JSON.parse(text); } catch(e) { remote = null; }
      const baselineExported = remote?.exported || null;

      // 2. Build a local v3 snapshot we can compare and write
      const localJson = await buildBackupJson();
      const local = JSON.parse(localJson);

      // 3. Per-subject merge with the remote
      let mergedSubjects = local.subjects || [];
      let mergedTopLevel = {};
      let mergedActiveId = local.activeSubjectId || null;
      // Counts for the post-sync summary toast.
      let subjectsAdded = 0, subjectsMerged = 0, memoriesBefore = 0, memoriesAfter = 0;
      if (remote) {
        const remoteSubjects = readBackupSubjects(remote);
        const restoredRemotes = [];
        for (const r of remoteSubjects) {
          restoredRemotes.push(await restoreSubjectMedia(r));
        }
        memoriesBefore = (local.subjects||[]).reduce((s,sub)=>s+(sub.memories||[]).length, 0);
        const usedRemoteIds = new Set();
        mergedSubjects = (local.subjects || []).map(localS => {
          let rem = restoredRemotes.find(r => r.id === localS.id);
          if (!rem) {
            const ln = (localS.name||"").trim().toLowerCase();
            if (ln) rem = restoredRemotes.find(r => (r.name||"").trim().toLowerCase() === ln && !usedRemoteIds.has(r.id));
          }
          if (rem) { usedRemoteIds.add(rem.id); subjectsMerged++; }
          return rem ? mergeSubjects(localS, rem) : localS;
        });
        const newRemotes = restoredRemotes.filter(r => !usedRemoteIds.has(r.id));
        subjectsAdded = newRemotes.length;
        mergedSubjects = [...mergedSubjects, ...newRemotes];
        memoriesAfter = mergedSubjects.reduce((s,sub)=>s+(sub.memories||[]).length, 0);
        // If the user has no active subject locally (e.g. fresh install) or the
        // active one was removed elsewhere, take the remote's. Otherwise keep
        // the local active subject — that's what the user is working on now.
        const localActiveStillThere = mergedSubjects.some(s => s.id === mergedActiveId);
        if (!mergedActiveId || !localActiveStillThere) {
          mergedActiveId = remote.activeSubjectId || mergedSubjects[0]?.id || null;
        }
        mergedTopLevel = {
          wantPublicProfile: (typeof remote.wantPublicProfile === "boolean") ? remote.wantPublicProfile : (local.wantPublicProfile || false),
          profileAbout:      remote.profileAbout      || local.profileAbout      || "",
          profileImageUrl:   remote.profileImageUrl   || local.profileImageUrl   || "",
          allowFollowers:    (typeof remote.allowFollowers === "boolean") ? remote.allowFollowers : (local.allowFollowers !== false),
          profilePrivacy:    remote.profilePrivacy    || local.profilePrivacy    || "open",
          profileDisplayName:remote.profileDisplayName|| local.profileDisplayName|| "",
        };
      }

      // 4. Apply merged data to local state and persist
      setData(prev => {
        const newData = {
          ...prev,
          subjects: mergedSubjects,
          activeSubjectId: mergedActiveId,
          ...mergedTopLevel,
        };
        if (activePassword) saveEncrypted(activePassword, newData);
        else saveData(newData);
        return newData;
      });

      // 5. Build the v3 file content from the merged result and write back.
      //    All mediaIds (both originally-local and just-restored-from-remote) are
      //    valid IDB references at this point, so we can embed them as data: URLs.
      const allMedia = await idbGetAll();
      const dataUrl = (blob) => new Promise(res => { const r = new FileReader(); r.onload = ev => res(ev.target.result); r.readAsDataURL(blob); });
      async function embedMemsFile(mems) {
        return Promise.all((mems||[]).map(async m => ({
          ...m,
          mediaUrls: await Promise.all((m.mediaUrls||[]).map(async med => {
            if (med && med.mediaId && allMedia[med.mediaId]) {
              return { mediaId: med.mediaId, name: med.name, url: await dataUrl(allMedia[med.mediaId]) };
            }
            return med;
          })),
        })));
      }
      async function embedEntityPhotosFile(ep) {
        const out = {};
        await Promise.all(Object.entries(ep||{}).map(async ([key, med]) => {
          if (med && med.mediaId && allMedia[med.mediaId]) {
            out[key] = { mediaId: med.mediaId, name: med.name, url: await dataUrl(allMedia[med.mediaId]) };
          } else if (med) out[key] = med;
        }));
        return out;
      }
      const subjectsForFile = await Promise.all(mergedSubjects.map(async s => ({
        ...s,
        memories:    await embedMemsFile(s.memories || []),
        candidates:  await embedMemsFile(s.candidates || []),
        entityPhotos: await embedEntityPhotosFile(s.entityPhotos || {}),
      })));
      const newExported = new Date().toISOString();
      const mergedJson = JSON.stringify({
        version: 3,
        exported: newExported,
        activeSubjectId: mergedActiveId,
        subjects: subjectsForFile,
        wantPublicProfile: mergedTopLevel.wantPublicProfile ?? local.wantPublicProfile,
        profileAbout:      mergedTopLevel.profileAbout      || local.profileAbout      || "",
        profileImageUrl:   mergedTopLevel.profileImageUrl   || local.profileImageUrl   || "",
        allowFollowers:    typeof mergedTopLevel.allowFollowers === "boolean" ? mergedTopLevel.allowFollowers : (local.allowFollowers !== false),
        profilePrivacy:    mergedTopLevel.profilePrivacy    || local.profilePrivacy    || "open",
        profileDisplayName:mergedTopLevel.profileDisplayName|| local.profileDisplayName|| "",
        carerMode: local.carerMode || false,
        carerName: local.carerName || "",
        carerEmail: local.carerEmail || "",
        suppressConnectRequests: local.suppressConnectRequests || [],
        _connections: local._connections || [],
      }, null, 2);
      if ((await h.queryPermission({mode:"readwrite"})) !== "granted") {
        await h.requestPermission({mode:"readwrite"});
      }

      // Concurrent-write guard. Re-read the file just before writing — if its
      // exported timestamp doesn't match what we read at step 1, another
      // device synced in between and our merge is stale. Aborting here means
      // the user just hits Sync again to pick up their changes.
      const fileNow = await h.getFile();
      const textNow = await fileNow.text();
      let remoteNow = null;
      try { remoteNow = JSON.parse(textNow); } catch(e) { remoteNow = null; }
      const currentExported = remoteNow?.exported || null;
      if (baselineExported && currentExported && currentExported !== baselineExported) {
        setSyncStatus("error: file changed on another device — press Sync again to merge their changes");
        setTimeout(() => setSyncStatus(""), 9000);
        return;
      }

      const writable = await h.createWritable();
      await writable.write(mergedJson);
      await writable.close();

      const now = new Date().toISOString();
      const updated = { name: h.name, lastSync: now, lastExported: newExported };
      setSyncInfo(updated);
      localStorage.setItem("chronicle-sync-info", JSON.stringify(updated));

      // Build a human-readable summary. Memories delta is across all subjects.
      const memDelta = memoriesAfter - memoriesBefore;
      const parts = [];
      if (subjectsAdded > 0) parts.push("added " + subjectsAdded + " subject" + (subjectsAdded===1?"":"s"));
      if (subjectsMerged > 0) parts.push("merged " + subjectsMerged + " subject" + (subjectsMerged===1?"":"s"));
      if (memDelta > 0) parts.push("+" + memDelta + " memor" + (memDelta===1?"y":"ies"));
      const summary = parts.length === 0 ? "synced \u2014 nothing changed" : "synced \u2014 " + parts.join(", ");
      setSyncStatus(summary);
      setTimeout(() => setSyncStatus(""), 6000);
    } catch(e) {
      console.error("doSync:", e);
      let msg;
      const m = (e && e.message) ? e.message : "";
      if (e && (e.name === "NotAllowedError" || /permission/i.test(m))) {
        msg = "error: Sync file permission denied — choose the file again under Settings > Backup.";
      } else if (e && e.name === "NotFoundError") {
        msg = "error: Sync file not found. Disconnect and reselect it under Settings > Backup.";
      } else if (e && (e.name === "QuotaExceededError" || /quota/i.test(m))) {
        msg = "error: Out of disk space.";
      } else if (/network|fetch|failed to fetch|networkerror/i.test(m)) {
        msg = "error: Couldn't reach the server. Check your connection and try again.";
      } else {
        msg = "error: " + (m || "unknown error — check the browser console for details");
      }
      setSyncStatus(msg);
      setTimeout(() => setSyncStatus(""), 8000);
    } finally {
      syncInFlightRef.current = false;
    }
  }

  async function clearSyncFile() {
    setSyncFileHandle(null);
    setSyncInfo(null);
    localStorage.removeItem("chronicle-sync-info");
  }

  async function buildBackupJson() {
    // v3: every subject in the user's data is included so multi-subject sync /
    // backup is round-trippable. Media blobs are embedded as base64 data: URLs
    // and re-stored into IDB on import. Use the live data ref via setData to
    // avoid stale closure if a save happened mid-build.
    const allMedia = await idbGetAll();
    async function embedMems(mems) {
      return Promise.all((mems||[]).map(async m => {
        const urls = await Promise.all((m.mediaUrls||[]).map(async med => {
          if (med && med.mediaId && allMedia[med.mediaId]) {
            const blob = allMedia[med.mediaId];
            const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = ev => res(ev.target.result); r.readAsDataURL(blob); });
            return { mediaId: med.mediaId, name: med.name, url: dataUrl };
          }
          return med;
        }));
        return { ...m, mediaUrls: urls };
      }));
    }
    async function embedEntityPhotos(ep) {
      const out = {};
      await Promise.all(Object.entries(ep||{}).map(async ([key, med]) => {
        if (med && med.mediaId && allMedia[med.mediaId]) {
          const blob = allMedia[med.mediaId];
          const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = ev => res(ev.target.result); r.readAsDataURL(blob); });
          out[key] = { mediaId: med.mediaId, name: med.name, url: dataUrl };
        } else if (med) out[key] = med;
      }));
      return out;
    }
    // Use the active subject's IN-MEMORY mems (memoriesRef captures the latest in async ctx)
    // and pull every other subject straight from data.subjects.
    const allSubjects = data.subjects || [];
    const subjectsWithMedia = await Promise.all(allSubjects.map(async (s) => {
      const mems = (s.id === activeSubjectId) ? memoriesRef.current : (s.memories || []);
      return {
        ...s,
        memories:    await embedMems(mems),
        candidates:  await embedMems(s.candidates || []),
        entityPhotos: await embedEntityPhotos(s.entityPhotos || {}),
      };
    }));
    return JSON.stringify({
      version: 3,
      exported: new Date().toISOString(),
      activeSubjectId: data.activeSubjectId || null,
      subjects: subjectsWithMedia,
      // Cross-subject (top-level) fields
      wantPublicProfile: data.wantPublicProfile || false,
      profileAbout: data.profileAbout || "",
      profileImageUrl: data.profileImageUrl || "",
      allowFollowers: data.allowFollowers !== false,
      profilePrivacy: data.profilePrivacy || "open",
      profileDisplayName: data.profileDisplayName || "",
      carerMode: data.carerMode || false,
      carerName: data.carerName || "",
      carerEmail: data.carerEmail || "",
      suppressConnectRequests: data.suppressConnectRequests || [],
      _connections: (() => { try { return JSON.parse(localStorage.getItem("chronicle-connections")||"[]"); } catch(e) { return []; } })(),
    }, null, 2);
  }

  async function buildBackupBlob(backupPassword) {
    const json = await buildBackupJson();
    if (backupPassword) {
      const stored = await encryptData(backupPassword, json);
      const wrapped = JSON.stringify({version:2, encrypted:true, ...stored});
      return { blob: new Blob([wrapped],{type:"application/json"}), encrypted:true };
    }
    return { blob: new Blob([json],{type:"application/json"}), encrypted:false };
  }

  async function exportBackup() {
    const bp = subject.backupPassword || "";
    const { blob } = await buildBackupBlob(bp);
    const suffix = bp ? "-encrypted" : "";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const safeName = subject.name.replace(/[^a-z0-9]/gi,"-").toLowerCase();
    a.download = `chronicle-${safeName}-${new Date().toISOString().slice(0,10)}${suffix}.json`;
    a.click();
    // Record last backup time
    persistSubject({lastBackup: new Date().toISOString(), memCountAtBackup: memoriesRef.current.length});
  }


  // ────────────────────────────────────────────────────────────────
  // GEDCOM parser
  // ────────────────────────────────────────────────────────────────
  function parseGedcom(text) {
    // Normalise line endings
    const lines = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n");

    // Build a tree of records
    const records = [];
    let cur = null;
    let stack = [];

    for (const raw of lines) {
      const m = raw.match(/^(\d+)\s+(@[^@]+@|\w+)\s*(.*)?$/);
      if (!m) continue;
      const level = parseInt(m[1]);
      const tag   = m[2];
      const value = (m[3]||"").trim();

      const node = { tag, value, children: [] };

      if (level === 0) {
        records.push(node);
        cur = node;
        stack = [node];
      } else {
        // pop back to correct parent
        while (stack.length > level) stack.pop();
        const parent = stack[stack.length - 1];
        if (parent) parent.children.push(node);
        stack[level] = node;
      }
    }

    // Helper: get first child value by tag
    function child(node, tag) {
      const c = node.children.find(n=>n.tag===tag);
      return c ? c.value : null;
    }
    function children(node, tag) {
      return node.children.filter(n=>n.tag===tag);
    }
    // Concatenate CONT/CONC continuations
    function fullText(node) {
      let t = node.value || "";
      for (const c of node.children) {
        if (c.tag === "CONT") t += "\n" + (c.value||"");
        if (c.tag === "CONC") t += (c.value||"");
      }
      return t.trim();
    }

    // Parse a DATE value into {year, month, day, fuzzy}
    function parseDate(raw) {
      if (!raw) return null;
      const months = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
      function mnum(s) { return months[(s||"").replace(/\.$/,"").slice(0,3).toUpperCase()] || 0; }
      // BET x AND y — take the first date
      let bet = raw.match(/^BET\s+(.+?)\s+AND\s+/i);
      if (bet) raw = bet[1].trim();
      // FROM x TO y — take FROM date
      let frm = raw.match(/^FROM\s+(.+?)(?:\s+TO\s+|$)/i);
      if (frm) raw = frm[1].trim();
      // Strip leading qualifiers including those with trailing period: Abt. Bef. Aft.
      let s = raw.replace(/^(ABT\.?|EST\.?|CAL\.?|BEF\.?|AFT\.?|CIR\.?|CIRCA|ABOUT|BEFORE|AFTER|TO|INT)\s*/i,"").trim();
      // Take only first part of ambiguous ranges like "1786 or 1790"
      s = s.replace(/\s+or\s+.*$/i,"").trim();
      // Extract recognisable date from garbled strings like "IN ACTION 4 OCT 1918"
      const embedded = s.match(/(\d{1,2})\s+([A-Z]+\.?)\s+(\d{3,4})/i);
      if (embedded) s = embedded[0];
      if (!s) return null;
      let mr;
      // DD MON YYYY (various separators, month may have trailing period: "1 Oct. 1880", "23-Oct-1853", "11 Nov.1957")
      mr = s.match(/^(\d{1,2})[-\s]+([A-Z]+\.?)[-\s]*(\d{3,4})$/i);
      if (mr) { const m=mnum(mr[2]); if(m) return {year:parseInt(mr[3]),month:m,day:parseInt(mr[1]),fuzzy:"day"}; }
      // DD/MM/YYYY or DD-MM-YYYY (numeric month)
      mr = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{3,4})$/);
      if (mr) return {year:parseInt(mr[3]),month:parseInt(mr[2]),day:parseInt(mr[1]),fuzzy:"day"};
      // MON YYYY (month may have trailing period: "Oct. 1825")
      mr = s.match(/^([A-Z]+\.?)\s+(\d{3,4})$/i);
      if (mr) { const m=mnum(mr[1]); if(m) return {year:parseInt(mr[2]),month:m,day:1,fuzzy:"month"}; }
      // YYYY only
      mr = s.match(/^(\d{3,4})$/);
      if (mr) return {year:parseInt(mr[1]),month:1,day:1,fuzzy:"year"};
      // YYYY-YYYY range — take first year
      mr = s.match(/^(\d{3,4})[-](\d{3,4})$/);
      if (mr) return {year:parseInt(mr[1]),month:1,day:1,fuzzy:"year"};
      // DD MM YYYY (all numeric, space-separated: "17 12 2011")
      mr = s.match(/^(\d{1,2})\s+(\d{1,2})\s+(\d{3,4})$/);
      if (mr) return {year:parseInt(mr[3]),month:parseInt(mr[2]),day:parseInt(mr[1]),fuzzy:"day"};
      // Could not parse — log so the user can investigate via the console.
      // Silent skip means the resulting memory loses date info entirely.
      console.warn("[GEDCOM] could not parse date:", JSON.stringify(raw));
      return null;
    }

    // Map GEDCOM event tag → human title
    const EVENT_TITLES = {
      // Core life events
      BIRT:"Born", DEAT:"Died", BURI:"Buried", CREM:"Cremated",
      // Religious
      BAPM:"Baptised", CHR:"Christened", CHRA:"Christened (adult)",
      CONF:"Confirmed", FCOM:"First communion",
      ORDN:"Ordained", BLES:"Blessed",
      BARM:"Bar Mitzvah", BASM:"Bat Mitzvah",
      // LDS
      BAPL:"Baptism (LDS)", ENDL:"Endowed (LDS)",
      SLGC:"Sealed to parents (LDS)", SLGS:"Sealed to spouse (LDS)",
      // Marriage & family
      MARR:"Married", DIV:"Divorced", ENGA:"Engaged",
      DIVF:"Divorce filed", MARL:"Marriage license",
      MARC:"Marriage contract", MARS:"Marriage settlement",
      ANUL:"Annulment", ADOP:"Adopted",
      // Civic & legal
      EMIG:"Emigrated", IMMI:"Immigrated", NATU:"Naturalised",
      CENS:"Census", RESI:"Resided",
      WILL:"Will written", PROB:"Probate",
      // Career & education
      OCCU:"Occupation", EDUC:"Education", GRAD:"Graduated",
      RETI:"Retired", MILI:"Military service",
      // Property & misc
      PROP:"Property ownership",
      TITL:"Title / nobility",
      FACT:"Fact",
      EVEN:"Event",
    };
    // FAM-level event tags beyond MARR (divorce, engagement, etc.)
    const FAM_EVENT_TITLES = {
      DIV:"Divorced", ENGA:"Engaged", DIVF:"Divorce filed",
      MARL:"Marriage license", MARC:"Marriage contract",
      MARS:"Marriage settlement", ANUL:"Annulment",
      CENS:"Census", RESI:"Resided", EVEN:"Event",
    };

    // Index individuals and families
    const indiMap = {};
    const famMap  = {};
    for (const r of records) {
      if (r.tag.startsWith("@") && r.tag.endsWith("@")) continue;
      if (r.value === "INDI") indiMap[r.tag] = r;
      if (r.value === "FAM")  famMap[r.tag]  = r;
    }
    // Actually the record structure is:  tag=@I1@ value=INDI
    for (const r of records) {
      if (r.tag.match(/^@.*@$/) && r.value === "INDI") indiMap[r.tag] = r;
      if (r.tag.match(/^@.*@$/) && r.value === "FAM")  famMap[r.tag]  = r;
    }

    // Build person list
    const persons = [];
    for (const [id, rec] of Object.entries(indiMap)) {
      const nameNode = rec.children.find(n=>n.tag==="NAME");
      let fullName = nameNode ? fullText(nameNode) : "Unknown";
      // Clean GEDCOM name slashes: /SURNAME/
      fullName = fullName.replace(/\//g,"").replace(/\s+/g," ").trim();

      const birt = rec.children.find(n=>n.tag==="BIRT");
      const deat = rec.children.find(n=>n.tag==="DEAT");
      const birtDate = birt ? parseDate(child(birt,"DATE")) : null;
      const deatDate = deat ? parseDate(child(deat,"DATE")) : null;
      const birtPlace = birt ? child(birt,"PLAC") : null;
      const deatPlace = deat ? child(deat,"PLAC") : null;

      const sex = child(rec, "SEX") || "";
      persons.push({
        id, rec, fullName, sex,
        birtYear: birtDate?.year || null,
        deatYear: deatDate?.year || null,
        birtPlace, deatPlace,
      });
    }
    persons.sort((a,b)=>(a.fullName||"").localeCompare(b.fullName||""));

    // Build memories for a chosen person
    function buildMemories(person) {
      const rec = person.rec;
      const mems = [];
      let idx = 0;

      // ID base derived from the person's GEDCOM id, so events on every
      // tree person stay collision-free even when buildMemories is called
      // for everyone in buildTreeData below.
      const idBase = "ged_" + (person.id||"").replace(/@/g, "") + "_";
      function addMem(title, dateObj, place, note, extraPeople) {
        // Skip events with no date
        if (!dateObj) return;
        if (!title) return;
        const year  = dateObj.year;
        const month = dateObj?.month || 1;
        const day   = dateObj?.day   || 1;
        const fuzzy = dateObj?.fuzzy || "year";
        const loc   = place || "";
        const content = [note, place ? "Place: "+place : ""].filter(Boolean).join("\n\n").trim();
        mems.push({
          id: idBase + (idx++),
          title,
          content,
          year, month, day, fuzzy,
          season: "Early",
          location: loc,
          locations: loc ? [loc] : [],
          tags: [],
          people: extraPeople || [],
          orgs: [],
          mediaUrls: [],
          endFuzzy: null, endYear: null, endMonth:1, endDay:1, endSeason:"Early", endOngoing:false,
          perspectives: [],
          fromGedcom: true,
        });
      }

      // Standard events on the individual record
      const skipTags = new Set(["NAME","SEX","FAMS","FAMC","CHAN","NOTE","SOUR","OBJE","SUBM"]);
      for (const node of rec.children) {
        if (skipTags.has(node.tag)) continue;
        const title = EVENT_TITLES[node.tag];
        if (!title && node.tag !== "EVEN") continue;
        const evTitle = node.tag === "EVEN"
          ? (child(node,"TYPE") || "Event")
          : title;
        const dateObj = parseDate(child(node,"DATE"));
        const place   = child(node,"PLAC");
        // Notes on the event itself
        const noteNodes = children(node,"NOTE");
        const note = noteNodes.map(n=>fullText(n)).filter(Boolean).join("\n\n");
        addMem(evTitle, dateObj, place, note, []);
      }

      // Spouse / marriage info from FAM records
      for (const famRef of rec.children.filter(n=>n.tag==="FAMS")) {
        const fam = famMap[famRef.value];
        if (!fam) continue;
        // Resolve spouse name first — needed both by the marriage event and
        // by other family-level events (census, residence, etc.). Previously
        // this was nested inside the `if (marrNode)` block, so any family
        // event without a marriage record threw a ReferenceError when the
        // FAM-level event loop below referenced spouseName. Hoisting it
        // makes buildMemories safe for everyone in the tree.
        const spouseTag = child(rec,"SEX")==="F" ? "HUSB" : "WIFE";
        const spouseRef = child(fam, spouseTag);
        const spouseRec = spouseRef ? indiMap[spouseRef] : null;
        let spouseName = null;
        if (spouseRec) {
          const sn = spouseRec.children.find(n=>n.tag==="NAME");
          if (sn) spouseName = fullText(sn).replace(/\//g,"").replace(/\s+/g," ").trim();
        }
        const marrNode = fam.children.find(n=>n.tag==="MARR");
        if (marrNode) {
          const dateObj = parseDate(child(marrNode,"DATE"));
          const place   = child(marrNode,"PLAC");
          const evTitle = spouseName ? `Married ${spouseName}` : "Married";
          const note = child(marrNode,"NOTE")||"";
          addMem(evTitle, dateObj, place, note, spouseName ? [spouseName] : []);
        }
        // Other FAM-level events (divorce, engagement, annulment, family census, etc.)
        for (const node of fam.children) {
          if (["HUSB","WIFE","CHIL","MARR"].includes(node.tag)) continue;
          const famEvTitle = FAM_EVENT_TITLES[node.tag] ?? (node.tag==="EVEN" ? (child(node,"TYPE")||"Family event") : null);
          if (!famEvTitle) continue;
          const dateObj = parseDate(child(node,"DATE"));
          const place   = child(node,"PLAC");
          const note    = children(node,"NOTE").map(n=>fullText(n)).filter(Boolean).join("\n\n");
          addMem(famEvTitle, dateObj, place, note, spouseName ? [spouseName] : []);
        }
        // Children — birth and death
        for (const childRef of fam.children.filter(n=>n.tag==="CHIL")) {
          const childRec = indiMap[childRef.value];
          if (!childRec) continue;
          const cn = childRec.children.find(n=>n.tag==="NAME");
          if (!cn) continue;
          const childName = fullText(cn).replace(/\//g,"").replace(/\s+/g," ").trim();
          const birt = childRec.children.find(n=>n.tag==="BIRT");
          const birtDateObj = birt ? parseDate(child(birt,"DATE")) : null;
          const birtPlace   = birt ? child(birt,"PLAC") : null;
          addMem(`Birth of ${childName}`, birtDateObj, birtPlace, "", [childName]);
          const deat = childRec.children.find(n=>n.tag==="DEAT");
          const deatDateObj = deat ? parseDate(child(deat,"DATE")) : null;
          const deatPlace   = deat ? child(deat,"PLAC") : null;
          addMem(`Death of ${childName}`, deatDateObj, deatPlace, "", [childName]);
          const buri = childRec.children.find(n=>n.tag==="BURI");
          const buriDateObj = buri ? parseDate(child(buri,"DATE")) : null;
          const buriPlace   = buri ? child(buri,"PLAC") : null;
          addMem(`Burial of ${childName}`, buriDateObj, buriPlace, "", [childName]);
        }
      }

      // Top-level notes on the individual
      const topNotes = rec.children.filter(n=>n.tag==="NOTE").map(n=>fullText(n)).filter(Boolean).join("\n\n");

      // Sort by year
      mems.sort((a,b)=>sortKey(a)-sortKey(b));

      return { mems, topNotes };
    }

    // ── Build context memories ────────────────────────────────
    // Collect everyone descended from subject's great-grandparents,
    // plus their spouses — i.e. the full family tree within 3 ancestor degrees.
    function buildContextMemories(subject) {
      const subBirth = subject.birtYear;
      const subDeath = subject.deatYear || new Date().getFullYear();

      // Step 1: walk UP to great-grandparents (3 generations)
      function getParents(personId) {
        const rec = indiMap[personId];
        if (!rec) return [];
        const parents = [];
        for (const famRef of rec.children.filter(n=>n.tag==="FAMC")) {
          const fam = famMap[famRef.value];
          if (!fam) continue;
          const husb = child(fam,"HUSB"); const wife = child(fam,"WIFE");
          if (husb) parents.push(husb);
          if (wife) parents.push(wife);
        }
        return parents;
      }

      // Climb 3 levels to find great-grandparents
      let roots = new Set([subject.id]);
      for (let gen = 0; gen < 3; gen++) {
        const nextRoots = new Set(roots);
        for (const id of roots) getParents(id).forEach(p => nextRoots.add(p));
        roots = nextRoots;
      }
      // roots now contains subject + all ancestors up to great-grandparents

      // Step 2: from each blood ancestor/descendant, collect descendants only.
      // Spouses are added to the result set but BFS does NOT continue through them —
      // this prevents pulling in unrelated families connected only by marriage.
      const familySet = new Set(roots);  // blood relatives found so far
      const spouseSet = new Set();        // married-in spouses (not traversed)
      const queue = [...roots];           // only blood relatives queued for traversal
      while (queue.length > 0) {
        const pid = queue.shift();
        const rec = indiMap[pid];
        if (!rec) continue;
        // Walk families where this person is a parent (FAMS)
        for (const famRef of rec.children.filter(n=>n.tag==="FAMS")) {
          const fam = famMap[famRef.value];
          if (!fam) continue;
          // Record the spouse — but do NOT queue them for further traversal
          const husb = child(fam,"HUSB"); const wife = child(fam,"WIFE");
          if (husb && !familySet.has(husb)) spouseSet.add(husb);
          if (wife && !familySet.has(wife)) spouseSet.add(wife);
          // Queue children for blood-descent traversal
          for (const chilRef of fam.children.filter(n=>n.tag==="CHIL")) {
            const cid = chilRef.value;
            if (cid && !familySet.has(cid)) { familySet.add(cid); queue.push(cid); }
          }
        }
      }
      // Merge spouses in — they appear as people but were not traversed
      for (const sid of spouseSet) familySet.add(sid);
      // Remove the subject themselves
      familySet.delete(subject.id);

      // Step 3: detect relationship for each family member
      // Helper: get parent IDs of a person
      function parentIds(personId) {
        const r = indiMap[personId]; if (!r) return [];
        const out = [];
        for (const fr of r.children.filter(n=>n.tag==="FAMC")) {
          const f = famMap[fr.value]; if (!f) continue;
          const h2=child(f,"HUSB"), w=child(f,"WIFE");
          if (h2) out.push(h2); if (w) out.push(w);
        }
        return out;
      }
      // Helper: get child IDs of a person
      function childIds(personId) {
        const r = indiMap[personId]; if (!r) return [];
        const out = [];
        for (const fr of r.children.filter(n=>n.tag==="FAMS")) {
          const f = famMap[fr.value]; if (!f) continue;
          for (const cr of f.children.filter(n=>n.tag==="CHIL")) out.push(cr.value);
        }
        return out;
      }
      // Helper: get spouse IDs of a person
      function spouseIds(personId) {
        const r = indiMap[personId]; if (!r) return [];
        const out = [];
        for (const fr of r.children.filter(n=>n.tag==="FAMS")) {
          const f = famMap[fr.value]; if (!f) continue;
          const h2=child(f,"HUSB"), w=child(f,"WIFE");
          if (h2 && h2!==personId) out.push(h2);
          if (w  && w !==personId) out.push(w);
        }
        return out;
      }
      // Helper: sex of a person
      function getSex(personId) {
        const r = indiMap[personId]; if (!r) return "";
        const s = r.children.find(n=>n.tag==="SEX"); return s ? s.value : "";
      }

      function getRelationship(id) {
        const sex = getSex(id);
        const subParents  = parentIds(subject.id);
        const subParents2 = subParents.flatMap(p=>parentIds(p)); // grandparents
        const subParents3 = subParents2.flatMap(p=>parentIds(p)); // great-grandparents

        // Spouse
        if (spouseIds(subject.id).includes(id)) return "Spouse";
        // Child
        if (childIds(subject.id).includes(id)) return sex==="F"?"Daughter":sex==="M"?"Son":"Child";
        // Parent
        if (subParents.includes(id)) return sex==="F"?"Mother":sex==="M"?"Father":"Parent";
        // Sibling
        const subSiblings = subParents.flatMap(p=>childIds(p)).filter(x=>x!==subject.id);
        if (subSiblings.includes(id)) return sex==="F"?"Sister":sex==="M"?"Brother":"Sibling";
        // Grandparent
        if (subParents2.includes(id)) return sex==="F"?"Grandmother":sex==="M"?"Grandfather":"Grandparent";
        // Grandchild
        const subGrandchildren = childIds(subject.id).flatMap(c=>childIds(c));
        if (subGrandchildren.includes(id)) return sex==="F"?"Granddaughter":sex==="M"?"Grandson":"Grandchild";
        // Aunt/Uncle
        const subAuntsUncles = subParents.flatMap(p=>parentIds(p).flatMap(gp=>childIds(gp))).filter(x=>!subParents.includes(x)&&x!==subject.id);
        if (subAuntsUncles.includes(id)) return sex==="F"?"Aunt":sex==="M"?"Uncle":"Aunt/Uncle";
        // Niece/Nephew (siblings' children)
        const subNiecesNephews = subSiblings.flatMap(s=>childIds(s));
        if (subNiecesNephews.includes(id)) return sex==="F"?"Niece":sex==="M"?"Nephew":"Niece/Nephew";
        // Cousin (children of aunts/uncles)
        const subCousins = subAuntsUncles.flatMap(au=>childIds(au));
        if (subCousins.includes(id)) return "Cousin";
        // Great-grandparent
        if (subParents3.includes(id)) return sex==="F"?"Great-grandmother":sex==="M"?"Great-grandfather":"Great-grandparent";
        // Spouse of sibling (brother/sister-in-law)
        const siblingSpouses = subSiblings.flatMap(s=>spouseIds(s));
        if (siblingSpouses.includes(id)) return sex==="F"?"Sister-in-law":sex==="M"?"Brother-in-law":"Sibling-in-law";
        // Spouse of child (son/daughter-in-law)
        const childSpouses = childIds(subject.id).flatMap(c=>spouseIds(c));
        if (childSpouses.includes(id)) return sex==="F"?"Daughter-in-law":sex==="M"?"Son-in-law":"Child-in-law";
        // Parent of spouse (mother/father-in-law)
        const spouseParents = spouseIds(subject.id).flatMap(s=>parentIds(s));
        if (spouseParents.includes(id)) return sex==="F"?"Mother-in-law":sex==="M"?"Father-in-law":"Parent-in-law";
        // Second cousin (children of cousins)
        const subSecondCousins = subCousins.flatMap(c=>childIds(c));
        if (subSecondCousins.includes(id)) return "Second cousin";
        // Great-aunt/uncle (siblings of grandparents)
        const subGreatAuntsUncles = subParents2.flatMap(gp=>parentIds(gp).flatMap(ggp=>childIds(ggp))).filter(x=>!subParents2.includes(x)&&!subParents3.includes(x));
        if (subGreatAuntsUncles.includes(id)) return sex==="F"?"Great-aunt":sex==="M"?"Great-uncle":"Great-aunt/uncle";
        return "";
      }

      // Step 4: build context people array
      const contextPeople = [];
      for (const id of familySet) {
        const rec = indiMap[id];
        if (!rec) continue;
        const nameNode = rec.children.find(n=>n.tag==="NAME");
        if (!nameNode) continue;
        const fullName = fullText(nameNode).replace(/\//g,"").replace(/\s+/g," ").trim();
        if (!fullName) continue;
        const birt2 = rec.children.find(n=>n.tag==="BIRT");
        const deat2 = rec.children.find(n=>n.tag==="DEAT");
        const birthYear = birt2 ? parseDate(child(birt2,"DATE"))?.year : null;
        const deathYear = deat2 ? parseDate(child(deat2,"DATE"))?.year : null;
        // Must overlap with subject lifespan
        const personBirth = birthYear || 0;
        const personDeath = deathYear || new Date().getFullYear();
        if (personDeath < subBirth || personBirth > subDeath) continue;

        const relationship = getRelationship(id);

        // Extract events within subject lifespan
        const events = [];
        let evIdx = 0;
        function addCtxEvent(evTitle, dateObj, place, note, extraPeople) {
          if (!evTitle) return;
          const yr = dateObj?.year || null;
          // Skip dateless events — no useful timeline placement
          if (!yr) return;
          // Skip events outside subject's lifespan
          if (yr < subBirth || yr > subDeath) return;
          const relLabel = relationship ? " ["+relationship+"]" : "";
          const titleStr = fullName + relLabel + " " + evTitle.charAt(0).toLowerCase() + evTitle.slice(1);
          const contentStr = [note, place ? "Place: "+place : ""].filter(Boolean).join("\n\n").trim();

          events.push({
            id: "ged_ctx_" + id + "_" + (evIdx++),
            title: titleStr, content: contentStr,
            year: yr, month: dateObj?.month||1, day: dateObj?.day||1,
            fuzzy: dateObj?.fuzzy||"year", season:"Early",
            location: place||"", locations: place?[place]:[],
            tags:[], people:[fullName,...extraPeople],
            orgs:[], mediaUrls:[], endFuzzy:null, endYear:null,
            endMonth:1, endDay:1, endSeason:"Early", endOngoing:false,
            perspectives:[], fromGedcom:true, gedcomContext:true, visibility:"private",
          });
        }
        const skipTags2 = new Set(["NAME","SEX","FAMS","FAMC","CHAN","NOTE","SOUR","OBJE","SUBM"]);
        for (const node of rec.children) {
          if (skipTags2.has(node.tag)) continue;
          const evLabel = EVENT_TITLES[node.tag];
          if (!evLabel && node.tag !== "EVEN") continue;
          const evTitle = node.tag==="EVEN" ? (child(node,"TYPE")||"Event") : evLabel;
          const dateObj = parseDate(child(node,"DATE"));
          const place   = child(node,"PLAC");
          const note    = children(node,"NOTE").map(n=>fullText(n)).filter(Boolean).join("\n\n");
          addCtxEvent(evTitle, dateObj, place, note, []);
        }
        for (const famRef of rec.children.filter(n=>n.tag==="FAMS")) {
          const fam = famMap[famRef.value];
          if (!fam) continue;
          const spouseTag = child(rec,"SEX")==="F" ? "HUSB" : "WIFE";
          const spouseRef = child(fam,spouseTag);
          const spouseRec = spouseRef ? indiMap[spouseRef] : null;
          let spouseName = null;
          if (spouseRec) {
            const sn = spouseRec.children.find(n=>n.tag==="NAME");
            if (sn) spouseName = fullText(sn).replace(/\//g,"").replace(/\s+/g," ").trim();
          }
          // Marriage
          const marrNode = fam.children.find(n=>n.tag==="MARR");
          if (marrNode) {
            addCtxEvent(spouseName?"Married "+spouseName:"Married", parseDate(child(marrNode,"DATE")), child(marrNode,"PLAC"), "", spouseName?[spouseName]:[]);
          }
          // Other FAM-level events (divorce, engagement, annulment, family census…)
          for (const node of fam.children) {
            if (["HUSB","WIFE","CHIL","MARR"].includes(node.tag)) continue;
            const famEvTitle = FAM_EVENT_TITLES[node.tag] ?? (node.tag==="EVEN" ? (child(node,"TYPE")||"Family event") : null);
            if (!famEvTitle) continue;
            const note = children(node,"NOTE").map(n=>fullText(n)).filter(Boolean).join("\n\n");
            addCtxEvent(famEvTitle, parseDate(child(node,"DATE")), child(node,"PLAC"), note, spouseName?[spouseName]:[]);
          }
          // Don't add the relative's children's birth/death from this relative's
          // perspective — those events belong to the children themselves and would
          // otherwise appear duplicated for each parent. The child's own birth/death
          // event is added when we iterate the child as a relative.
        }
        if (events.length===0) continue;
        events.sort((a,b)=>(a.year||0)-(b.year||0));
        contextPeople.push({ id, fullName, relationship, birthYear, deathYear, events });
      }

      // Sort: Spouse, Parent, Child, Sibling first, then by birth year
      const relOrder = {Spouse:0,Parent:1,Child:2,Sibling:3};
      contextPeople.sort((a,b)=>{
        const oa=relOrder[a.relationship]??4, ob=relOrder[b.relationship]??4;
        if (oa!==ob) return oa-ob;
        return (a.birthYear||9999)-(b.birthYear||9999);
      });
      return contextPeople;
    }

    function buildTreeData() {
      // Index the rich `persons` list (built earlier in this closure) by
      // GEDCOM id so we can hand each one to buildMemories without
      // re-walking the record. Each tree person carries its full event
      // list, so promoting any one to a Chronicle later picks up
      // everything the GEDCOM said about them — not just family-derived
      // events like births and deaths.
      const personByGedId = Object.fromEntries(persons.map(p => [p.id, p]));
      const treePersons = Object.entries(indiMap).map(([gedId, rec]) => {
        const nameNode = rec.children.find(n=>n.tag==="NAME");
        let name = nameNode ? fullText(nameNode) : "Unknown";
        name = name.replace(/\//g,"").replace(/\s+/g," ").trim();
        const birt = rec.children.find(n=>n.tag==="BIRT");
        const deat = rec.children.find(n=>n.tag==="DEAT");
        const birtDate = birt ? parseDate(child(birt,"DATE")) : null;
        const deatDate = deat ? parseDate(child(deat,"DATE")) : null;
        const sex = child(rec,"SEX") || "";
        const topNotes = rec.children.filter(n=>n.tag==="NOTE").map(n=>fullText(n)).filter(Boolean).join("\n\n");
        // Pull the full event list for this person (births, baptisms,
        // marriages, residences, military service, deaths, burials, etc.).
        const p = personByGedId[gedId];
        const events = p ? (buildMemories(p).mems || []) : [];
        return {
          id: "tp_"+gedId.replace(/@/g,""),
          gedId, name, sex,
          dob: birtDate?.year ? String(birtDate.year) : "",
          dod: deatDate?.year ? String(deatDate.year) : "",
          birthPlace: birt ? (child(birt,"PLAC")||"") : "",
          deathPlace: deat ? (child(deat,"PLAC")||"") : "",
          notes: topNotes,
          events,
          subjectId: null,
        };
      });

      const treeFamilies = Object.entries(famMap).map(([gedId, rec]) => {
        const husbRef = child(rec,"HUSB");
        const wifeRef = child(rec,"WIFE");
        const childRefs = rec.children.filter(n=>n.tag==="CHIL").map(n=>n.value);
        const marrNode = rec.children.find(n=>n.tag==="MARR");
        const marrDate = marrNode ? parseDate(child(marrNode,"DATE")) : null;
        return {
          id: "tf_"+gedId.replace(/@/g,""),
          gedId,
          husbandId: husbRef ? "tp_"+husbRef.replace(/@/g,"") : null,
          wifeId: wifeRef ? "tp_"+wifeRef.replace(/@/g,"") : null,
          childIds: childRefs.map(r=>"tp_"+r.replace(/@/g,"")),
          marriageYear: marrDate?.year || null,
          marriagePlace: marrNode ? (child(marrNode,"PLAC")||"") : "",
        };
      });

      return { treePersons, treeFamilies };
    }

    return { persons, buildMemories, buildContextMemories, buildTreeData };
  }

  function handleGedFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setGedBusy(true);
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const result = parseGedcom(ev.target.result);
        setGedPersons(result);
        setGedPicked(null);
        setGedPreview(null);
        setGedSearch("");
      } catch(err) {
        console.error("[GEDCOM] parse error:", err);
        // Translate parser internals into actionable guidance for users.
        const m = (err && err.message) || "";
        let msg = "Couldn't read this GEDCOM file.\n\n";
        if (/encoding|utf|ansel|character/i.test(m)) {
          msg += "It looks like the file uses an unusual character encoding. Re-export from your genealogy app with UTF-8 selected.";
        } else if (/header|HEAD|gedcom version/i.test(m)) {
          msg += "The file is missing the standard GEDCOM header. Re-export from your genealogy app — most apps offer 'Standard GEDCOM' as an export option.";
        } else if (/empty|no individuals|0 people|no persons/i.test(m)) {
          msg += "The file doesn't contain any individuals. It may be a partial export — try re-exporting with all people included.";
        } else if (/JSON|unexpected token|syntax/i.test(m)) {
          msg += "This doesn't look like a GEDCOM file. Make sure you've selected a .ged file (not a JSON or zip).";
        } else {
          msg += "It may be corrupted or use a non-standard format. Try re-exporting from your genealogy app, or use a different tool to convert it to standard GEDCOM 5.5.";
        }
        msg += "\n\n(Technical detail: " + (m || "unknown error") + ")";
        alert(msg);
      }
      setGedBusy(false);
    };
    reader.onerror = () => {
      console.error("[GEDCOM] file read error:", reader.error);
      alert("Couldn't read the file. It may be too large, in use by another app, or you may not have permission to access it. Try copying it somewhere local and re-selecting.");
      setGedBusy(false);
    };
    reader.readAsText(file, "utf-8");
  }

  function handleGedPick(person) {
    setGedPicked(person);
    if (!gedPersons) return;
    const { mems, topNotes } = gedPersons.buildMemories(person);
    const subjId = "subj_ged_" + Date.now();
    const newSubj = {
      ...emptySubject(subjId, person.fullName, false),
      dob: person.birtYear ? String(person.birtYear) : "",
      notes: topNotes || "",
      knownPeople: [...new Set(mems.flatMap(m=>m.people))],
      knownLocations: [...new Set(mems.map(m=>m.location).filter(Boolean))],
    };
    setGedPreview({ subj: newSubj, mems });
    // Build context — overlapping people and their events
    const contextPeople = gedPersons.buildContextMemories(person);
    // Default: all events selected, all people expanded
    const allEventIds = new Set(contextPeople.flatMap(p=>p.events.map(e=>e.id)));
    setGedContext(contextPeople.map(p=>({...p,expanded:true})));
    setGedContextSel(allEventIds);
  }

  function commitGedImport() {
    if (!gedPreview) return;
    const { subj, mems } = gedPreview;
    // Collect selected context events
    const contextMems = gedContext.flatMap(p=>p.events.filter(e=>gedContextSel.has(e.id)));
    const allMems = [...mems, ...contextMems].sort((a,b)=>(a.year||0)-(b.year||0));
    // Add context people to knownPeople
    const contextPeople = gedContext.map(p=>p.fullName);
    const allPeople = [...new Set([...subj.knownPeople,...contextPeople,...allMems.flatMap(m=>m.people)])].sort();
    const allLocations = [...new Set([...subj.knownLocations,...allMems.map(m=>m.location).filter(Boolean)])].sort();
    // Build relationship map
    const rels = {};
    gedContext.forEach(p=>{ if(p.relationship) rels[p.fullName]=p.relationship; });
    const finalSubj = { ...subj, memories:allMems, knownPeople:allPeople, knownLocations:allLocations,
      peopleRelationships:{...subj.peopleRelationships,...rels} };
    setData(prev => ({
      ...prev,
      subjects: [...prev.subjects, finalSubj],
      activeSubjectId: subj.id,
    }));
    setGedPersons(null); setGedPicked(null); setGedPreview(null);
    setGedContext([]); setGedContextSel(new Set());
    setView("life");
    alert(`Imported ${allMems.length} memories for ${subj.name} — ${mems.length} personal events and ${contextMems.length} from ${gedContext.length} overlapping people.`);
  }

  function commitGedTreeImport(focalGedId) {
    try {
      return _doCommitGedTreeImport(focalGedId);
    } catch (e) {
      console.error("commitGedTreeImport failed:", e);
      alert("Tree import failed: " + (e && e.message ? e.message : "unknown error") + ". The browser console has the full stack trace.");
    }
  }
  function _doCommitGedTreeImport(focalGedId) {
    if (!gedPersons) return;
    const { treePersons: newPersons, treeFamilies: newFamilies } = gedPersons.buildTreeData();

    // Fresh import — no existing tree to worry about.
    if (!treePersons || treePersons.length === 0) {
      const gedFocalPersonId = focalGedId ? ("tp_"+focalGedId.replace(/@/g,"")) : (newPersons[0]?.id || null);
      persistSubject({treePersons: newPersons, treeFamilies: newFamilies, gedFocalPersonId});
      setGedPersons(null); setGedPicked(null); setGedPreview(null);
      setGedContext([]); setGedContextSel(new Set());
      setGedTreeImportDone(true);
      setTimeout(()=>setGedTreeImportDone(false), 4000);
      setView("tree");
      return;
    }

    // Adding to an existing tree. Detect overlap by GEDCOM @id@ — heavy
    // overlap suggests a re-export of the same family, so we update those
    // records in place. New IDs (a sibling branch / different family) get
    // namespaced with a 4-char batch prefix so they can't collide with
    // anything already in the tree.
    const existingByGedId = Object.fromEntries((treePersons||[]).map(p=>[p.gedId, p]));
    const newGedIds = newPersons.map(p => p.gedId);
    const overlap = newGedIds.filter(id => existingByGedId[id]).length;
    const sameFamily = overlap > 0 && (overlap / newGedIds.length) > 0.5;

    let mode;
    if (sameFamily) {
      const proceed = window.confirm(
        "This GEDCOM looks like an updated export of your existing family ("
        + overlap + " of " + newGedIds.length + " people match by ID).\n\n"
        + "OK \u2014 update matching people with the new data, keep their Chronicle links, and add any new people.\n\n"
        + "Cancel \u2014 add as a separate branch instead (existing data left untouched)."
      );
      mode = proceed ? "update" : "append";
    } else {
      const proceed = window.confirm(
        "You already have " + treePersons.length + " people in your family tree.\n\n"
        + "OK \u2014 add this GEDCOM as a separate branch. Existing people are preserved; new IDs are namespaced so nothing collides.\n\n"
        + "Cancel \u2014 abort the import."
      );
      if (!proceed) return;
      mode = "append";
    }

    let merged, mergedFamilies, gedFocalPersonId;
    if (mode === "update") {
      const newByGedId = Object.fromEntries(newPersons.map(p => [p.gedId, p]));
      const updatedExisting = (treePersons||[]).map(p => {
        const fresh = newByGedId[p.gedId];
        return fresh ? {...fresh, subjectId: p.subjectId} : p;
      });
      const existingGedIds = new Set((treePersons||[]).map(p => p.gedId));
      const brandNew = newPersons.filter(p => !existingGedIds.has(p.gedId));
      merged = [...updatedExisting, ...brandNew];

  // ── Photo import ─────────────────────────────────────────────
  async function processPhotos(files) {
    const items=[];
    for (const file of files) {
      if (!file.type.startsWith("image/")) continue;
      await new Promise(resolve=>{
        const br=new FileReader(); br.onload=async bev=>{
          const exif = extractExif(bev.target.result);
          const hasDate = exif.year != null;

          const dataUrl = await new Promise(res=>{ const ur=new FileReader(); ur.onload=ev=>res(ev.target.result); ur.readAsDataURL(file); });
          const med = await storeMedia(dataUrl, file.name);
          const nb=file.name.replace(/\.[^.]+$/,"").replace(/[-_]/g," ");
          // Reverse geocode GPS if available
          let gpsLocation = "";
          if (exif.gps) {
            try {
              const gr = await fetch("https://nominatim.openstreetmap.org/reverse?lat="+exif.gps.lat+"&lon="+exif.gps.lng+"&format=json&zoom=14", {headers:{"User-Agent":"Chronicle-Journal-App"}});
              if (gr.ok) { const gd = await gr.json(); gpsLocation = gd.address ? [gd.address.suburb||gd.address.village||gd.address.town||gd.address.city, gd.address.state, gd.address.country].filter(Boolean).join(", ") : (gd.display_name||"").split(",").slice(0,3).join(",").trim(); }
            } catch(e) {}
          }
          items.push({
            id: Date.now().toString()+Math.random(),
            med,                                    // {mediaId, name} for IDB
            url: dataUrl,                           // temp preview only, not persisted
            name: file.name,
            exifDate: hasDate ? exif : null,
            exifGps: exif.gps || null,
            year:  hasDate ? exif.year  : new Date().getFullYear(),
            month: hasDate ? exif.month : 1,
            day:   hasDate ? exif.day   : 1,
            fuzzy: hasDate ? "day" : "year",
            season: "Early",
            title: nb.length>2 ? nb : "Photo",
            tags: [], people: [], orgs: [], location: gpsLocation, keep: true
          });
          resolve();
        }; br.readAsArrayBuffer(file);
      });
    }
    setPhotoQueue(q=>[...q,...items]);
  }

  function updatePhoto(id,u) { setPhotoQueue(q=>q.map(p=>p.id===id?{...p,...u}:p)); }

  // Route a single photo into the full Add form so the user can use
  // every option (Pets, End date, Sources, Event Type, Display name,
  // Additional locations, Research Note, Candidate, etc.) rather than
  // the trimmed quick-import grid.
  function editPhotoFully(photo) {
    setForm({
      ...newForm(),
      title: photo.title || "",
      content: photo.content || "",
      year: photo.year || 0, month: photo.month || 1, day: photo.day || 0,
      fuzzy: photo.fuzzy || "day", season: photo.season || "Early",
      location: photo.location || "",
      locations: photo.location ? [photo.location] : [],
      tags: photo.tags || [],
      people: photo.people || [],
      orgs: photo.orgs || [],
      mediaUrls: photo.med ? [photo.med] : [],
    });
    // Drop it from the queue — the form is now the source of truth for
    // this photo. If the user cancels, they can re-drag the image.
    setPhotoQueue(q => q.filter(p => p.id !== photo.id));
    setEditingId(null);
    setView("add");
  }

  function savePhotos() {
    let toSave = photoQueue.filter(p=>p.keep&&p.title.trim());
    // Free tier: limit to 3 photo imports per day
    if (!hasTier("basic")) {
      const used = getDailyCount("photos");
      const remaining = Math.max(0, 3 - used);
      if (remaining === 0) { alert("Free accounts can import up to 3 photos per day. Subscribe to import unlimited photos."); return; }

<script>
  if ("serviceWorker" in navigator) {
    // Listen for update notifications from the SW
    navigator.serviceWorker.addEventListener("message", event => {
      if (event.data && event.data.type === "UPDATE_AVAILABLE") {
        const banner = document.createElement("div");
        banner.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c2416;color:#f5f0e8;padding:10px 20px;border-radius:4px;font-family:'Crimson Text',serif;font-size:0.92rem;z-index:1000;box-shadow:0 4px 16px rgba(0,0,0,0.3);display:flex;align-items:center;gap:12px;";
        banner.appendChild(document.createTextNode("Chronicle has been updated "));
        const reloadBtn = document.createElement("button");
        reloadBtn.textContent = "Reload";
        reloadBtn.style.cssText = "background:#4a7a5a;color:#fff;border:none;padding:5px 14px;border-radius:2px;cursor:pointer;font-family:inherit;font-size:0.88rem";
        reloadBtn.addEventListener("click", () => location.reload());
        banner.appendChild(reloadBtn);
        document.body.appendChild(banner);
      }
    });
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").then(reg => {
        console.log("[Chronicle] Service worker registered:", reg.scope);
        // Long-running tabs (the typical Chronicle session) won't trigger
        // a navigation that re-fetches sw.js. Re-check on visibility-
        // change so users who leave the tab open and come back still
        // pick up new versions, and once an hour as a backstop.
        function checkForUpdate() {
          try { reg.update(); } catch (e) {}
        }
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") checkForUpdate();
        });
        setInterval(checkForUpdate, 60 * 60 * 1000);
      }).catch(err => {
        console.warn("[Chronicle] Service worker registration failed:", err);
      });
    });
  }
</script>
